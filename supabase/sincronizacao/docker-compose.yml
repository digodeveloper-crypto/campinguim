# Serviço PowerSync auto-hospedado do ambiente local (decisão E1), ligado ao Postgres do Supabase
# local. Derivado da prova técnica (prova/sincronizacao/docker-compose.yml), com a imagem em versão
# fixa. Sobe e para pelo script do ambiente (scripts/ambiente/ambiente.mjs). Variáveis com
# credencial vêm de .env.local na raiz, que fica fora do git.
name: campinguim-sincronizacao

services:
  # Armazenamento interno do serviço (MongoDB com um nó de "replica set"). Sem porta no
  # computador: só o serviço PowerSync fala com ele, pela rede interna do Docker.
  mongo:
    image: mongo:7.0
    command: --replSet rs0 --bind_ip_all --quiet
    restart: "no"
    volumes:
      - mongo_dados:/data/db

  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      - mongo
    restart: on-failure
    entrypoint:
      - bash
      - -c
      - 'mongosh --host mongo:27017 --eval ''try{rs.status().ok && quit(0)} catch {} rs.initiate({_id: "rs0", version: 1, members: [{ _id: 0, host : "mongo:27017" }]})'''

  powersync:
    image: journeyapps/powersync-service:1.29.1
    command: ["start", "-r", "unified"]
    restart: "no"
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:?falta PS_DATA_SOURCE_URI em .env.local (rode npm run ambiente:subir)}
      PS_MONGO_URI: mongodb://mongo:27017/powersync_campinguim
      PS_PORT: ${PS_PORT:-8080}
    volumes:
      - ./powersync:/config:ro
    ports:
      - ${PS_PORT:-8080}:${PS_PORT:-8080}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${PS_PORT:-8080}/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 30
    networks:
      - default
      - supabase

volumes:
  mongo_dados:

networks:
  # Rede criada pelo `supabase start`: supabase_network_<project_id> (supabase/config.jsonc).
  supabase:
    name: supabase_network_campinguim
    external: true
