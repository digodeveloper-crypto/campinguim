# P9 (S10), B em modo avião: 5 alterações ("no carro" nos itens 01 a 05). Enquanto isso o
# servidor tira B da viagem.
appId: com.campinguim.prova
---
- extendedWaitUntil:
    visible:
      id: lista-nome
    timeout: 20000
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 01"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 02"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 03"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 04"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 05"
- extendedWaitUntil:
    visible:
      id: fila
      text: "5 altera.*"
    timeout: 10000
