# P1 (S1), aparelho A, em modo avião: marca 10 itens "no carro", confere a fila com 10, fecha o
# app (parada forçada, mais dura que tirar da lista de recentes), reabre e confere que a fila
# continua com 10 (princípio 3: a fila sobrevive a fechar o app).
appId: com.campinguim.prova
---
- extendedWaitUntil:
    visible:
      id: lista-nome
    timeout: 20000
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 01"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 02"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 03"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 04"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 05"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 06"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 07"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 08"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 09"
- runFlow:
    file: tocar.yaml
    env:
      ID: "carro-Item 10"
- extendedWaitUntil:
    visible:
      id: fila
      text: "10 altera.*"
    timeout: 10000
- stopApp
# Reabre a frio direto na lista (o link é a forma de abrir a viagem).
- openLink: campinguim://lista/${TRIP}
- extendedWaitUntil:
    visible:
      id: lista-nome
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: fila
      text: "10 altera.*"
    timeout: 20000
