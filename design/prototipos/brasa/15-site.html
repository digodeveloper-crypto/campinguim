<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.15"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="15">
<div class="br-tela br-pagina br-site">
  <header class="br-pagina-cabeca">
    <span class="br-marca-nome" data-texto="app.nome"></span>
  </header>

  <section class="br-site-abertura" aria-labelledby="t-site">
    <span class="br-apoio br-mascote-medio br-site-mascote"><span data-mascote="principal" data-mascote-texto=""></span></span>
    <h1 id="t-site" data-texto="brasa.t15_titulo"></h1>
    <p class="br-site-oquee" data-texto="site.oQueE"></p>
  </section>

  <section class="br-bloco" aria-labelledby="t-lista">
    <h2 id="t-lista" data-texto="bloco.lista_pronta"></h2>
    <p class="br-suave" data-texto="brasa.site_lista_intro"></p>
    <p class="br-cartao br-estado br-cor-texto" data-dado="site.resumoLista"></p>
    <div class="br-pilha" id="categorias"></div>
  </section>

  <section class="br-bloco br-cartao br-espera" aria-labelledby="t-espera">
    <h2 id="t-espera" data-texto="bloco.lista_espera"></h2>
    <p class="br-suave" data-texto="brasa.site_espera_intro"></p>
    <form class="br-pilha" id="form-espera">
      <div class="br-campo">
        <label class="br-campo-rotulo" for="email" data-texto="campo.seu_email"></label>
        <input class="br-entrada" id="email" type="email" autocomplete="email" required>
      </div>
      <label class="br-caixa"><span class="br-caixa-alvo"><input type="checkbox" id="consentimento" required><span class="br-caixa-marca" aria-hidden="true"><span data-icone="ciente"></span></span></span><span class="br-caixa-texto" data-texto="site.consentimento"></span></label>
      <div class="br-halo"><button class="br-botao" type="submit" data-texto="acao.lista_espera"></button></div>
    </form>
    <p class="br-estado br-cor-carro" id="espera-ok" role="status" hidden></p>
  </section>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */

  /* A mesma lista da tela 4, só leitura, categorias recolhíveis, sem estados de marcação. */
  var caixa = document.getElementById("categorias");
  C.dado("lista.categorias").forEach(function (cat) {
    var id = "site-" + cat.id;
    var aberta = false;
    var botao = el("button", "br-categoria-botao", { type: "button", "aria-expanded": "false", "aria-controls": id }, [
      B.icone("recolher"),
      el("span", "br-categoria-nome", { "data-texto": "categoria." + cat.id }),
      el("span", "br-categoria-progresso br-rotulo br-numero", { texto: String(cat.itens.length) })
    ]);
    var lista = el("ul", "br-cartao br-itens", { id: id, hidden: true });
    cat.itens.forEach(function (i) {
      lista.appendChild(el("li", "br-item-simples", null, [
        el("span", "br-item-simples-texto", { texto: i.nome }),
        el("span", "br-numero br-site-qtd", { texto: i.quantidadeTexto })
      ]));
    });
    botao.addEventListener("click", function () {
      aberta = !aberta;
      botao.setAttribute("aria-expanded", aberta ? "true" : "false");
      lista.hidden = !aberta;
    });
    caixa.appendChild(el("section", "br-categoria", null, [el("h3", "br-categoria-h", null, [botao]), lista]));
  });

  /* Lista de espera: ao enviar, "Pronto. Avisaremos por e-mail." (nada sai do aparelho no protótipo). */
  document.getElementById("form-espera").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var ok = document.getElementById("espera-ok");
    ok.hidden = false;
    ok.innerHTML = "";
    ok.appendChild(B.icone("ciente"));
    ok.appendChild(el("span", null, { "data-texto": "mensagem.lista_espera_ok" }));
    document.getElementById("form-espera").hidden = true;
    ok.setAttribute("tabindex", "-1");
    ok.focus();
  });

  B.iniciar();
})();
</script>
</body>
</html>
