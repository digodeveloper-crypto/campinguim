<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.8"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="8">
<header class="br-tela br-topo br-topo--empilhada">
  <p class="br-momento"><span data-icone="casa"></span><span data-texto="brasa.momento_volta"></span></p>
  <p class="br-destaque" id="progresso" data-texto="mensagem.progresso_conferidos"></p>
  <div class="br-progresso" aria-hidden="true"><span id="barra"></span></div>
  <p class="br-frase" data-texto="brasa.t8_frase"></p>
</header>
<div class="br-tela br-atras" aria-hidden="true"></div>
<main class="br-tela br-folha br-folha--empilhada">
  <div class="br-alca">
    <span class="br-alca-marca"><span data-mascote="uma-cor"></span></span>
    <span class="br-alca-traco" aria-hidden="true"></span>
    <a class="br-fechar" href="07-estadia.html" data-fechar><span data-icone="fechar"></span><span data-texto="acao.fechar"></span></a>
  </div>
  <div class="br-corpo">
    <h1 data-texto="brasa.t8_titulo"></h1>

    <section class="br-bloco" aria-labelledby="b-desmontagem">
      <h2 id="b-desmontagem" data-texto="bloco.desmontagem"></h2>
      <ul class="br-pilha" id="desmontagem"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-conferir">
      <div class="br-bloco-cabeca">
        <h2 id="b-conferir" data-texto="bloco.conferir_volta"></h2>
      </div>
      <div class="br-pilha br-categorias" id="categorias"></div>
    </section>

    <section class="br-bloco" aria-labelledby="b-casa">
      <h2 id="b-casa" data-texto="bloco.em_casa"></h2>
      <ul class="br-pilha" id="em-casa"></ul>
    </section>
  </div>
  <div class="br-rodape">
    <div class="br-halo"><a class="br-botao" href="09-em-casa.html" data-texto="acao.concluir"></a></div>
  </div>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */
  var volta = C.dado("volta");
  var conferidos = {};
  var secar = {};
  var cabecas = {};

  function atualizar() {
    var total = C.itens().length;
    var feitos = Object.keys(conferidos).length;
    document.getElementById("progresso").setAttribute("data-valores", JSON.stringify({ feitos: feitos, total: total }));
    document.getElementById("barra").style.width = (100 * feitos / total) + "%";
    Object.keys(cabecas).forEach(function (id) {
      var cat = C.categoria(id);
      var n = cat.itens.filter(function (i) { return conferidos[i.id]; }).length;
      cabecas[id].setAttribute("data-valores", JSON.stringify({ feitos: n, total: cat.itens.length }));
    });
  }

  /* Tarefa com marca "feito" (desmontagem e em casa). */
  function tarefa(texto) {
    var b = el("button", "br-alterna br-cor-carro", { type: "button", "aria-pressed": "false", "data-texto-aria": "brasa.marcar_feito", valores: { nome: texto } }, [
      B.icone("conferido"), el("span", null, { "data-texto": "estado.feito" })
    ]);
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
    return el("li", "br-linha", null, [
      el("div", "br-linha-nome", null, [el("span", "br-linha-titulo", { texto: texto })]),
      el("div", "br-linha-acoes", null, [b])
    ]);
  }
  volta.desmontagem.forEach(function (t) { document.getElementById("desmontagem").appendChild(tarefa(t)); });
  volta.emCasa.forEach(function (t) { document.getElementById("em-casa").appendChild(tarefa(t)); });

  /* Todos os itens da lista, nas mesmas categorias, "não conferido" no início. */
  function linha(item) {
    var li = el("li", "br-linha br-linha-volta");
    function montar() {
      var ok = !!conferidos[item.id], seca = !!secar[item.id];
      li.classList.toggle("br-pendente", !ok);
      li.innerHTML = "";
      var estado = ok
        ? el("span", "br-estado br-cor-carro", null, [B.icone("conferido", "br-ativo"), el("span", null, { "data-texto": "estado.conferido" })])
        : el("span", "br-estado br-cor-texto", null, [B.icone("conferido"), el("span", null, { "data-texto": "estado.nao_conferido" })]);
      var detalhe = el("span", "br-linha-detalhe", null, [el("span", "br-numero br-cor-texto", { texto: item.quantidadeTexto }), estado]);
      var nome = el("div", "br-linha-nome", null, [el("span", "br-linha-titulo", { texto: item.nome }), detalhe]);
      if (seca) nome.appendChild(el("span", "br-estado br-cor-separei", null, [B.icone("secar", "br-ativo"), el("span", null, { "data-texto": "mensagem.lembrete", valores: { dias: volta.lembreteDias } })]));
      var bOk = el("button", "br-alterna br-cor-carro", { type: "button", "aria-pressed": ok ? "true" : "false", "data-texto-aria": "brasa.marcar_conferido", valores: { nome: item.nome } }, [
        B.icone("conferido"), el("span", null, { "data-texto": "estado.conferido" })
      ]);
      var bSeca = el("button", "br-alterna br-cor-separei", { type: "button", "aria-pressed": seca ? "true" : "false", "data-texto-aria": "brasa.marcar_secar", valores: { nome: item.nome } }, [
        B.icone("secar"), el("span", null, { "data-texto": "estado.secar" })
      ]);
      bOk.addEventListener("click", function () {
        if (ok) delete conferidos[item.id]; else conferidos[item.id] = true;
        montar(); li.querySelector(".br-cor-carro.br-alterna").focus(); atualizar();
      });
      bSeca.addEventListener("click", function () {
        if (seca) delete secar[item.id]; else secar[item.id] = true;
        montar(); li.querySelector(".br-cor-separei.br-alterna").focus();
      });
      li.appendChild(nome);
      li.appendChild(el("div", "br-linha-acoes br-linha-acoes--largas", null, [bOk, bSeca]));
    }
    montar();
    return li;
  }

  var caixa = document.getElementById("categorias");
  C.dado("lista.categorias").forEach(function (cat) {
    var idLista = "volta-" + cat.id;
    var aberta = true;
    var prog = el("span", "br-categoria-progresso br-rotulo", { "data-texto": "mensagem.progresso_conferidos" });
    cabecas[cat.id] = prog;
    var botao = el("button", "br-categoria-botao", { type: "button", "aria-expanded": "true", "aria-controls": idLista }, [
      B.icone("recolher"), el("span", "br-categoria-nome", { "data-texto": "categoria." + cat.id }), prog
    ]);
    var lista = el("ul", "br-pilha", { id: idLista });
    cat.itens.forEach(function (i) { lista.appendChild(linha(C.item(i.id))); });
    botao.addEventListener("click", function () {
      aberta = !aberta;
      botao.setAttribute("aria-expanded", aberta ? "true" : "false");
      lista.hidden = !aberta;
    });
    caixa.appendChild(el("section", "br-categoria", null, [el("h3", "br-categoria-h", null, [botao]), lista]));
  });

  atualizar();
  B.iniciar();
})();
</script>
</body>
</html>
