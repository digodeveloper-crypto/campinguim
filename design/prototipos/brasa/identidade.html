<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.identidade"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="identidade">
<header class="br-tela br-topo">
  <p class="br-momento" data-texto="brasa.id_territorio_frase"></p>
  <h1 class="br-nome-app" data-texto="direcao.nome"></h1>
  <p class="br-frase" data-texto="direcao.frase"></p>
</header>
<main class="br-tela br-folha">
  <div class="br-alca" aria-hidden="true"><span class="br-alca-traco"></span></div>
  <div class="br-corpo">
    <p class="br-titulo" data-texto="brasa.id_titulo_folha"></p>

    <!-- 2 · Paleta -->
    <section class="br-bloco" aria-labelledby="b-paleta">
      <h2 id="b-paleta" data-texto="brasa.id_paleta"></h2>
      <p class="br-suave" data-texto="brasa.id_paleta_intro"></p>
      <div class="br-amostras" id="paleta"></div>
      <h3 data-texto="brasa.id_contraste"></h3>
      <div class="br-tabela-caixa">
        <table class="br-tabela" id="contrastes">
          <thead><tr><th scope="col" data-texto="brasa.id_par"></th><th scope="col" class="br-numero" data-texto="brasa.id_escuro"></th><th scope="col" class="br-numero" data-texto="brasa.id_claro"></th><th scope="col" class="br-numero" data-texto="brasa.id_minimo"></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 3 · Tipografia -->
    <section class="br-bloco" aria-labelledby="b-tipo">
      <h2 id="b-tipo" data-texto="brasa.id_tipografia"></h2>
      <div class="br-cartao">
        <p class="br-titulo" data-texto="brasa.id_escala_titulo"></p>
        <p class="br-bloco-titulo" data-texto="brasa.id_escala_bloco"></p>
        <p data-texto="brasa.id_escala_corpo"></p>
        <p class="br-rotulo" data-texto="brasa.id_escala_rotulo"></p>
      </div>
      <p data-texto="brasa.id_fraunces"></p>
      <p data-texto="brasa.id_atkinson"></p>
      <p class="br-suave" data-texto="brasa.id_licenca"></p>
      <a class="br-ligacao" href="../_compartilhado/fontes/fraunces/OFL.txt"><span class="br-ligacao-texto"><span data-texto="brasa.id_ofl_fraunces"></span></span></a>
      <a class="br-ligacao" href="../_compartilhado/fontes/atkinsonhyperlegible/OFL.txt"><span class="br-ligacao-texto"><span data-texto="brasa.id_ofl_atkinson"></span></span></a>
    </section>

    <!-- 4 · Ícones -->
    <section class="br-bloco" aria-labelledby="b-icones">
      <h2 id="b-icones" data-texto="brasa.id_icones"></h2>
      <p class="br-suave" data-texto="brasa.id_icones_intro"></p>
      <h3 data-texto="brasa.id_estados"></h3>
      <ul class="br-icones-grade" id="icones-estados"></ul>
      <h3 data-texto="brasa.id_demais"></h3>
      <ul class="br-icones-grade" id="icones-demais"></ul>
    </section>

    <!-- 5 · Navegação -->
    <section class="br-bloco" aria-labelledby="b-nav">
      <h2 id="b-nav" data-texto="brasa.id_navegacao"></h2>
      <p class="br-bloco-linha" data-texto="direcao.navegacao"></p>
      <div class="br-esquema" role="img" data-texto-aria="brasa.id_esquema_rotulo">
        <div class="br-esquema-celular" aria-hidden="true">
          <div class="br-esquema-topo" data-texto="brasa.id_esquema_topo"></div>
          <div class="br-esquema-atras"></div>
          <div class="br-esquema-folha">
            <span data-texto="brasa.id_esquema_folha"></span>
            <span class="br-esquema-faixa"></span>
            <span class="br-esquema-faixa"></span>
            <span class="br-esquema-botao br-halo" data-texto="brasa.id_esquema_acao"></span>
            <span class="br-esquema-areas"><span></span><span></span><span></span><span></span></span>
          </div>
        </div>
      </div>
      <ul class="br-pilha br-lista-pontos">
        <li data-texto="brasa.id_nav_1"></li>
        <li data-texto="brasa.id_nav_2"></li>
        <li data-texto="brasa.id_nav_3"></li>
        <li data-texto="brasa.id_nav_4"></li>
        <li data-texto="brasa.id_nav_5"></li>
      </ul>
    </section>

    <!-- 6 · Mascote -->
    <section class="br-bloco" aria-labelledby="b-mascote">
      <h2 id="b-mascote" data-texto="brasa.id_mascote"></h2>
      <ul class="br-mascotes-uso">
        <li><span class="br-apoio"><span data-mascote="principal" data-mascote-texto=""></span></span><span data-texto="brasa.id_m_principal"></span></li>
        <li><span class="br-apoio"><span data-mascote="pose-alerta" data-mascote-texto=""></span></span><span data-texto="brasa.id_m_alerta"></span></li>
        <li><span class="br-apoio"><span data-mascote="pose-comemorando" data-mascote-texto=""></span></span><span data-texto="brasa.id_m_comemorando"></span></li>
        <li><span class="br-apoio"><span data-mascote="pose-camping" data-mascote-texto=""></span></span><span data-texto="brasa.id_m_camping"></span></li>
        <li><span class="br-apoio"><span data-mascote="pose-neutro" data-mascote-texto=""></span></span><span data-texto="brasa.id_m_neutro"></span></li>
        <li><span data-mascote="uma-cor" data-mascote-texto=""></span><span data-texto="brasa.id_m_umacor"></span></li>
      </ul>
      <div class="br-cartao br-id-escuro" data-tema="escuro">
        <span class="br-apoio br-mascote-medio"><span data-mascote="principal" data-mascote-texto=""></span></span>
        <p data-texto="brasa.id_m_amostra_escuro"></p>
      </div>
      <p data-texto="brasa.id_m_apoio"></p>
      <p class="br-suave" data-texto="brasa.id_m_regras"></p>
    </section>

    <!-- 7 · Tom de voz -->
    <section class="br-bloco" aria-labelledby="b-tom">
      <h2 id="b-tom" data-texto="brasa.id_tom"></h2>
      <p class="br-suave" data-texto="brasa.id_tom_intro"></p>
      <ul class="br-pilha" id="tom"></ul>
    </section>

    <!-- 8 · Origem e riscos -->
    <section class="br-bloco" aria-labelledby="b-origem">
      <h2 id="b-origem" data-texto="brasa.id_origem"></h2>
      <p data-texto="brasa.id_origem_texto"></p>
      <ul class="br-pilha br-lista-pontos">
        <li data-texto="brasa.id_risco_1"></li>
        <li data-texto="brasa.id_risco_2"></li>
        <li data-texto="brasa.id_risco_3"></li>
        <li data-texto="brasa.id_risco_4"></li>
      </ul>
    </section>
  </div>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */
  var PAPEIS = ["fundo", "superficie", "texto", "texto-suave", "linha", "acento", "sobre-acento", "atencao", "separei", "carro", "apoio-mascote"];

  /* Os valores vêm de estilo.css: um elemento em cada tema lê as variáveis. */
  function leitor(tema) {
    var e = el("div", null, { "data-tema": tema, "aria-hidden": "true", hidden: true });
    document.querySelector(".br-corpo").appendChild(e);
    var cs = getComputedStyle(e);
    var r = {};
    PAPEIS.concat(["corpo-mascote"]).forEach(function (p) { r[p] = cs.getPropertyValue("--" + p).trim().toUpperCase(); });
    e.remove();
    return r;
  }
  var escuro = leitor("escuro"), claro = leitor("claro");

  /* 2 · Paleta: escuro (o principal) e claro, lado a lado. */
  var paleta = document.getElementById("paleta");
  paleta.appendChild(el("div", "br-amostra br-amostra-cabeca", { "aria-hidden": "true" }, [
    el("p", "br-rotulo", { "data-texto": "brasa.id_escuro" }), el("p", "br-rotulo", { "data-texto": "brasa.id_claro" })
  ]));
  PAPEIS.forEach(function (p) {
    var linha = el("div", "br-amostra-papel");
    linha.appendChild(el("p", "br-rotulo", { "data-texto": "brasa.papel." + p }));
    var par = el("div", "br-amostra");
    [["escuro", escuro], ["claro", claro]].forEach(function (t) {
      var valor = t[1][p];
      var transparente = !valor || valor === "TRANSPARENT";
      var cor = el("div", "br-cor", { "data-tema": t[0] }, [
        el("span", "br-cor-pastilha", { style: "background: var(--" + p + ")" }),
        el("span", "br-cor-valor", transparente ? { "data-texto": "brasa.id_dispensado" } : { texto: valor })
      ]);
      par.appendChild(cor);
    });
    linha.appendChild(par);
    paleta.appendChild(linha);
  });

  /* Contraste: os 14 pares de cada tema (WCAG 2.x), mais o corpo do mascote contra o halo. */
  function lum(hex) {
    var h = hex.replace("#", "");
    var c = [0, 2, 4].map(function (i) {
      var v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function razao(a, b) {
    if (!/^#[0-9A-F]{6}$/.test(a) || !/^#[0-9A-F]{6}$/.test(b)) return null;
    var x = lum(a), y = lum(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }
  function numero(v) { return v === null ? null : v.toFixed(2).replace(".", ","); }
  var PARES = [
    ["texto_fundo", "texto", "fundo", 7], ["texto_superficie", "texto", "superficie", 7],
    ["suave_fundo", "texto-suave", "fundo", 4.5], ["suave_superficie", "texto-suave", "superficie", 4.5],
    ["sobre_acento", "sobre-acento", "acento", 4.5], ["acento_fundo", "acento", "fundo", 3],
    ["linha_superficie", "linha", "superficie", 3], ["linha_fundo", "linha", "fundo", 3],
    ["atencao_superficie", "atencao", "superficie", 4.5], ["atencao_fundo", "atencao", "fundo", 4.5],
    ["separei_superficie", "separei", "superficie", 4.5], ["separei_fundo", "separei", "fundo", 4.5],
    ["carro_superficie", "carro", "superficie", 4.5], ["carro_fundo", "carro", "fundo", 4.5]
  ];
  var corpo = document.querySelector("#contrastes tbody");
  function linhaContraste(chave, e, c, minimo) {
    var tr = el("tr");
    tr.appendChild(el("th", null, { scope: "row", "data-texto": "brasa.par." + chave }));
    tr.appendChild(el("td", "br-numero", e === null ? { "data-texto": "brasa.id_dispensado" } : { texto: e }));
    tr.appendChild(el("td", "br-numero", c === null ? { "data-texto": "brasa.id_dispensado" } : { texto: c }));
    tr.appendChild(el("td", "br-numero", { texto: numero(minimo) }));
    corpo.appendChild(tr);
  }
  PARES.forEach(function (p) {
    linhaContraste(p[0], numero(razao(escuro[p[1]], escuro[p[2]])), numero(razao(claro[p[1]], claro[p[2]])), p[3]);
  });
  /* Corpo do mascote (#4A5560, cor oficial da arte) contra o apoio do escuro. */
  var CORPO_MASCOTE = "#4A5560";
  linhaContraste("mascote_apoio", numero(razao(CORPO_MASCOTE, escuro["apoio-mascote"])), null, 3);

  /* 4 · Ícones: os de estado em repouso e ativos; os demais, com o nome. */
  var estados = document.getElementById("icones-estados");
  window.BRASA_ICONES.estados.forEach(function (n) {
    estados.appendChild(el("li", null, null, [
      el("span", "br-icones-par", null, [
        el("span", "br-cor-texto", { "aria-hidden": "true" }, [B.icone(n)]),
        el("span", "br-cor-" + (n === "carro" ? "carro" : n === "atencao" || n === "faltou" || n === "comprar" ? "atencao" : n === "ciente" || n === "conferido" || n === "sobrou" ? "carro" : "separei"), { "aria-hidden": "true" }, [B.icone(n, "br-ativo")])
      ]),
      el("span", null, { "data-texto": "brasa.icone." + n })
    ]));
  });
  var demais = document.getElementById("icones-demais");
  window.BRASA_ICONES.nomes.forEach(function (n) {
    if (window.BRASA_ICONES.estados.indexOf(n) >= 0) return;
    demais.appendChild(el("li", null, null, [B.icone(n), el("span", null, { "data-texto": "brasa.icone." + n })]));
  });

  /* 7 · Tom de voz: três frases da direção, com os dados do cenário. */
  var p = C.progresso({});
  var chuveiro = C.dado("alertas").filter(function (a) { return a.id === "chuveiro"; })[0];
  var tom = document.getElementById("tom");
  tom.appendChild(el("li", "br-cartao br-citacao", { "data-texto": "brasa.faltam_n", valores: { n: p.total - p.noCarro } }));
  tom.appendChild(el("li", "br-cartao br-citacao", { "data-texto": "brasa.tom_chuveiro", valores: { alerta: chuveiro.texto } }));
  tom.appendChild(el("li", "br-cartao br-citacao", { "data-texto": "brasa.tudo_no_carro" }));

  B.iniciar();
})();
</script>
</body>
</html>
