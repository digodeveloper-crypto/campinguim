<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.11"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="11">
<header class="br-tela br-topo">
  <p class="br-momento"><span data-icone="grupo"></span><span data-texto="brasa.momento_antes"></span></p>
  <p class="br-onde" data-dado="grupo.nomeViagem.texto"></p>
  <p class="br-destaque" id="familias-n" data-texto="brasa.familias_n"></p>
  <p class="br-frase" id="frase" data-texto="brasa.sem_dono_frase"></p>
</header>
<main class="br-tela br-folha">
  <div class="br-alca">
    <span class="br-alca-marca"><span data-mascote="uma-cor"></span></span>
    <span class="br-alca-traco" aria-hidden="true"></span>
  </div>
  <div class="br-corpo">
    <h1 data-texto="brasa.t11_titulo"></h1>

    <section class="br-bloco" aria-labelledby="b-ninguem">
      <h2 class="br-estado-titulo" id="b-ninguem"><span class="br-cor-atencao" data-icone="pessoa"></span><span data-texto="bloco.ninguem_pegou"></span></h2>
      <ul class="br-pilha" id="sem-dono"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-duplicado">
      <h2 class="br-estado-titulo" id="b-duplicado"><span class="br-cor-atencao" data-icone="atencao"></span><span data-texto="bloco.duplicado"></span></h2>
      <ul class="br-pilha" id="duplicados"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-leva">
      <h2 id="b-leva" data-texto="bloco.quem_leva"></h2>
      <ul class="br-pilha" id="quem-leva"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-familias">
      <h2 id="b-familias" data-texto="bloco.familias"></h2>
      <ul class="br-pilha" id="familias"></ul>
    </section>

    <a class="br-ligacao br-cartao" href="14-convidado.html">
      <span data-icone="ver"></span>
      <span class="br-ligacao-texto"><span data-texto="acao.ver_convidado"></span></span>
      <span data-icone="abrir"></span>
    </a>
  </div>
  <div class="br-rodape">
    <p class="br-estado br-cor-carro" id="lembrete" role="status" hidden></p>
    <div class="br-halo"><button class="br-botao" type="button" id="lembrar"><span data-icone="lembrar"></span><span data-texto="acao.lembrar"></span></button></div>
    <nav data-seletor="grupo"></nav>
  </div>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */
  var g = C.dado("grupo");
  var itens = {};
  g.itens.lista.forEach(function (i) { itens[i.id] = i; });
  var semDono = g.semDono.slice();

  document.getElementById("familias-n").setAttribute("data-valores", JSON.stringify({ n: g.familias.length }));
  function frase() { document.getElementById("frase").setAttribute("data-valores", JSON.stringify({ n: semDono.length })); }
  frase();

  /* Ninguém pegou: "eu levo" assume o item em nome de quem usa (a organizadora), com "desistir". */
  g.semDono.forEach(function (id) {
    var i = itens[id];
    var li = el("li", "br-linha");
    function montar(meu) {
      li.innerHTML = "";
      var estado = meu
        ? el("span", "br-estado br-cor-carro", null, [B.icone("pessoa", "br-ativo"), el("span", null, { "data-texto": "mensagem.leva", valores: { nome: C.dado("cenario.usuaria") } })])
        : el("span", "br-estado br-cor-atencao", null, [B.icone("pessoa"), el("span", null, { "data-texto": "mensagem.ninguem_pegou" })]);
      var b = el("button", "br-alterna", { type: "button", "aria-pressed": meu ? "true" : "false", "data-texto": meu ? "acao.desistir" : "acao.eu_levo" });
      b.addEventListener("click", function () {
        var k = semDono.indexOf(id);
        if (meu) { if (k < 0) semDono.push(id); } else if (k >= 0) semDono.splice(k, 1);
        montar(!meu);
        li.querySelector("button").focus();
        frase();
      });
      B.nomearPor(b, i.nome);
      li.appendChild(el("div", "br-linha-nome", null, [el("span", "br-linha-titulo", { texto: i.nome }), estado]));
      li.appendChild(el("div", "br-linha-acoes", null, [b]));
    }
    montar(false);
    document.getElementById("sem-dono").appendChild(li);
  });

  /* Duplicado (P-09): "3 assumidos" e o aviso. */
  g.duplicados.forEach(function (id) {
    var i = itens[id];
    document.getElementById("duplicados").appendChild(el("li", "br-cartao", null, [
      el("p", "br-linha-titulo", { texto: i.nome }),
      el("p", "br-estado br-cor-separei", null, [B.icone("grupo"), el("span", null, { "data-texto": "mensagem.assumidos", valores: { n: i.assumidos } })]),
      el("p", null, { texto: i.aviso })
    ]));
  });

  /* Quem leva o quê; o item com gasto abre a área Gastos. */
  g.quemLeva.forEach(function (id) {
    var i = itens[id];
    var filhos = [el("span", "br-linha-titulo", { texto: i.nome }), el("span", "br-estado br-cor-carro", null, [B.icone("pessoa", "br-ativo"), el("span", null, { "data-texto": "mensagem.leva", valores: { nome: i.dono } })])];
    var conteudo = i.gasto
      ? el("a", "br-linha br-ligacao", { href: "12-gastos.html" }, [el("span", "br-linha-nome", null, filhos), el("span", "br-rotulo", { "data-texto": "brasa.ver_gasto" }), B.icone("gastos")])
      : el("div", "br-linha", null, [el("div", "br-linha-nome", null, filhos)]);
    document.getElementById("quem-leva").appendChild(el("li", null, null, [conteudo]));
  });

  /* Famílias do grupo (sem progresso por família, P-10). */
  g.familias.forEach(function (f) {
    document.getElementById("familias").appendChild(el("li", "br-cartao", null, [
      el("p", "br-linha-titulo", { texto: f.descricao }),
      el("p", "br-rotulo", { texto: f.pessoas })
    ]));
  });

  document.getElementById("lembrar").addEventListener("click", function () {
    var aviso = document.getElementById("lembrete");
    aviso.hidden = false;
    aviso.innerHTML = "";
    aviso.appendChild(B.icone("ciente"));
    aviso.appendChild(el("span", null, { "data-texto": "brasa.lembrete_enviado" }));
  });

  B.iniciar();
})();
</script>
</body>
</html>
