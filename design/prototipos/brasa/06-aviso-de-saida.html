<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.6"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="6">
<header class="br-tela br-topo br-topo--empilhada">
  <p class="br-momento"><span data-icone="estrada"></span><span data-texto="brasa.momento_antes"></span></p>
  <div class="br-topo-linha">
    <div class="br-topo-texto">
      <p class="br-destaque" id="progresso" data-texto="mensagem.progresso_carro"></p>
      <p class="br-frase" id="frase" role="status"></p>
    </div>
    <span class="br-apoio br-mascote-medio"><span id="mascote" data-mascote="pose-alerta" data-mascote-texto=""></span></span>
  </div>
</header>
<div class="br-tela br-atras" aria-hidden="true"></div>
<main class="br-tela br-folha br-folha--empilhada">
  <div class="br-alca">
    <span class="br-alca-traco" aria-hidden="true"></span>
    <a class="br-fechar" href="04-lista.html" data-fechar><span data-icone="fechar"></span><span data-texto="acao.fechar"></span></a>
  </div>
  <div class="br-corpo">
    <h1 data-texto="brasa.t6_titulo"></h1>

    <section class="br-bloco" aria-labelledby="b-fora">
      <h2 id="b-fora" data-texto="bloco.separados_fora"></h2>
      <ul class="br-pilha" id="fora"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-nao">
      <h2 id="b-nao" data-texto="bloco.nao_separados"></h2>
      <ul class="br-pilha" id="nao"></ul>
      <p class="br-aviso-vazio" id="nao-vazio" data-texto="mensagem.nao_separados_vazio" hidden></p>
    </section>
  </div>
  <div class="br-rodape">
    <div class="br-halo"><a class="br-botao" id="sair" href="07-estadia.html" data-texto="acao.sair_assim"></a></div>
  </div>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */
  var aviso = C.dado("avisoSaida");

  function linha(item) {
    var li = el("li", "br-linha");
    function montar() {
      var e = B.estadoDe(item);
      var noCarro = e === "carro";
      li.innerHTML = "";
      var estado = noCarro
        ? el("span", "br-estado br-cor-carro", null, [B.icone("carro", "br-ativo"), el("span", null, { "data-texto": "estado.carro" })])
        : el("span", "br-estado br-cor-separei", null, [B.icone("separei", "br-ativo"), el("span", null, { "data-texto": "estado.separei_falado" })]);
      li.appendChild(el("div", "br-linha-nome", null, [
        el("span", "br-linha-titulo", { texto: item.nome }),
        el("span", "br-linha-detalhe", null, [el("span", "br-numero br-cor-texto", { texto: item.quantidadeTexto }), estado])
      ]));
      var b = el("button", "br-alterna br-cor-carro", { type: "button", "aria-pressed": noCarro ? "true" : "false", "data-texto-aria": "brasa.marcar_carro", valores: { nome: item.nome } }, [
        B.icone("carro"), el("span", null, { "data-texto": "estado.carro" })
      ]);
      b.addEventListener("click", function () {
        B.definirEstado(item.id, noCarro ? "separei" : "carro");
        montar();
        li.querySelector("button").focus();
        C.anunciar(C.nomeFalado(item, B.estadoDe(item)));
        atualizar();
      });
      li.appendChild(el("div", "br-linha-acoes", null, [b]));
    }
    montar();
    return li;
  }

  var fora = document.getElementById("fora");
  aviso.foraDoCarro.forEach(function (id) { fora.appendChild(linha(C.item(id))); });
  var nao = document.getElementById("nao");
  aviso.naoSeparados.forEach(function (id) { nao.appendChild(linha(C.item(id))); });
  document.getElementById("nao-vazio").hidden = aviso.naoSeparados.length > 0;

  /* Quando o último entra no carro: lista completa, "Confirmar saída" e o mascote comemorando. */
  function atualizar() {
    var p = C.progresso(B.estados());
    document.getElementById("progresso").setAttribute("data-valores", JSON.stringify({ feitos: p.noCarro, total: p.total }));
    var faltam = p.total - p.noCarro;
    var frase = document.getElementById("frase");
    if (faltam === 0) frase.setAttribute("data-texto", "brasa.tudo_no_carro");
    else if (faltam === 1) frase.setAttribute("data-texto", "brasa.falta_1");
    else { frase.setAttribute("data-valores", JSON.stringify({ n: faltam })); frase.setAttribute("data-texto", "brasa.faltam_n"); }
    var todos = aviso.foraDoCarro.every(function (id) { return B.estadoDe(C.item(id)) === "carro"; });
    document.getElementById("sair").setAttribute("data-texto", todos ? "acao.confirmar_saida" : "acao.sair_assim");
    document.getElementById("mascote").setAttribute("data-mascote", todos ? "pose-comemorando" : "pose-alerta");
  }
  atualizar();

  B.iniciar();
})();
</script>
</body>
</html>
