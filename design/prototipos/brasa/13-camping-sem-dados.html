<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.13"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="13">
<header class="br-tela br-topo br-topo--empilhada">
  <p class="br-momento"><span data-icone="camping"></span><span data-texto="brasa.momento_antes"></span></p>
  <div class="br-topo-linha">
    <div class="br-topo-texto">
      <p class="br-destaque" data-dado="campingSemDados.nome"></p>
      <p class="br-frase" data-texto="mensagem.sem_dados"></p>
    </div>
    <span class="br-apoio br-mascote-pequeno"><span data-mascote="pose-alerta" data-mascote-texto=""></span></span>
  </div>
</header>
<div class="br-tela br-atras" aria-hidden="true"></div>
<main class="br-tela br-folha br-folha--empilhada">
  <div class="br-alca">
    <span class="br-alca-traco" aria-hidden="true"></span>
    <a class="br-fechar" href="02-criar-viagem.html" data-fechar><span data-icone="fechar"></span><span data-texto="acao.fechar"></span></a>
  </div>
  <div class="br-corpo">
    <div class="br-cabeca-folha">
      <h1 data-texto="brasa.t13_titulo"></h1>
      <p class="br-suave" data-texto="brasa.t13_intro"></p>
    </div>

    <section class="br-bloco" aria-labelledby="b-duvida">
      <h2 id="b-duvida" data-texto="bloco.na_duvida"></h2>
      <ul class="br-pilha" id="duvida"></ul>
    </section>

    <section class="br-bloco" aria-labelledby="b-perguntas">
      <h2 id="b-perguntas" data-texto="bloco.perguntas_camping"></h2>
      <p class="br-suave" data-texto="brasa.perguntas_intro"></p>
      <div class="br-cartao">
        <p class="br-perguntas" id="perguntas"></p>
      </div>
      <p class="br-rotulo" data-texto="mensagem.busca_internet"></p>
    </section>
  </div>
  <div class="br-rodape">
    <p class="br-estado br-cor-carro" id="copiado" role="status" hidden></p>
    <div class="br-rodape-acoes">
      <div class="br-halo"><button class="br-botao" type="button" id="copiar"><span data-icone="copiar"></span><span data-texto="acao.copiar"></span></button></div>
      <button class="br-botao br-botao--secundario" type="button" id="compartilhar"><span data-icone="compartilhar"></span><span data-texto="acao.compartilhar"></span></button>
    </div>
  </div>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, B = window.BRASA, el = B.el;
  if (!C) return; /* sem base.js, a tela fica sem texto */
  var s = C.dado("campingSemDados");

  /* Lista "na dúvida": cada item com a etiqueta "depende do camping" (ícone e texto). */
  s.itensNaDuvida.forEach(function (i) {
    document.getElementById("duvida").appendChild(el("li", "br-linha", null, [
      el("div", "br-linha-nome", null, [
        el("span", "br-linha-titulo", { texto: i.nome }),
        el("span", "br-linha-detalhe", null, [
          el("span", "br-numero br-cor-texto", { texto: i.quantidadeTexto }),
          el("span", "br-estado br-cor-separei", null, [B.icone("duvida", "br-ativo"), el("span", null, { "data-texto": "estado.depende_do_camping" })])
        ])
      ])
    ]));
  });

  /* Texto de perguntas (P-15): abertura e linhas de dados.js, uma por linha. */
  var texto = [s.perguntas.abertura].concat(s.perguntas.linhas).join("\n");
  document.getElementById("perguntas").textContent = texto;

  function avisar(ok) {
    var aviso = document.getElementById("copiado");
    aviso.hidden = false;
    aviso.innerHTML = "";
    aviso.appendChild(B.icone(ok ? "ciente" : "atencao"));
    aviso.appendChild(el("span", null, { "data-texto": ok ? "mensagem.copiado" : "mensagem.nao_copiado" }));
    C.anunciar(C.texto(ok ? "mensagem.copiado" : "mensagem.nao_copiado"));
  }
  document.getElementById("copiar").addEventListener("click", function () { C.copiar(texto).then(avisar); });
  /* Compartilhar: o menu do celular, quando o navegador oferece; senão, copia. */
  document.getElementById("compartilhar").addEventListener("click", function () {
    if (navigator.share) {
      navigator.share({ text: texto }).catch(function () { /* o usuário fechou o menu */ });
    } else {
      C.copiar(texto).then(avisar);
    }
  });

  B.iniciar();
})();
</script>
</body>
</html>
