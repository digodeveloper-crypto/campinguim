<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.7"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="7">
<div class="cl-app">
  <header class="cl-topo">
    <p class="cl-topo-viagem" data-dado="viagem.cabecalho"></p>
  </header>
  <main class="cl-conteudo">
    <div class="cl-titulo-pose">
      <div class="cl-bloco">
        <h1 class="cl-h1" data-texto="cl.estadia.titulo"></h1>
        <p class="cl-suave" data-texto="cl.estadia.regras_intro"></p>
      </div>
      <span class="cl-pose"><span data-mascote="pose-camping" data-mascote-texto=""></span></span>
    </div>

    <section class="cl-bloco" aria-labelledby="rotulo-regras">
      <h2 class="cl-rotulo" id="rotulo-regras" data-texto="bloco.regras_a_mao"></h2>
      <ul class="cl-cartao cl-cartao--lista cl-linhas" id="regras"></ul>
      <p class="cl-estado cl-estado--ciente cl-ativo"><span data-icone="ciente"></span><span id="confirmado" data-texto="mensagem.confirmado_por"></span></p>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-faltou">
      <h2 class="cl-rotulo" id="rotulo-faltou" data-texto="bloco.faltou"></h2>
      <ul class="cl-cartao cl-cartao--lista cl-linhas" id="faltou"></ul>
      <p class="cl-suave" id="faltou-vazio" data-texto="cl.estadia.faltou_vazio"></p>
    </section>

    <a class="cl-ligacao" href="08-volta.html">
      <span data-icone="volta"></span>
      <span class="cl-ligacao-texto">
        <span class="cl-forte" data-texto="cl.estadia.volta_titulo"></span>
        <span class="cl-suave cl-pequeno" data-texto="cl.estadia.volta_texto"></span>
      </span>
      <span data-icone="avancar"></span>
    </a>
  </main>
  <div class="cl-base">
    <div class="cl-acao">
      <button type="button" class="cl-botao cl-botao--principal" id="abrir-faltou" aria-haspopup="dialog"><span data-icone="faltou"></span><span data-texto="acao.faltou_algo"></span></button>
    </div>
    <nav class="cl-abas" data-texto-aria="cl.abas">
      <a class="cl-aba" href="04-lista.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="lista"></span></span><span class="cl-aba-texto" data-texto="area.lista"></span></a>
      <a class="cl-aba" href="03-alertas.html" aria-current="page"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="camping"></span></span><span class="cl-aba-texto" data-texto="area.camping"></span></a>
      <a class="cl-aba" href="11-grupo.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="grupo"></span></span><span class="cl-aba-texto" data-texto="area.grupo"></span></a>
      <a class="cl-aba" href="12-gastos.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="gastos"></span></span><span class="cl-aba-texto" data-texto="area.gastos"></span></a>
    </nav>
  </div>

  <div class="cl-veu" id="veu" hidden></div>
  <section class="cl-folha" id="folha" role="dialog" aria-labelledby="folha-titulo" hidden>
    <div class="cl-folha-cabeca">
      <h2 class="cl-h2" id="folha-titulo" data-texto="cl.faltou.titulo"></h2>
      <button type="button" class="cl-botao cl-botao--texto" id="fechar-folha"><span data-icone="fechar"></span><span data-texto="acao.fechar"></span></button>
    </div>
    <div class="cl-folha-corpo">
      <p class="cl-suave" data-texto="cl.faltou.intro"></p>
      <form class="cl-bloco" id="form-escrito">
        <label class="cl-campo">
          <span class="cl-campo-rotulo" data-texto="cl.faltou.escrever"></span>
          <input class="cl-entrada" type="text" id="escrito" autocomplete="off">
        </label>
        <button type="submit" class="cl-botao" data-texto="cl.faltou.anotar"></button>
      </form>
      <h3 class="cl-rotulo" id="rotulo-da-lista" data-texto="cl.faltou.da_lista"></h3>
      <div class="cl-categorias" id="opcoes" role="group" aria-labelledby="rotulo-da-lista"></div>
    </div>
  </section>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  $("confirmado").setAttribute("data-valores", JSON.stringify({ n: C.dado("estadia.confirmacoes") }));

  /* Regras à mão: as de atenção com triângulo e a palavra; a regra com fato abre a tela 10. */
  var niveis = {};
  C.dado("alertas").forEach(function (a) { niveis[a.id] = a.nivel; });
  C.dado("estadia.regrasAMao").forEach(function (r) {
    var li = el("li", "cl-linha");
    var nivel = r.origem === "alerta" ? niveis[r.id] : null;
    var caixa = r.fato ? el("a", "cl-linha-texto cl-item-nome", { href: "10-fato.html?de=07-estadia.html", "data-texto-aria": "cl.alertas.ver_fato", "data-valores": JSON.stringify({ regra: r.texto }) }) : el("div", "cl-linha-texto");
    var linha = el("span", "cl-aba-icone");
    var t = el("span", "cl-item-titulo");
    t.textContent = r.texto;
    linha.appendChild(t);
    if (r.fato) linha.appendChild(I.criar("avancar"));
    caixa.appendChild(linha);
    if (nivel === "atencao") {
      var n = el("span", "cl-estado cl-estado--atencao cl-ativo");
      n.appendChild(I.criar("atencao"));
      n.appendChild(el("span", "", { "data-texto": "nivel.atencao" }));
      caixa.appendChild(n);
    }
    li.appendChild(caixa);
    $("regras").appendChild(li);
  });

  /* Faltou (E1-09): lista vazia no início; dois toques para anotar. */
  var faltou = C.guardado.ler("clareira.faltou", null) || (C.dado("estadia.faltou") || []).slice();

  function pintarFaltou() {
    var ul = $("faltou");
    ul.innerHTML = "";
    faltou.forEach(function (nome, i) {
      var li = el("li", "cl-linha");
      var txt = el("div", "cl-linha-texto");
      var t = el("p", "cl-item-titulo");
      t.textContent = nome;
      txt.appendChild(t);
      var s = el("p", "cl-estado cl-estado--faltou cl-ativo");
      s.appendChild(I.criar("faltou"));
      s.appendChild(el("span", "", { "data-texto": "estado.faltou" }));
      txt.appendChild(s);
      var b = el("button", "cl-alternar", { type: "button", "data-texto-aria": "cl.faltou.remover", "data-valores": JSON.stringify({ nome: nome }) });
      b.appendChild(I.criar("fechar"));
      b.addEventListener("click", function () {
        faltou.splice(i, 1);
        C.guardado.gravar("clareira.faltou", faltou);
        pintarFaltou();
        $("abrir-faltou").focus();
      });
      li.appendChild(txt);
      li.appendChild(b);
      ul.appendChild(li);
    });
    ul.hidden = !faltou.length;
    $("faltou-vazio").hidden = !!faltou.length;
  }

  function anotar(nome) {
    nome = String(nome || "").trim();
    if (!nome) return;
    if (faltou.indexOf(nome) < 0) faltou.push(nome);
    C.guardado.gravar("clareira.faltou", faltou);
    fechar();
    pintarFaltou();
    C.anunciar(C.texto("cl.faltou.anotado", { nome: nome }));
  }

  /* Folha com os itens da lista, por categoria. */
  var opcoes = $("opcoes");
  C.dado("lista.categorias").forEach(function (cat) {
    var sec = el("section", "cl-bloco");
    var h = el("h4", "cl-campo-rotulo", { "data-texto": "categoria." + cat.id });
    sec.appendChild(h);
    var caixa = el("div", "cl-fichas");
    cat.itens.forEach(function (it) {
      var b = el("button", "cl-ficha", { type: "button" });
      b.textContent = it.nome;
      b.addEventListener("click", function () { anotar(it.nome); });
      caixa.appendChild(b);
    });
    sec.appendChild(caixa);
    opcoes.appendChild(sec);
  });

  var soltar = null;
  function abrir() {
    $("veu").hidden = false;
    $("folha").hidden = false;
    soltar = C.prenderFoco($("folha"), fechar);
    C.anunciar(C.texto("cl.faltou.titulo"));
  }
  function fechar() {
    $("veu").hidden = true;
    $("folha").hidden = true;
    if (soltar) { var s = soltar; soltar = null; s(); }
  }
  $("abrir-faltou").addEventListener("click", abrir);
  $("fechar-folha").addEventListener("click", fechar);
  $("veu").addEventListener("click", fechar);
  $("form-escrito").addEventListener("submit", function (ev) {
    ev.preventDefault();
    anotar($("escrito").value);
    $("escrito").value = "";
  });

  pintarFaltou();
})();
</script>
</body>
</html>
