<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.identidade"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="identidade">
<div class="cl-app">
  <header class="cl-web-topo">
    <span class="cl-marca"></span>
    <span data-texto="direcao.nome"></span>
  </header>
  <main class="cl-conteudo">
    <!-- 1. Nome, território e frase -->
    <section class="cl-bloco">
      <p class="cl-rotulo" id="direcao-linha" data-texto="cl.id.direcao"></p>
      <h1 class="cl-h1" data-texto="cl.id.titulo"></h1>
      <p class="cl-h2" data-texto="direcao.frase"></p>
    </section>

    <!-- Assinatura -->
    <section class="cl-bloco" aria-labelledby="t-assinatura">
      <h2 class="cl-h2" id="t-assinatura" data-texto="cl.id.assinatura"></h2>
      <p data-texto="cl.id.assinatura_texto"></p>
      <div class="cl-id-marcas">
        <span><span class="cl-marca"></span><span data-texto="cl.id.completa"></span></span>
        <span><span class="cl-marca cl-marca--vazia"></span><span data-texto="cl.id.incompleta"></span></span>
      </div>
    </section>

    <!-- 2. Paleta -->
    <section class="cl-bloco" aria-labelledby="t-paleta">
      <h2 class="cl-h2" id="t-paleta" data-texto="cl.id.paleta"></h2>
      <p class="cl-suave" data-texto="cl.id.paleta_intro"></p>
      <div class="cl-id-paleta">
        <div class="cl-id-tema" data-tema="claro"><h3 class="cl-forte" data-texto="cl.id.claro"></h3><ul id="paleta-claro"></ul></div>
        <div class="cl-id-tema" data-tema="escuro"><h3 class="cl-forte" data-texto="cl.id.escuro"></h3><ul id="paleta-escuro"></ul></div>
      </div>
    </section>

    <!-- 3. Tipografia -->
    <section class="cl-bloco" aria-labelledby="t-tipo">
      <h2 class="cl-h2" id="t-tipo" data-texto="cl.id.tipografia"></h2>
      <p class="cl-forte" data-texto="cl.id.tipo_familia"></p>
      <p data-texto="cl.id.tipo_texto"></p>
      <div class="cl-cartao cl-id-escala">
        <p class="cl-id-escala-titulo" data-texto="cl.id.escala.titulo"></p>
        <p class="cl-id-escala-bloco" data-texto="cl.id.escala.bloco"></p>
        <p data-texto="cl.id.escala.corpo"></p>
        <p class="cl-rotulo" data-texto="cl.id.escala.rotulo"></p>
      </div>
      <p class="cl-suave cl-pequeno" data-texto="cl.id.tipo_licenca"></p>
    </section>

    <!-- 4. Ícones -->
    <section class="cl-bloco" aria-labelledby="t-icones">
      <h2 class="cl-h2" id="t-icones" data-texto="cl.id.icones"></h2>
      <p data-texto="cl.id.icones_texto"></p>
      <ul class="cl-id-icones" id="icones-estado"></ul>
      <ul class="cl-id-icones" id="icones-apoio"></ul>
    </section>

    <!-- 5. Navegação -->
    <section class="cl-bloco" aria-labelledby="t-nav">
      <h2 class="cl-h2" id="t-nav" data-texto="cl.id.navegacao"></h2>
      <p data-texto="cl.id.navegacao_texto"></p>
      <div class="cl-id-esquema" aria-hidden="true">
        <span class="cl-id-esquema-topo" data-texto="cl.id.esquema_topo"></span>
        <span class="cl-id-esquema-meio" data-texto="cl.id.esquema_conteudo"></span>
        <span class="cl-id-esquema-acao" data-texto="cl.id.esquema_acao"></span>
        <span class="cl-id-esquema-abas">
          <span><span data-icone="lista"></span><span data-texto="area.lista"></span></span>
          <span><span data-icone="camping"></span><span data-texto="area.camping"></span></span>
          <span><span data-icone="grupo"></span><span data-texto="area.grupo"></span></span>
          <span><span data-icone="gastos"></span><span data-texto="area.gastos"></span></span>
        </span>
      </div>
      <p class="cl-suave cl-pequeno" data-texto="cl.id.mapa"></p>
    </section>

    <!-- 6. Mascote -->
    <section class="cl-bloco" aria-labelledby="t-mascote">
      <h2 class="cl-h2" id="t-mascote" data-texto="cl.id.mascote"></h2>
      <p data-texto="cl.id.mascote_texto"></p>
      <p data-texto="cl.id.mascote_usos"></p>
      <div class="cl-id-mascotes">
        <figure class="cl-id-mascote-caixa" data-tema="escuro">
          <span class="cl-pose"><span data-mascote="principal" data-mascote-texto=""></span></span>
          <figcaption class="cl-pequeno" data-texto="cl.id.mascote_apoio"></figcaption>
        </figure>
        <figure class="cl-id-mascote-caixa">
          <span data-mascote="uma-cor" data-mascote-texto=""></span>
          <figcaption class="cl-pequeno" data-texto="cl.id.mascote_uma_cor"></figcaption>
        </figure>
      </div>
    </section>

    <!-- 7. Tom de voz -->
    <section class="cl-bloco" aria-labelledby="t-tom">
      <h2 class="cl-h2" id="t-tom" data-texto="cl.id.tom"></h2>
      <p data-texto="cl.id.tom_texto"></p>
      <ul class="cl-id-frases">
        <li id="tom-1" data-texto="cl.id.tom.1"></li>
        <li id="tom-2" data-texto="cl.id.tom.2"></li>
        <li data-texto="cl.id.tom.3"></li>
      </ul>
    </section>

    <!-- 8. Origem e riscos -->
    <section class="cl-bloco" aria-labelledby="t-origem">
      <h2 class="cl-h2" id="t-origem" data-texto="cl.id.origem"></h2>
      <p data-texto="cl.id.origem_texto"></p>
      <ul class="cl-id-riscos">
        <li><span data-icone="atencao"></span><span data-texto="cl.id.risco.1"></span></li>
        <li><span data-icone="atencao"></span><span data-texto="cl.id.risco.2"></span></li>
        <li><span data-icone="atencao"></span><span data-texto="cl.id.risco.3"></span></li>
      </ul>
    </section>

    <a class="cl-botao cl-botao--principal" href="01-abertura.html" data-texto="cl.id.abrir"></a>
  </main>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  $("direcao-linha").setAttribute("data-valores", JSON.stringify({ territorio: C.texto("direcao.territorio") }));

  /* Paleta: valores lidos de estilo.css; contraste pela fórmula das WCAG 2.x. */
  var PAPEIS = ["fundo", "superficie", "texto", "texto-suave", "linha", "acento", "sobre-acento", "atencao", "separei", "carro", "apoio-mascote"];
  var PARES = {
    "texto": ["fundo", "superficie"], "texto-suave": ["fundo", "superficie"], "sobre-acento": ["acento"], "acento": ["fundo"],
    "linha": ["superficie", "fundo"], "atencao": ["superficie", "fundo"], "separei": ["superficie", "fundo"], "carro": ["superficie", "fundo"],
    "apoio-mascote": ["corpo"]
  };
  function canal(v) { v = v / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function luminancia(hex) {
    var h = hex.replace("#", "");
    return 0.2126 * canal(parseInt(h.substr(0, 2), 16)) + 0.7152 * canal(parseInt(h.substr(2, 2), 16)) + 0.0722 * canal(parseInt(h.substr(4, 2), 16));
  }
  function razao(a, b) {
    var l1 = luminancia(a), l2 = luminancia(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  function numero(r) { return r.toFixed(2).replace(".", ","); }

  ["claro", "escuro"].forEach(function (tema) {
    var caixa = $("paleta-" + tema);
    var cs = getComputedStyle(caixa);
    var cor = {};
    PAPEIS.forEach(function (p) { cor[p] = cs.getPropertyValue("--" + p).trim().toUpperCase(); });
    cor.corpo = C.texto("cl.id.corpo_hex");
    PAPEIS.forEach(function (p) {
      if (!/^#[0-9A-F]{6}$/.test(cor[p])) return; /* apoio dispensado no claro */
      var li = el("li", "cl-id-cor");
      li.appendChild(el("span", "cl-id-amostra", { style: "background: var(--" + p + ")", "aria-hidden": "true" }));
      var t = el("span", "cl-id-cor-texto");
      t.appendChild(el("span", "cl-forte", { "data-texto": "cl.id.par." + p }));
      t.appendChild(el("span", "cl-suave cl-pequeno", { "data-texto": "cl.id.papel." + p }));
      var hex = el("span", "cl-pequeno cl-numero");
      hex.textContent = cor[p];
      t.appendChild(hex);
      (PARES[p] || []).forEach(function (q) {
        t.appendChild(el("span", "cl-pequeno cl-numero", { "data-texto": "cl.id.par_linha", "data-valores": JSON.stringify({ razao: numero(razao(cor[p], cor[q])), par: C.texto("cl.id.par." + q) }) }));
      });
      li.appendChild(t);
      caixa.appendChild(li);
    });
  });

  /* Ícones: os de estado em repouso e ativos; os de apoio, um de cada. */
  var CORES = { separei: "separei", carro: "carro", comprar: "comprar", atencao: "atencao", faltou: "faltou", sobrou: "sobrou", ciente: "ciente", conferido: "conferido", nao_conferido: "nao_conferido", secar: "secar", depende: "depende", informacao: "depende" };
  I.estados.forEach(function (n) {
    var li = el("li", "cl-id-icone");
    li.appendChild(el("span", "cl-forte cl-pequeno", { "data-texto": "cl.icone." + n }));
    var par = el("div", "cl-id-icone-par");
    var r = el("span", "cl-estado cl-estado--a_separar");
    r.appendChild(I.criar(n));
    r.appendChild(el("span", "", { "data-texto": "cl.id.repouso" }));
    var a = el("span", "cl-estado cl-ativo cl-estado--" + CORES[n]);
    a.appendChild(I.criar(n));
    a.appendChild(el("span", "", { "data-texto": "cl.id.ativo" }));
    par.appendChild(r);
    par.appendChild(a);
    li.appendChild(par);
    $("icones-estado").appendChild(li);
  });
  I.apoio.forEach(function (n) {
    var li = el("li", "cl-id-icone");
    var par = el("div", "cl-id-icone-par");
    par.appendChild(I.criar(n));
    par.appendChild(el("span", "cl-pequeno", { "data-texto": "cl.icone." + n }));
    li.appendChild(par);
    $("icones-apoio").appendChild(li);
  });

  /* Tom de voz com os dados do cenário. */
  function minuscula(t) { return t.charAt(0).toLowerCase() + t.slice(1); }
  var primeiro = C.itens().filter(function (i) { return i.estado === "separei"; })[0];
  $("tom-1").setAttribute("data-valores", JSON.stringify({ categoria: C.texto("categoria." + primeiro.categoria), item: minuscula(primeiro.nome) }));
  var entrou = C.dado("ajustes.itens").filter(function (a) { return a.tipo === "entrou"; })[0];
  $("tom-2").setAttribute("data-valores", JSON.stringify({ motivo: entrou.motivo, item: minuscula(entrou.item) }));
})();
</script>
</body>
</html>
