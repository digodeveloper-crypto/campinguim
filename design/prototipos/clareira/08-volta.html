<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>

<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  var volta = C.dado("volta");
  var conferidos = C.guardado.ler("clareira.conferidos", {}) || {};
  var secar = C.guardado.ler("clareira.secar", {}) || {};
  var feitos = C.guardado.ler("clareira.desmontagem", {}) || {};
  var categorias = C.dado("lista.categorias");
  var abertas = {};
  categorias.forEach(function (c, i) { abertas[c.id] = i === 0; });

  function marcado(mapa, id, inicial) { return Object.prototype.hasOwnProperty.call(mapa, id) ? mapa[id] : inicial; }
  function conferido(it) { return marcado(conferidos, it.id, volta.conferidoInicial); }
  function seca(it) { return marcado(secar, it.id, volta.secarInicial); }

  function contar(cat) {
    var r = { total: 0, feitos: 0 };
    (cat ? [cat] : categorias).forEach(function (c) {
      c.itens.forEach(function (it) { r.total++; if (conferido(it)) r.feitos++; });
    });
    return r;
  }

  function estado(chave, icone, textoChave) {
    var s = el("span", "cl-estado cl-estado--" + chave + (chave === "nao_conferido" ? "" : " cl-ativo"));
    s.appendChild(I.criar(icone));
    s.appendChild(el("span", "", { "data-texto": textoChave }));
    return s;
  }

  function linha(it) {
    var li = el("li", "cl-item", { "data-id": it.id });
    var c = conferido(it), s = seca(it);
    var txt = el("div", "cl-item-nome");
    var t = el("span", "cl-item-titulo");
    t.textContent = it.nome;
    txt.appendChild(t);
    var det = el("span", "cl-item-detalhe");
    var q = el("span", "cl-numero");
    q.textContent = it.quantidadeTexto;
    det.appendChild(q);
    det.appendChild(c ? estado("conferido", "conferido", "estado.conferido") : estado("nao_conferido", "nao_conferido", "estado.nao_conferido"));
    if (s) {
      det.appendChild(estado("secar", "secar", "estado.secar"));
      det.appendChild(el("span", "", { "data-texto": "mensagem.lembrete", "data-valores": JSON.stringify({ dias: volta.lembreteDias }) }));
    }
    txt.appendChild(det);
    li.appendChild(txt);
    var botoes = el("div", "cl-item-botoes");
    var bC = el("button", "cl-alternar cl-alternar--conferido", { type: "button", "aria-pressed": c ? "true" : "false", "data-texto-aria": "cl.volta.marcar_conferido", "data-valores": JSON.stringify({ nome: it.nome }) });
    bC.appendChild(I.criar("conferido"));
    bC.addEventListener("click", function () { conferidos[it.id] = !conferido(it); C.guardado.gravar("clareira.conferidos", conferidos); refazer(it, ".cl-alternar--conferido"); });
    var bS = el("button", "cl-alternar cl-alternar--secar", { type: "button", "aria-pressed": s ? "true" : "false", "data-texto-aria": "cl.volta.marcar_secar", "data-valores": JSON.stringify({ nome: it.nome }) });
    bS.appendChild(I.criar("secar"));
    bS.addEventListener("click", function () { secar[it.id] = !seca(it); C.guardado.gravar("clareira.secar", secar); refazer(it, ".cl-alternar--secar"); });
    botoes.appendChild(bC);
    botoes.appendChild(bS);
    li.appendChild(botoes);
    return li;
  }

  function refazer(it, qual) {
    var velha = $("categorias").querySelector('[data-id="' + it.id + '"]');
    var nova = linha(it);
    velha.parentNode.replaceChild(nova, velha);
    nova.querySelector(qual).focus();
    resumo();
  }

  var cabecas = {};
  function montar() {
    var caixa = $("categorias");
    categorias.forEach(function (cat) {
      var sec = el("section", "cl-categoria");
      var idCorpo = "volta-" + cat.id;
      var cab = el("button", "cl-categoria-cabeca", { type: "button", "aria-expanded": abertas[cat.id] ? "true" : "false", "aria-controls": idCorpo });
      var marca = el("span", "cl-marca cl-marca--vazia");
      var prog = el("span", "cl-categoria-progresso", { "data-texto": "mensagem.contador" });
      cab.appendChild(marca);
      cab.appendChild(el("span", "cl-categoria-nome", { "data-texto": "categoria." + cat.id }));
      cab.appendChild(prog);
      cab.appendChild(I.criar("abrir"));
      cabecas[cat.id] = { botao: cab, marca: marca, prog: prog };
      var corpo = el("div", "cl-categoria-corpo cl-cartao cl-cartao--lista", { id: idCorpo });
      corpo.hidden = !abertas[cat.id];
      var ul = el("ul", "cl-linhas");
      cat.itens.forEach(function (it) { ul.appendChild(linha(it)); });
      corpo.appendChild(ul);
      cab.addEventListener("click", function () {
        var abrir = cab.getAttribute("aria-expanded") !== "true";
        cab.setAttribute("aria-expanded", abrir ? "true" : "false");
        corpo.hidden = !abrir;
      });
      sec.appendChild(cab);
      sec.appendChild(corpo);
      caixa.appendChild(sec);
    });
  }

  function resumo() {
    var t = contar(null);
    $("progresso").setAttribute("data-valores", JSON.stringify({ feitos: t.feitos, total: t.total }));
    var trilha = $("trilha");
    trilha.innerHTML = "";
    var completas = 0;
    categorias.forEach(function (cat) {
      var p = contar(cat);
      var cheia = p.feitos === p.total;
      if (cheia) completas++;
      trilha.appendChild(el("span", "cl-marca" + (cheia ? "" : " cl-marca--vazia")));
      var h = cabecas[cat.id];
      h.marca.className = "cl-marca" + (cheia ? "" : " cl-marca--vazia");
      var v = { atual: p.feitos, total: p.total };
      h.prog.setAttribute("data-valores", JSON.stringify(v));
      h.botao.setAttribute("aria-label", C.texto("cl.volta.categoria_aria", { categoria: C.texto("categoria." + cat.id), progresso: C.texto("mensagem.progresso_conferidos", { feitos: p.feitos, total: p.total }) }));
    });
    trilha.setAttribute("data-valores", JSON.stringify({ feitas: completas, total: categorias.length }));
    trilha.setAttribute("data-texto-aria", "cl.lista.categorias");
  }

  /* Tarefas de desmontagem e de casa, com "feito". */
  function tarefas(lista, alvo, prefixo) {
    lista.forEach(function (texto, i) {
      var id = prefixo + i;
      var li = el("li", "cl-linha");
      var t = el("span", "cl-linha-texto");
      t.textContent = texto;
      var b = el("button", "cl-ficha", { type: "button", "aria-pressed": feitos[id] ? "true" : "false", "data-texto-aria": "cl.volta.tarefa_feito", "data-valores": JSON.stringify({ tarefa: texto }) });
      b.appendChild(I.criar("ciente"));
      b.appendChild(el("span", "", { "data-texto": "estado.feito" }));
      b.addEventListener("click", function () {
        feitos[id] = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", feitos[id] ? "true" : "false");
        C.guardado.gravar("clareira.desmontagem", feitos);
      });
      li.appendChild(t);
      li.appendChild(b);
      $(alvo).appendChild(li);
    });
  }

  montar();
  resumo();
  tarefas(volta.desmontagem, "desmontagem", "d");
  tarefas(volta.emCasa, "em-casa", "c");
})();
</script>
</body>
