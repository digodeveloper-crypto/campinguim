<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.9"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="9">
<div class="cl-app">
  <header class="cl-topo">
    <a class="cl-voltar volta-origem" href="04-lista.html"><span data-icone="voltar"></span><span data-texto="acao.voltar"></span></a>
    <p class="cl-topo-viagem" data-dado="viagem.cabecalho"></p>
  </header>
  <main class="cl-conteudo">
    <div class="cl-titulo-pose">
      <div class="cl-bloco">
        <h1 class="cl-h1" data-texto="cl.casa.titulo"></h1>
        <p class="cl-suave cl-forte" id="passo-texto" data-texto="cl.casa.passo"></p>
        <div class="cl-trilha" id="passos" role="img"></div>
      </div>
      <span class="cl-pose"><span data-mascote="pose-neutro"></span></span>
    </div>

    <!-- Passo 1 · Sobrou e faltou -->
    <section class="cl-bloco" id="passo-1" aria-labelledby="titulo-1">
      <h2 class="cl-h2" id="titulo-1" data-texto="bloco.sobrou_faltou"></h2>
      <p class="cl-suave" data-texto="cl.casa.intro1"></p>
      <ul class="cl-cartao cl-cartao--lista cl-linhas" id="consumiveis"></ul>
    </section>

    <!-- Passo 2 · Pergunta do camping -->
    <section class="cl-bloco" id="passo-2" aria-labelledby="titulo-2" hidden>
      <h2 class="cl-h2" id="titulo-2" data-texto="bloco.pergunta_camping"></h2>
      <p class="cl-rotulo" id="contador-pergunta" data-texto="mensagem.contador"></p>
      <div class="cl-cartao cl-bloco">
        <p class="cl-forte" id="pergunta" data-texto="pergunta.regras_cumpridas"></p>
        <p class="cl-h2" id="regra"></p>
        <div class="cl-fichas" role="group" aria-labelledby="pergunta" id="respostas"></div>
      </div>
      <p class="cl-campo-rotulo" id="rotulo-como" data-texto="campo.responder_como"></p>
      <div class="cl-fichas" role="group" aria-labelledby="rotulo-como" id="como"></div>
    </section>

    <!-- Passo 3 · Sugestão, opcional -->
    <section class="cl-bloco" id="passo-3" aria-labelledby="titulo-3" hidden>
      <h2 class="cl-h2" id="titulo-3" data-texto="bloco.sugestao"></h2>
      <p class="cl-forte" id="pergunta-sugestao" data-texto="pergunta.sugestao"></p>
      <div class="cl-fichas" role="group" aria-labelledby="pergunta-sugestao" id="sugestoes"></div>
      <label class="cl-campo">
        <span class="cl-campo-rotulo" data-texto="campo.sugestao"></span>
        <textarea class="cl-entrada" id="sugestao-texto"></textarea>
      </label>
      <p class="cl-suave cl-pequeno" id="caracteres" data-texto="cl.casa.caracteres" aria-live="polite"></p>
    </section>

    <!-- Fim -->
    <section class="cl-bloco" id="passo-fim" hidden>
      <p class="cl-aviso" tabindex="-1" id="registrada"><span data-icone="ciente"></span><span data-texto="mensagem.sugestao_registrada"></span></p>
      <p data-texto="cl.casa.fim"></p>
    </section>
  </main>
  <div class="cl-base">
    <div class="cl-acao">
      <button type="button" class="cl-botao" id="pular" data-texto="acao.pular"></button>
      <button type="button" class="cl-botao cl-botao--principal" id="seguir"><span id="seguir-texto" data-texto="acao.proxima"></span></button>
      <a class="cl-botao cl-botao--principal" id="voltar-lista" href="04-lista.html" data-texto="cl.casa.voltar_lista" hidden></a>
    </div>
    <nav class="cl-abas" data-texto-aria="cl.abas">
      <a class="cl-aba" href="04-lista.html" aria-current="page"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="lista"></span></span><span class="cl-aba-texto" data-texto="area.lista"></span></a>
      <a class="cl-aba" href="03-alertas.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="camping"></span></span><span class="cl-aba-texto" data-texto="area.camping"></span></a>
      <a class="cl-aba" href="11-grupo.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="grupo"></span></span><span class="cl-aba-texto" data-texto="area.grupo"></span></a>
      <a class="cl-aba" href="12-gastos.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="gastos"></span></span><span class="cl-aba-texto" data-texto="area.gastos"></span></a>
    </nav>
  </div>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  var busca = new URLSearchParams(window.location.search);
  var de = busca.get("de");
  if (de && /^\d\d-[a-z-]+\.html$/.test(de)) {
    Array.prototype.forEach.call(document.querySelectorAll(".volta-origem"), function (a) { a.setAttribute("href", de); });
  }

  var casa = C.dado("emCasa");
  var TOTAL = 3;
  var passo = 1;

  /* Escolha única dentro de um grupo; tocar de novo desmarca. */
  function escolhas(caixa, opcoes, aoMudar, rotuloAria) {
    opcoes.forEach(function (o) {
      var b = el("button", "cl-ficha", { type: "button", "aria-pressed": "false" });
      if (o.icone) { b.appendChild(I.criar(o.icone)); b.classList.add("cl-ficha--icone"); }
      else b.appendChild(I.criar("ciente"));
      var t = el("span");
      if (o.chave) t.setAttribute("data-texto", o.chave); else t.textContent = o.texto;
      b.appendChild(t);
      if (rotuloAria) { b.setAttribute("data-texto-aria", rotuloAria.chave); b.setAttribute("data-valores", JSON.stringify(rotuloAria.valores(o))); }
      b.addEventListener("click", function () {
        var agora = b.getAttribute("aria-pressed") !== "true";
        Array.prototype.forEach.call(caixa.children, function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", agora ? "true" : "false");
        if (aoMudar) aoMudar(agora ? o.valor : null);
      });
      caixa.appendChild(b);
    });
  }

  /* Passo 1: sobrou ou faltou, nenhum marcado no início. */
  casa.passo1.itens.forEach(function (it) {
    var li = el("li", "cl-linha");
    var txt = el("div", "cl-linha-texto");
    var t = el("p", "cl-item-titulo");
    t.textContent = it.nome;
    txt.appendChild(t);
    txt.appendChild(el("p", "cl-suave cl-pequeno", { "data-texto": "cl.casa.levado", "data-valores": JSON.stringify({ quantidade: it.levado }) }));
    var caixa = el("div", "cl-fichas", { role: "group", "aria-label": it.nome });
    escolhas(caixa, [
      { valor: "sobrou", chave: "estado.sobrou", icone: "sobrou" },
      { valor: "faltou", chave: "estado.faltou", icone: "faltou" }
    ], null, { chave: "cl.casa.resposta", valores: function (o) { return { nome: it.nome, resposta: C.texto(o.chave) }; } });
    li.appendChild(txt);
    li.appendChild(caixa);
    $("consumiveis").appendChild(li);
  });

  /* Passo 2: pergunta 1 de 4 (P-16). */
  $("contador-pergunta").setAttribute("data-valores", JSON.stringify({ atual: casa.passo2.atual, total: casa.passo2.total }));
  $("regra").textContent = casa.passo2.regra;
  escolhas($("respostas"), [{ valor: "sim", chave: "opcao.sim" }, { valor: "nao", chave: "opcao.nao" }]);
  escolhas($("como"), casa.passo2.responderComo.map(function (n, i) { return { valor: i, texto: n, icone: i === 0 ? "pessoa" : "grupo" }; }));
  $("como").firstChild.setAttribute("aria-pressed", "true");

  /* Passo 3: sugestão opcional, até 200 caracteres. */
  var limite = casa.passo3.limiteCaracteres;
  casa.passo3.opcoes.forEach(function (o) {
    var b = el("button", "cl-ficha", { type: "button", "aria-pressed": "false" });
    b.appendChild(I.criar("ciente"));
    var t = el("span");
    t.textContent = o;
    b.appendChild(t);
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
    $("sugestoes").appendChild(b);
  });
  var area = $("sugestao-texto");
  area.maxLength = limite;
  area.value = casa.passo3.texto;
  function contarCaracteres() { $("caracteres").setAttribute("data-valores", JSON.stringify({ n: area.value.length, limite: limite })); }
  area.addEventListener("input", contarCaracteres);
  contarCaracteres();

  function mostrar(n) {
    passo = n;
    for (var i = 1; i <= TOTAL; i++) $("passo-" + i).hidden = i !== n;
    $("passo-fim").hidden = n !== "fim";
    var atual = n === "fim" ? TOTAL : n;
    $("passo-texto").setAttribute("data-valores", JSON.stringify({ n: atual, total: TOTAL }));
    var trilha = $("passos");
    trilha.innerHTML = "";
    for (var j = 1; j <= TOTAL; j++) trilha.appendChild(el("span", "cl-marca" + (j <= atual && (n === "fim" || j < atual) ? "" : " cl-marca--vazia")));
    trilha.setAttribute("data-texto-aria", "cl.casa.passo");
    trilha.setAttribute("data-valores", JSON.stringify({ n: atual, total: TOTAL }));
    $("seguir-texto").setAttribute("data-texto", n === 3 ? "acao.enviar" : "acao.proxima");
    var fim = n === "fim";
    $("pular").hidden = fim;
    $("seguir").hidden = fim;
    $("voltar-lista").hidden = !fim;
    var alvo = fim ? $("registrada") : $("titulo-" + n);
    if (alvo && document.activeElement && document.activeElement !== document.body) {
      if (!alvo.hasAttribute("tabindex")) alvo.setAttribute("tabindex", "-1");
      alvo.focus();
    }
  }

  function avancar() {
    if (passo === 1) mostrar(2);
    else if (passo === 2) mostrar(3);
    else if (passo === 3) { mostrar("fim"); C.anunciar(C.texto("mensagem.sugestao_registrada")); }
  }
  $("seguir").addEventListener("click", avancar);
  $("pular").addEventListener("click", function () {
    if (passo === 3) { window.location.href = "04-lista.html"; return; }
    avancar();
  });

  mostrar(1);
})();
</script>
</body>
</html>
