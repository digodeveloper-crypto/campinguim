<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.13"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<style>
  .cl-perguntas { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 4px solid var(--linha); }
</style>
</head>
<body data-tela="13">
<div class="cl-app">
  <header class="cl-topo">
    <a class="cl-voltar volta-origem" href="02-criar-viagem.html"><span data-icone="voltar"></span><span data-texto="acao.voltar"></span></a>
    <p class="cl-topo-viagem" data-texto="cl.semdados.rotulo"></p>
  </header>
  <main class="cl-conteudo">
    <div class="cl-titulo-pose">
      <div class="cl-bloco">
        <p class="cl-rotulo" data-texto="cl.semdados.rotulo"></p>
        <h1 class="cl-h1" data-dado="campingSemDados.nome"></h1>
      </div>
      <span class="cl-pose"><span data-mascote="pose-alerta" data-mascote-texto=""></span></span>
    </div>
    <div class="cl-alerta cl-alerta--informacao">
      <span data-icone="depende"></span>
      <div class="cl-alerta-corpo">
        <p class="cl-forte" data-texto="mensagem.sem_dados"></p>
        <p class="cl-suave" data-texto="cl.semdados.intro"></p>
      </div>
    </div>

    <section class="cl-bloco" aria-labelledby="rotulo-duvida">
      <h2 class="cl-rotulo" id="rotulo-duvida" data-texto="bloco.na_duvida"></h2>
      <p class="cl-suave cl-pequeno" data-texto="cl.semdados.duvida_intro"></p>
      <ul class="cl-cartao cl-cartao--lista cl-linhas" id="duvida"></ul>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-perguntas">
      <h2 class="cl-rotulo" id="rotulo-perguntas" data-texto="bloco.perguntas_camping"></h2>
      <p class="cl-suave cl-pequeno" data-texto="cl.semdados.perguntas_intro"></p>
      <div class="cl-cartao">
        <div class="cl-perguntas" id="perguntas"></div>
      </div>
      <button type="button" class="cl-botao" id="compartilhar"><span data-icone="compartilhar"></span><span data-texto="acao.compartilhar"></span></button>
      <p class="cl-aviso" id="copiado" role="status" hidden><span data-icone="ciente"></span><span id="copiado-texto"></span></p>
      <p class="cl-suave cl-pequeno" data-texto="mensagem.busca_internet"></p>
    </section>
  </main>
  <div class="cl-base">
    <div class="cl-acao">
      <button type="button" class="cl-botao cl-botao--principal" id="copiar"><span data-icone="copiar"></span><span data-texto="acao.copiar"></span></button>
    </div>
    <nav class="cl-abas" data-texto-aria="cl.abas">
      <a class="cl-aba" href="04-lista.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="lista"></span></span><span class="cl-aba-texto" data-texto="area.lista"></span></a>
      <a class="cl-aba" href="03-alertas.html" aria-current="page"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="camping"></span></span><span class="cl-aba-texto" data-texto="area.camping"></span></a>
      <a class="cl-aba" href="11-grupo.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="grupo"></span></span><span class="cl-aba-texto" data-texto="area.grupo"></span></a>
      <a class="cl-aba" href="12-gastos.html"><span class="cl-aba-icone"><span class="cl-marca"></span><span data-icone="gastos"></span></span><span class="cl-aba-texto" data-texto="area.gastos"></span></a>
    </nav>
  </div>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }
  function txt(tag, classe, conteudo) { var e = el(tag, classe); e.textContent = conteudo; return e; }

  var de = new URLSearchParams(window.location.search).get("de");
  if (de && /^\d\d-[a-z-]+\.html$/.test(de)) {
    Array.prototype.forEach.call(document.querySelectorAll(".volta-origem"), function (a) { a.setAttribute("href", de); });
  }

  var s = C.dado("campingSemDados");
  s.itensNaDuvida.forEach(function (it) {
    var li = el("li", "cl-linha");
    var t = el("div", "cl-linha-texto");
    t.appendChild(txt("p", "cl-item-titulo", it.nome));
    var d = el("p", "cl-item-detalhe");
    d.appendChild(txt("span", "cl-numero", it.quantidadeTexto));
    var e = el("span", "cl-estado cl-estado--depende");
    e.appendChild(I.criar("depende"));
    e.appendChild(el("span", "", { "data-texto": "estado.depende_do_camping" }));
    d.appendChild(e);
    t.appendChild(d);
    li.appendChild(t);
    $("duvida").appendChild(li);
  });

  /* Texto de perguntas (P-15): abertura e as linhas, na ordem da spec. */
  var linhas = [s.perguntas.abertura].concat(s.perguntas.linhas);
  linhas.forEach(function (l, i) { $("perguntas").appendChild(txt("p", i === 0 ? "cl-forte" : "", l)); });
  var textoTodo = linhas.join("\n");

  function avisar(ok) {
    $("copiado-texto").setAttribute("data-texto", ok ? "mensagem.copiado" : "mensagem.nao_copiado");
    $("copiado").hidden = false;
    C.anunciar(C.texto(ok ? "mensagem.copiado" : "mensagem.nao_copiado"));
  }
  $("copiar").addEventListener("click", function () { C.copiar(textoTodo).then(avisar); });
  /* Compartilhar: o menu do celular, quando houver; senão, copia. */
  $("compartilhar").addEventListener("click", function () {
    if (navigator.share) {
      navigator.share({ text: textoTodo }).catch(function () {});
    } else {
      C.copiar(textoTodo).then(avisar);
    }
  });
})();
</script>
</body>
</html>
