<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.2"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="2">
<div class="cl-app">
  <header class="cl-topo">
    <a class="cl-voltar" href="01-abertura.html"><span data-icone="voltar"></span><span data-texto="acao.voltar"></span></a>
    <span class="cl-topo-viagem"></span>
    <span data-mascote="uma-cor"></span>
  </header>
  <main class="cl-conteudo">
    <div class="cl-bloco">
      <h1 class="cl-h1" data-texto="cl.criar.titulo"></h1>
      <p class="cl-suave" data-texto="cl.criar.intro"></p>
    </div>

    <section class="cl-bloco" aria-labelledby="rotulo-tipo">
      <h2 class="cl-rotulo"><span id="rotulo-tipo" data-texto="campo.tipo"></span> <span class="cl-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
      <div class="cl-fichas" role="group" aria-labelledby="rotulo-tipo" id="tipos"></div>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-noites">
      <h2 class="cl-rotulo"><span id="rotulo-noites" data-texto="campo.noites"></span> <span class="cl-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
      <div class="cl-cartao cl-cartao--lista">
        <div id="contador-noites"></div>
      </div>
      <label class="cl-campo">
        <span class="cl-campo-rotulo" data-texto="campo.datas"></span>
        <input class="cl-entrada" type="text" inputmode="numeric" autocomplete="off" value="">
      </label>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-pessoas">
      <h2 class="cl-rotulo"><span id="rotulo-pessoas" data-texto="campo.pessoas"></span> <span class="cl-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
      <p class="cl-suave cl-pequeno" data-texto="cl.criar.pessoas_dica"></p>
      <div class="cl-cartao cl-cartao--lista cl-linhas" id="pessoas"></div>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-tempo">
      <h2 class="cl-rotulo" id="rotulo-tempo" data-texto="cl.criar.tempo"></h2>
      <p class="cl-campo-rotulo" id="rotulo-clima" data-texto="campo.clima"></p>
      <div class="cl-fichas" role="group" aria-labelledby="rotulo-clima" id="climas"></div>
      <p class="cl-campo-rotulo" id="rotulo-chuva" data-texto="campo.chuva"></p>
      <div class="cl-fichas" role="group" aria-labelledby="rotulo-chuva" id="chuva"></div>
    </section>

    <section class="cl-bloco" aria-labelledby="rotulo-destino">
      <h2 class="cl-rotulo" id="rotulo-destino" data-texto="campo.destino"></h2>
      <div class="cl-cartao">
        <p class="cl-suave cl-pequeno" data-texto="cl.criar.destino_escolhido"></p>
        <p class="cl-h2" data-dado="viagem.destino.camping"></p>
        <p class="cl-estado cl-estado--ciente cl-ativo"><span data-icone="ciente"></span><span id="confirmado" data-texto="mensagem.confirmado_por"></span></p>
      </div>
      <label class="cl-campo">
        <span class="cl-campo-rotulo" data-texto="campo.cidade"></span>
        <input class="cl-entrada" type="text" autocomplete="off" id="cidade" value="">
      </label>
      <a class="cl-ligacao" href="13-camping-sem-dados.html?de=02-criar-viagem.html">
        <span data-icone="depende"></span>
        <span class="cl-ligacao-texto">
          <span class="cl-suave cl-pequeno" data-texto="cl.criar.outro"></span>
          <span class="cl-forte" data-dado="viagem.destinoSemDados"></span>
        </span>
        <span data-icone="avancar"></span>
      </a>
    </section>
  </main>
  <div class="cl-base">
    <div class="cl-acao cl-acao--sem-abas">
      <a class="cl-botao cl-botao--principal" href="03-alertas.html" data-texto="acao.gerar_lista"></a>
    </div>
  </div>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, I = window.CAMPINGUIM_ICONES;
  if (!C || !I) return;

  function el(tag, classe, atributos) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (atributos) Object.keys(atributos).forEach(function (k) { e.setAttribute(k, atributos[k]); });
    return e;
  }

  document.getElementById("cidade").value = C.dado("viagem.destino.cidade") || "";
  document.getElementById("confirmado").setAttribute("data-valores", JSON.stringify({ n: C.dado("camping.confirmacoes") }));

  /* Escolha única (tipo, clima, chuva): o visto e o fundo marcam a escolhida. */
  function escolha(caixa, opcoes, atual) {
    opcoes.forEach(function (o) {
      var b = el("button", "cl-ficha", { type: "button", "aria-pressed": o.valor === atual ? "true" : "false" });
      b.appendChild(I.criar("ciente"));
      b.appendChild(el("span", "", { "data-texto": o.chave }));
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(caixa.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      });
      caixa.appendChild(b);
    });
  }
  escolha(document.getElementById("tipos"), C.dado("viagem.tipos").map(function (t) { return { valor: t, chave: "opcao.tipo." + t }; }), C.dado("viagem.tipo"));
  escolha(document.getElementById("climas"), C.dado("viagem.climas").map(function (t) { return { valor: t, chave: "opcao.clima." + t }; }), C.dado("viagem.clima"));
  escolha(document.getElementById("chuva"), [{ valor: true, chave: "opcao.sim" }, { valor: false, chave: "opcao.nao" }], C.dado("viagem.chuva"));

  /* Contadores com menos e mais. */
  function contador(chaveCampo, valor) {
    var linha = el("div", "cl-contador");
    var id = "rotulo-" + chaveCampo.replace(/\./g, "-");
    var rot = el("span", "cl-contador-rotulo", { id: id, "data-texto": chaveCampo });
    var ctr = el("div", "cl-contador-controles", { role: "group", "aria-labelledby": id });
    var campo = C.texto(chaveCampo);
    var menos = el("button", "cl-alternar", { type: "button", "data-texto-aria": "cl.criar.campo_menos", "data-valores": JSON.stringify({ campo: campo }) });
    menos.appendChild(I.criar("menos"));
    var mostra = el("output", "cl-contador-valor", { "aria-live": "polite" });
    var mais = el("button", "cl-alternar", { type: "button", "data-texto-aria": "cl.criar.campo_mais", "data-valores": JSON.stringify({ campo: campo }) });
    mais.appendChild(I.criar("mais"));
    function pintar() {
      mostra.textContent = String(valor);
      mostra.setAttribute("aria-label", C.texto("cl.criar.valor", { campo: campo, valor: valor }));
      menos.disabled = valor <= 0;
    }
    menos.addEventListener("click", function () { if (valor > 0) { valor--; pintar(); } });
    mais.addEventListener("click", function () { valor++; pintar(); });
    pintar();
    ctr.appendChild(menos);
    ctr.appendChild(mostra);
    ctr.appendChild(mais);
    linha.appendChild(rot);
    linha.appendChild(ctr);
    return linha;
  }

  document.getElementById("contador-noites").appendChild(contador("campo.noites", C.dado("viagem.noites")));
  var pessoas = document.getElementById("pessoas");
  var f = C.dado("faixas");
  [["campo.adultos", f.adultos], ["campo.adolescentes", f.adolescentes], ["campo.criancas", f.criancas], ["campo.menores5", f.menores5], ["campo.pets", f.pets]]
    .forEach(function (p) { pessoas.appendChild(contador(p[0], p[1])); });
})();
</script>
</body>
</html>
