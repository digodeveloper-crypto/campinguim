<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, el = OF.el, t = OF.t;
  var estados = {};
  C.itens().forEach(function (i) { estados[i.id] = i.estado; });
  var fora = D.avisoSaida.foraDoCarro;

  function textoEstado(e) {
    return e === "carro" ? t("estado.carro") : t("oficina.separado_fora", { separei: t("estado.separei"), fora: t("estado.fora_do_carro") });
  }

  fora.forEach(function (id) {
    var i = C.item(id);
    var estado = el("span", { "class": "of-linha-estado", "data-estado": estados[id] }, [OF.icone(estados[id] === "carro" ? "carro" : "separei"), el("span", { texto: textoEstado(estados[id]) })]);
    var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": estados[id] === "carro" ? "true" : "false",
      "aria-label": t("oficina.marca_de", { estado: t("estado.carro"), nome: i.nome }) }, [OF.icone("carro"), el("span", { "data-texto": "estado.carro" })]);
    var linha = el("li", { "class": "of-linha", "data-item": id }, [
      el("span", { "class": "of-linha-texto", role: "text" }, [el("span", { "class": "of-linha-nome", texto: i.nome }), el("span", { "class": "of-linha-qtd of-mono", texto: i.quantidadeTexto }), estado]),
      b
    ]);
    b.addEventListener("click", function () {
      estados[id] = estados[id] === "carro" ? "separei" : "carro";
      b.setAttribute("aria-pressed", estados[id] === "carro" ? "true" : "false");
      estado.setAttribute("data-estado", estados[id]);
      estado.firstChild.setAttribute("data-icone", estados[id] === "carro" ? "carro" : "separei");
      estado.lastChild.textContent = textoEstado(estados[id]);
      atualizar();
      C.anunciar(C.nomeFalado(i, estados[id]));
    });
    document.getElementById("of-fora").appendChild(linha);
  });

  if (!D.avisoSaida.naoSeparados.length) {
    document.getElementById("of-nao").appendChild(el("li", { "class": "of-vazio", "data-texto": "mensagem.nao_separados_vazio" }));
  } else {
    D.avisoSaida.naoSeparados.forEach(function (id) { var i = C.item(id); document.getElementById("of-nao").appendChild(el("li", { "class": "of-linha", texto: i.nome })); });
  }

  function atualizar() {
    var faltam = fora.filter(function (id) { return estados[id] !== "carro"; }).length;
    var p = C.progresso(estados);
    var titulo = document.getElementById("of-titulo"), intro = document.getElementById("of-intro");
    var festa = document.getElementById("of-festa"), m = document.getElementById("of-mascote");
    if (faltam) {
      titulo.setAttribute("data-texto", faltam === 1 ? "oficina.aviso.titulo_um" : "oficina.aviso.titulo");
      titulo.setAttribute("data-valores", JSON.stringify({ n: faltam }));
      intro.setAttribute("data-texto", "oficina.aviso.intro");
      festa.classList.add("of-escondido");
      m.removeAttribute("data-mascote"); m.removeAttribute("data-mascote-texto"); m.removeAttribute("data-mascote-feito");
      m.removeAttribute("class"); m.removeAttribute("data-arte"); m.removeAttribute("role"); m.removeAttribute("aria-label"); m.textContent = "";
      document.getElementById("of-sair").lastChild.setAttribute("data-texto", "acao.sair_assim");
    } else {
      titulo.setAttribute("data-texto", "oficina.aviso.titulo_ok");
      titulo.setAttribute("data-valores", JSON.stringify({ feitos: p.noCarro, total: p.total }));
      intro.setAttribute("data-texto", "oficina.aviso.intro_ok");
      m.setAttribute("data-mascote-texto", "");
      m.setAttribute("data-mascote", "pose-comemorando");
      festa.classList.remove("of-escondido");
      document.getElementById("of-sair").lastChild.setAttribute("data-texto", "acao.confirmar_saida");
      C.anunciar(t("oficina.aviso.titulo_ok", { feitos: p.noCarro, total: p.total }));
    }
  }
  atualizar();
})();

</script>
</body>
</html>
