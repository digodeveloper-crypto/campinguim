<body data-tela="5">
<div class="of-app" id="app">
<header class="of-topo">
  <a class="of-voltar" id="of-voltar" href="04-lista.html"><span data-icone="voltar"></span><span data-texto="acao.voltar"></span></a>
  <button class="of-trocar" type="button" aria-pressed="false" data-texto-aria="oficina.trocar_lado"><span data-icone="trocar_lado"></span></button>
</header>
<main class="of-pagina">
  <div class="of-cabeca">
    <p class="of-rotulo of-caixa-alta" id="of-categoria"></p>
    <h1 class="of-h1" id="of-nome"></h1>
  </div>

  <section class="of-cartao of-costura of-bloco" aria-labelledby="of-nome">
    <div class="of-passo" id="of-quantidade"></div>
    <dl class="of-ficha" id="of-ficha"></dl>
  </section>

  <div class="of-campo">
    <label class="of-campo-rotulo" for="of-nota" data-texto="campo.nota"></label>
    <textarea class="of-entrada" id="of-nota" rows="3"></textarea>
  </div>

  <div class="of-bloco">
    <button type="button" class="of-marcar" id="of-comprar" aria-pressed="false">
      <span class="of-nao" data-icone="a_separar"></span><span class="of-sim" data-icone="comprar"></span>
      <span class="of-paragrafos"><span data-texto="estado.comprar"></span><span class="of-rotulo" data-texto="oficina.comprar_nota"></span></span>
    </button>
  </div>

  <div class="of-bloco" id="of-remover-bloco">
    <button type="button" class="of-texto-botao" id="of-remover"><span data-icone="remover"></span><span data-texto="acao.remover"></span></button>
    <p class="of-escondido of-alerta-linha" id="of-removido" role="status"><span data-icone="informacao"></span><span><span data-texto="oficina.removido"></span> <button type="button" class="of-texto-botao" id="of-desfazer"><span data-texto="acao.desfazer"></span></button></span></p>
  </div>
</main>
<footer class="of-rodape">
  <a class="of-botao" href="04-lista.html"><span class="of-ilhos" aria-hidden="true"></span><span data-texto="oficina.pronto"></span></a>

<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, el = OF.el, t = OF.t;
  var id = OF.parametro("item") || D.itemDetalhe.item;
  var i = C.item(id) || C.item(D.itemDetalhe.item);
  var detalhe = i.id === D.itemDetalhe.item ? D.itemDetalhe : i;
  var estado = detalhe.estado || i.estado;

  document.getElementById("of-categoria").setAttribute("data-texto", "categoria." + i.categoria);
  document.getElementById("of-nome").textContent = detalhe.nome || i.nome;

  var q = document.getElementById("of-quantidade");
  var rotulo = el("span", { "class": "of-passo-rotulo", id: "of-q-r" }, [el("span", { "data-texto": "campo.quantidade" })]);
  q.appendChild(rotulo);
  if (typeof detalhe.quantidade === "number") {
    var valor = detalhe.quantidade;
    var saida = el("output", { "class": "of-mono-g", "aria-live": "polite", texto: String(valor) });
    var menos = el("button", { type: "button", "class": "of-marca", "aria-label": t("oficina.rotulo_de", { campo: t("campo.quantidade"), acao: t("opcao.menos") }) }, [OF.icone("menos")]);
    var mais = el("button", { type: "button", "class": "of-marca", "aria-label": t("oficina.rotulo_de", { campo: t("campo.quantidade"), acao: t("opcao.mais") }) }, [OF.icone("mais")]);
    menos.addEventListener("click", function () { if (valor > 1) { valor--; saida.textContent = String(valor); } });
    mais.addEventListener("click", function () { valor++; saida.textContent = String(valor); });
    q.appendChild(el("span", { "class": "of-contador", role: "group", "aria-labelledby": "of-q-r" }, [menos, saida, mais]));
  } else {
    q.appendChild(el("span", { "class": "of-mono", texto: i.quantidadeTexto }));
  }

  var ficha = document.getElementById("of-ficha");
  function linhaFicha(chave, conteudo) {
    ficha.appendChild(el("div", { "class": "of-ficha-linha" }, [el("dt", { "data-texto": chave }), el("dd", null, [conteudo])]));
  }
  if (i.unidade && typeof detalhe.quantidade === "number") linhaFicha("oficina.medida", el("span", { "class": "of-mono", texto: i.quantidadeTexto }));
  if (detalhe.detalhe) linhaFicha("oficina.medida", el("span", { "class": "of-mono", texto: detalhe.detalhe }));
  if (detalhe.motivo) linhaFicha("campo.motivo", el("span", { texto: detalhe.motivo }));
  var ICONE = { carro: "carro", separei: "separei", a_separar: "a_separar" };
  var textoEstado = estado === "carro" ? t("estado.carro") : estado === "separei" ? t("oficina.separado_fora", { separei: t("estado.separei"), fora: t("estado.fora_do_carro") }) : t("estado.a_separar");
  linhaFicha("oficina.estado", el("span", { "class": "of-linha-estado", "data-estado": estado }, [OF.icone(ICONE[estado]), el("span", { texto: textoEstado })]));

  document.getElementById("of-nota").value = detalhe.nota || "";

  var comprar = document.getElementById("of-comprar");
  comprar.setAttribute("aria-pressed", detalhe.comprar ? "true" : "false");
  comprar.addEventListener("click", function () {
    var ligado = comprar.getAttribute("aria-pressed") !== "true";
    comprar.setAttribute("aria-pressed", ligado ? "true" : "false");
  });

  var remover = document.getElementById("of-remover"), removido = document.getElementById("of-removido");
  remover.addEventListener("click", function () {
    remover.classList.add("of-escondido"); removido.classList.remove("of-escondido");
    document.getElementById("of-desfazer").focus();
  });
  document.getElementById("of-desfazer").addEventListener("click", function () {
    removido.classList.add("of-escondido"); remover.classList.remove("of-escondido"); remover.focus();
  });
})();

</script>
</body>
</html>
