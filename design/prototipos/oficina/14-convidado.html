<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.14"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="14">
<div class="of-app of-sem-abas of-web" id="app">
<header class="of-web-topo"><span data-mascote="uma-cor"></span><span data-texto="app.nome"></span></header>
<main class="of-pagina of-sequencia">
  <section class="of-cartao of-costura of-bloco" aria-labelledby="of-h1">
    <p class="of-rotulo" id="of-convidou" data-texto="mensagem.convidou"></p>
    <h1 class="of-h1" id="of-h1" data-dado="convidado.convite.viagem"></h1>
  </section>

  <section class="of-cartao of-costura of-bloco" id="of-entrar" aria-labelledby="of-s-entrar">
    <h2 class="of-h2" id="of-s-entrar" data-texto="acao.entrar"></h2>
    <p class="of-rotulo" data-texto="oficina.convidado.intro"></p>
    <div class="of-campo">
      <label class="of-campo-rotulo" for="of-nome" data-texto="campo.seu_nome"></label>
      <input class="of-entrada" id="of-nome" type="text" autocomplete="off">
    </div>
    <div class="of-campo">
      <label class="of-campo-rotulo" for="of-familia" data-texto="campo.sua_familia"></label>
      <input class="of-entrada" id="of-familia" type="text" autocomplete="off">
    </div>
    <button type="button" class="of-botao" id="of-entrar-botao"><span class="of-ilhos" aria-hidden="true"></span><span data-texto="acao.entrar"></span></button>
  </section>
  <p class="of-cartao of-alerta-linha of-escondido" id="of-entrou" tabindex="-1"><span data-icone="pessoa"></span><span id="of-entrou-texto" data-texto="oficina.convidado.entrou"></span></p>

  <section class="of-cartao of-costura of-bloco" aria-labelledby="of-s-lista">
    <h2 class="of-h2" id="of-s-lista" data-texto="bloco.lista_do_grupo"></h2>
    <ul class="of-linhas" id="of-lista"></ul>
  </section>

  <section class="of-cartao of-costura of-bloco" aria-labelledby="of-s-devo">
    <h2 class="of-h2" id="of-s-devo" data-texto="bloco.o_que_eu_devo"></h2>
    <p class="of-mono-g" id="of-devo" data-texto="oficina.deve_item"></p>
  </section>

  <a class="of-ligacao-linha" href="15-site.html"><span class="of-corpo" style="text-decoration: underline; text-underline-offset: 3px;" data-texto="acao.baixar_app"></span><span data-icone="seguir"></span></a>
</main>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, V = D.convidado, G = D.grupo, el = OF.el, t = OF.t;
  var entrou = false;
  document.getElementById("of-convidou").setAttribute("data-valores", JSON.stringify({ nome: V.convite.convidouPor }));
  document.getElementById("of-devo").setAttribute("data-valores", JSON.stringify({ texto: t("mensagem.voces_devem", { pessoa: V.deve.a, valor: C.dinheiro(V.deve.centavos) }), item: V.deve.item }));

  var nome = document.getElementById("of-nome"), familia = document.getElementById("of-familia");
  /* No protótipo, tocar no campo preenche com o convidado de dados.js. */
  nome.addEventListener("focus", function () { if (!nome.value) nome.value = V.nome; });
  familia.addEventListener("focus", function () { if (!familia.value) familia.value = V.familia; });
  document.getElementById("of-entrar-botao").addEventListener("click", function () {
    if (!nome.value) nome.value = V.nome;
    if (!familia.value) familia.value = V.familia;
    entrou = true;
    document.getElementById("of-entrou-texto").setAttribute("data-valores", JSON.stringify({ nome: nome.value, familia: familia.value }));
    document.getElementById("of-entrar").classList.add("of-escondido");
    var aviso = document.getElementById("of-entrou");
    aviso.classList.remove("of-escondido");
    aviso.focus();
    C.anunciar(t("oficina.convidado.entrou", { nome: nome.value, familia: familia.value }));
  });

  G.itens.lista.forEach(function (it) {
    var estado = el("span", { "class": "of-linha-estado" });
    var filhos = [el("span", { "class": "of-linha-texto" }, [el("span", { "class": "of-linha-nome", texto: it.nome }), estado])];
    if (it.semDono) {
      estado.appendChild(OF.icone("a_separar")); estado.appendChild(el("span", { "data-texto": "mensagem.ninguem_pegou" }));
      var dono = null;
      var b = el("button", { type: "button", "class": "of-botao-sec" }, [el("span", { "data-texto": "acao.eu_levo" })]);
      b.setAttribute("aria-label", t("oficina.marca_de", { estado: t("acao.eu_levo"), nome: it.nome }));
      b.addEventListener("click", function () {
        if (!entrou) { nome.focus(); return; }
        dono = dono ? null : nome.value;
        estado.firstChild.setAttribute("data-icone", dono ? "pessoa" : "a_separar");
        var s = estado.lastChild;
        if (dono) { s.setAttribute("data-texto", "mensagem.leva"); s.setAttribute("data-valores", JSON.stringify({ nome: dono })); }
        else { s.removeAttribute("data-valores"); s.setAttribute("data-texto", "mensagem.ninguem_pegou"); }
        b.firstChild.setAttribute("data-texto", dono ? "acao.desistir" : "acao.eu_levo");
        b.setAttribute("aria-label", t("oficina.marca_de", { estado: t(dono ? "acao.desistir" : "acao.eu_levo"), nome: it.nome }));
        C.anunciar(dono ? t("mensagem.leva", { nome: dono }) : t("mensagem.ninguem_pegou"));
      });
      filhos.push(b);
    } else if (it.duplicado) {
      estado.appendChild(OF.icone("atencao")); estado.appendChild(el("span", { "data-texto": "mensagem.assumidos", "data-valores": JSON.stringify({ n: it.assumidos }) }));
    } else {
      estado.appendChild(OF.icone("pessoa")); estado.appendChild(el("span", { texto: it.dono }));
    }
    document.getElementById("of-lista").appendChild(el("li", { "class": "of-linha", style: filhos.length === 1 ? "grid-template-columns: minmax(min-content, 1fr);" : null }, filhos));
  });
})();

</script>
</body>
</html>
