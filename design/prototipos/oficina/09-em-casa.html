<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, E = D.emCasa, el = OF.el, t = OF.t;
  var passo = 1;

  function grupoUnico(caixa, opcoes, rotulo) {
    opcoes.forEach(function (o) {
      var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": "false" }, [OF.icone(o.icone || "ciente", o.icone ? null : "of-opcao-marca"), el("span", o.chave ? { "data-texto": o.chave } : { texto: o.texto })]);
      if (rotulo) b.setAttribute("aria-label", t("oficina.marca_de", { estado: o.chave ? t(o.chave) : o.texto, nome: rotulo }));
      b.addEventListener("click", function () {
        var era = b.getAttribute("aria-pressed") === "true";
        Array.prototype.forEach.call(caixa.children, function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", era ? "false" : "true");
      });
      caixa.appendChild(b);
    });
  }

  E.passo1.itens.forEach(function (i) {
    var opcoes = el("div", { "class": "of-opcoes", role: "group", "aria-label": i.nome });
    grupoUnico(opcoes, [{ chave: "estado.sobrou", icone: "sobrou" }, { chave: "estado.faltou", icone: "faltou" }], i.nome);
    document.getElementById("of-consumiveis").appendChild(el("li", { "class": "of-regra", style: "grid-template-columns: minmax(min-content, 1fr);" }, [
      el("span", { "class": "of-regra-texto" }, [el("span", { texto: i.nome }), el("span", { "class": "of-rotulo of-mono", "data-texto": "oficina.levado", "data-valores": JSON.stringify({ q: i.levado }) })]),
      opcoes
    ]));
  });

  document.getElementById("of-contador").setAttribute("data-valores", JSON.stringify({ atual: E.passo2.atual, total: E.passo2.total }));
  document.getElementById("of-regra").textContent = E.passo2.regra;
  grupoUnico(document.getElementById("of-sim-nao"), [{ chave: "opcao.sim" }, { chave: "opcao.nao" }]);
  grupoUnico(document.getElementById("of-como"), E.passo2.responderComo.map(function (x) { return { texto: x }; }));

  var sug = document.getElementById("of-sugestoes");
  E.passo3.opcoes.forEach(function (o) {
    var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": "false" }, [OF.icone("ciente", "of-opcao-marca"), el("span", { texto: o })]);
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
    sug.appendChild(b);
  });
  var area = document.getElementById("of-sugestao");
  area.setAttribute("maxlength", String(E.passo3.limiteCaracteres));
  area.value = E.passo3.texto;
  function contar() {
    document.getElementById("of-caracteres").setAttribute("data-valores", JSON.stringify({ n: area.value.length, max: E.passo3.limiteCaracteres }));
  }
  area.addEventListener("input", contar);
  contar();

  function mostrar() {
    [1, 2, 3].forEach(function (n) { document.getElementById("of-p" + n).hidden = n !== passo; });
    var fim = passo > 3;
    document.getElementById("of-fim").hidden = !fim;
    document.getElementById("of-passo").classList.toggle("of-escondido", fim);
    if (!fim) document.getElementById("of-passo").setAttribute("data-valores", JSON.stringify({ atual: passo, total: 3 }));
    document.getElementById("of-pular").classList.toggle("of-escondido", fim);
    document.getElementById("of-seguir").classList.toggle("of-escondido", fim);
    document.getElementById("of-fim-botao").classList.toggle("of-escondido", !fim);
    document.getElementById("of-seguir-texto").setAttribute("data-texto", passo === 3 ? "acao.enviar" : "acao.proxima");
    var alvo = fim ? document.getElementById("of-fim-texto") : document.getElementById("of-s-p" + passo);
    alvo.setAttribute("tabindex", "-1");
    return alvo;
  }
  function avancar(enviou) {
    if (passo === 3) document.getElementById("of-fim-texto").setAttribute("data-texto", enviou ? "mensagem.sugestao_registrada" : "oficina.em_casa.concluido");
    passo++;
    var alvo = mostrar();
    alvo.focus();
    C.anunciar(alvo.textContent);
  }
  document.getElementById("of-pular").addEventListener("click", function () { avancar(false); });
  document.getElementById("of-seguir").addEventListener("click", function () { avancar(passo === 3); });
  mostrar();
})();

</script>
