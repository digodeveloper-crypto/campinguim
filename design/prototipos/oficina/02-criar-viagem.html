<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, V = D.viagem, el = OF.el, t = OF.t;

  function opcoes(caixa, lista, escolhido, prefixo, aoEscolher) {
    lista.forEach(function (id) {
      var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": id === escolhido ? "true" : "false" },
        [OF.icone("ciente", "of-opcao-marca"), el("span", { "data-texto": prefixo + id })]);
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(caixa.children, function (o) { o.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        if (aoEscolher) aoEscolher(id);
      });
      caixa.appendChild(b);
    });
  }

  function contador(linha, rotuloChave, valor, minimo, obrigatorio) {
    var id = "of-c-" + rotuloChave.replace(/\W/g, "-");
    var saida = el("output", { "class": "of-mono-g", id: id, "aria-live": "polite", texto: String(valor) });
    var rotulo = el("span", { "class": "of-passo-rotulo", id: id + "-r" }, [el("span", { "data-texto": rotuloChave })]);
    if (obrigatorio) { rotulo.appendChild(document.createTextNode(" ")); rotulo.appendChild(el("span", { "class": "of-obrigatorio", "data-texto": "campo.obrigatorio" })); }
    var menos = el("button", { type: "button", "class": "of-marca", "aria-label": t("oficina.rotulo_de", { campo: t(rotuloChave), acao: t("opcao.menos") }) }, [OF.icone("menos")]);
    var mais = el("button", { type: "button", "class": "of-marca", "aria-label": t("oficina.rotulo_de", { campo: t(rotuloChave), acao: t("opcao.mais") }) }, [OF.icone("mais")]);
    menos.addEventListener("click", function () { if (valor > minimo) { valor--; saida.textContent = String(valor); } });
    mais.addEventListener("click", function () { valor++; saida.textContent = String(valor); });
    linha.appendChild(rotulo);
    linha.appendChild(el("span", { "class": "of-contador", role: "group", "aria-labelledby": id + "-r" }, [menos, saida, mais]));
    return linha;
  }

  opcoes(document.getElementById("of-tipos"), V.tipos, V.tipo, "opcao.tipo.");
  contador(document.getElementById("of-noites"), "campo.noites", V.noites, 1, true);

  var pessoas = document.getElementById("of-pessoas");
  [["campo.adultos", "adultos"], ["campo.adolescentes", "adolescentes"], ["campo.criancas", "criancas"], ["campo.menores5", "menores5"], ["campo.pets", "pets"]]
    .forEach(function (p) { pessoas.appendChild(contador(el("div", { "class": "of-passo" }), p[0], D.faixas[p[1]], 0, false)); });

  opcoes(document.getElementById("of-climas"), V.climas, V.clima, "opcao.clima.");
  var chuva = document.getElementById("of-chuva");
  [["sim", true], ["nao", false]].forEach(function (o) {
    var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": o[1] === V.chuva ? "true" : "false" },
      [OF.icone("ciente", "of-opcao-marca"), el("span", { "data-texto": "opcao." + o[0] })]);
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(chuva.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
    });
    chuva.appendChild(b);
  });

  document.getElementById("of-camping").value = V.destino.camping;
  document.getElementById("of-cidade").value = V.destino.cidade;
  document.getElementById("of-sem-dados-texto").setAttribute("data-valores", JSON.stringify({ nome: V.destinoSemDados }));
})();

</script>
