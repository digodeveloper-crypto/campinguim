<body data-tela="4">

  <div class="of-progresso">
    <p class="of-progresso-texto"><span class="of-mono-g" id="of-prog" data-texto="mensagem.progresso_carro"></span><span class="of-rotulo" id="of-fora" data-texto="oficina.fora_resumo"></span></p>
    <div class="of-regua" aria-hidden="true"><div class="of-regua-cheio" id="of-regua"></div></div>

<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, L = D.lista, el = OF.el, t = OF.t;
  var estados = {};
  C.itens().forEach(function (i) { estados[i.id] = i.estado; });
  var filtro = null;
  var abertas = {};
  L.categorias.forEach(function (c) { abertas[c.id] = !!c.aberta; });

  var FILTRO = { a_separar: "a_separar", separados: "separei", no_carro: "carro", comprar: "comprar" };
  var ICONE = { carro: "carro", separei: "separei", a_separar: "a_separar" };

  function textoEstado(e) {
    if (e === "carro") return t("estado.carro");
    if (e === "separei") return t("oficina.separado_fora", { separei: t("estado.separei"), fora: t("estado.fora_do_carro") });
    return t("estado.a_separar");
  }

  function linha(i) {
    var e = estados[i.id];
    var estado = el("span", { "class": "of-linha-estado", "data-estado": e }, [OF.icone(ICONE[e]), el("span", { texto: textoEstado(e) })]);
    var ligacao = el("a", { "class": "of-linha-texto", href: "05-item.html?item=" + encodeURIComponent(i.id), "aria-label": C.nomeFalado(i, e) }, [
      el("span", { "class": "of-linha-nome", texto: i.nome }),
      el("span", { "class": "of-linha-qtd of-mono", texto: i.quantidadeTexto }),
      estado
    ]);
    var sep = el("button", { type: "button", "class": "of-marca", "data-marca": "separei", "aria-pressed": e !== "a_separar" ? "true" : "false",
      "aria-label": t("oficina.marca_de", { estado: t("estado.separei"), nome: i.nome }) }, [OF.icone("separei")]);
    var car = el("button", { type: "button", "class": "of-marca", "data-marca": "carro", "aria-pressed": e === "carro" ? "true" : "false",
      "aria-label": t("oficina.marca_de", { estado: t("estado.carro"), nome: i.nome }) }, [OF.icone("carro")]);
    sep.addEventListener("click", function () { mudar(i, estados[i.id] === "a_separar" ? "separei" : "a_separar", sep); });
    car.addEventListener("click", function () { mudar(i, estados[i.id] === "carro" ? "separei" : "carro", car); });
    return el("li", { "class": "of-linha", "data-item": i.id, "data-estado": e }, [ligacao, el("div", { "class": "of-marcas" }, [sep, car])]);
  }

  function mudar(i, novo, foco) {
    estados[i.id] = novo;
    desenhar();
    var b = document.querySelector('.of-linha[data-item="' + i.id + '"] .of-marca[data-marca="' + foco.getAttribute("data-marca") + '"]');
    if (b) b.focus();
    C.anunciar(C.nomeFalado(i, novo));
  }

  function desenhar() {
    var p = C.progresso(estados);
    var prog = document.getElementById("of-prog");
    prog.setAttribute("data-valores", JSON.stringify({ feitos: p.noCarro, total: p.total }));
    document.getElementById("of-fora").setAttribute("data-valores", JSON.stringify({ n: p.total - p.noCarro }));
    document.getElementById("of-regua").style.width = (p.total ? (100 * p.noCarro / p.total) : 0) + "%";

    var caixa = document.getElementById("of-categorias");
    caixa.textContent = "";
    var algum = false;
    L.categorias.forEach(function (c) {
      var itens = C.itens().filter(function (i) { return i.categoria === c.id; });
      var visiveis = itens.filter(function (i) { return !filtro || (filtro === "comprar" ? false : estados[i.id] === FILTRO[filtro]); });
      if (filtro && !visiveis.length) return;
      algum = true;
      var pc = C.progresso(estados, c.id);
      var aberta = filtro ? true : abertas[c.id];
      var idLinhas = "of-cat-" + c.id;
      var cab = el("button", { type: "button", "class": "of-categoria-cabeca", "aria-expanded": aberta ? "true" : "false", "aria-controls": idLinhas,
        "aria-label": t("oficina.cat_falado", { categoria: t("categoria." + c.id), feitos: pc.noCarro, total: pc.total }) }, [
        OF.icone("seguir", "of-seta"),
        el("span", { "class": "of-cat-nome", "data-texto": "categoria." + c.id }),
        el("span", { "class": "of-mono" + (pc.noCarro < pc.total ? " of-cat-pendente" : ""), "data-texto": "mensagem.contador", "data-valores": JSON.stringify({ atual: pc.noCarro, total: pc.total }) })
      ]);
      cab.addEventListener("click", function () { abertas[c.id] = !abertas[c.id]; if (filtro) return; desenhar(); var b = document.querySelector('[aria-controls="' + idLinhas + '"]'); if (b) b.focus(); });
      var lista = el("ul", { "class": "of-linhas", id: idLinhas, hidden: !aberta }, visiveis.map(linha));
      caixa.appendChild(el("section", { "class": "of-cartao of-costura of-categoria", "data-categoria": c.id }, [el("h2", null, [cab]), lista]));
    });
    document.getElementById("of-vazio").classList.toggle("of-escondido", algum);
  }

  var filtros = document.getElementById("of-filtros");
  L.filtros.forEach(function (f) {
    var b = el("button", { type: "button", "class": "of-opcao", "aria-pressed": "false" }, [OF.icone("ciente", "of-opcao-marca"), el("span", { "data-texto": "filtro." + f })]);
    b.addEventListener("click", function () {
      filtro = filtro === f ? null : f;
      Array.prototype.forEach.call(filtros.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      if (filtro) b.setAttribute("aria-pressed", "true");
      desenhar();
    });
    filtros.appendChild(b);
  });

  L.tarefas.forEach(function (tf) {
    var b = el("button", { type: "button", "class": "of-ciente", "aria-pressed": tf.feito ? "true" : "false",
      "aria-label": t("oficina.marca_de", { estado: t("estado.feito"), nome: tf.texto }) }, [OF.icone("ciente"), el("span", { "data-texto": "estado.feito" })]);
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
    document.getElementById("of-tarefas").appendChild(el("li", { "class": "of-tarefa" }, [el("span", { "class": "of-corpo", texto: tf.texto }), b]));
  });

  /* Dica da primeira abertura (não aparece nas amostras sem moldura). */
  var dica = document.getElementById("of-dica");
  if (C.parametros.moldura && !C.guardado.ler("oficina.dica_vista", false)) dica.classList.remove("of-escondido");
  document.getElementById("of-dica-ok").addEventListener("click", function () {
    C.guardado.gravar("oficina.dica_vista", true);
    dica.classList.add("of-escondido");
    var h = document.querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus(); }
  });

  desenhar();
})();

</script>
