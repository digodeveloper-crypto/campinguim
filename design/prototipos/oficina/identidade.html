<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, el = OF.el, t = OF.t;
  var claro = getComputedStyle(document.getElementById("of-sonda-claro"));
  var escuro = getComputedStyle(document.getElementById("of-sonda-escuro"));
  function cor(estilo, papel) { return estilo.getPropertyValue("--" + papel).trim().toUpperCase(); }

  var PAPEIS = ["fundo", "superficie", "texto", "texto-suave", "linha", "acento", "sobre-acento", "atencao", "separei", "carro", "apoio-mascote"];
  PAPEIS.forEach(function (p) {
    var nome = C.texto("oficina.id.nome." + p);
    var texto = el("span", { "class": "of-regra-texto" }, [
      el("span", { style: "font-weight: 600;", "data-texto": "oficina.id.papel." + p }),
      nome ? el("span", { "class": "of-rotulo", "data-texto": "oficina.id.nome." + p }) : null,
      el("span", { "class": "of-mono", "data-texto": "oficina.id.valores", "data-valores": JSON.stringify({ claro: cor(claro, p), escuro: cor(escuro, p) }) })
    ]);
    document.getElementById("of-cores").appendChild(el("li", { "class": "of-cor" }, [
      el("span", { "class": "of-cor-amostras", "aria-hidden": "true" }, [
        el("span", { "class": "of-cor-amostra", "data-tema": "claro", style: "background: var(--" + p + ");" }),
        el("span", { "class": "of-cor-amostra", "data-tema": "escuro", style: "background: var(--" + p + ");" })
      ]), texto]));
  });

  function lum(hex) {
    var h = hex.replace("#", "");
    return [0, 2, 4].map(function (i) { var v = parseInt(h.substr(i, 2), 16) / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); })
      .reduce(function (s, v, i) { return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0);
  }
  function razao(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function fmt(k) { return t("oficina.id.razao", { k: k.toFixed(2).replace(".", ",") }); }

  var PARES = [
    ["texto-fundo", "texto", "fundo"], ["texto-superficie", "texto", "superficie"],
    ["suave-fundo", "texto-suave", "fundo"], ["suave-superficie", "texto-suave", "superficie"],
    ["sobre-acento", "sobre-acento", "acento"], ["acento-fundo", "acento", "fundo"],
    ["linha-superficie", "linha", "superficie"], ["linha-fundo", "linha", "fundo"],
    ["atencao-superficie", "atencao", "superficie"], ["atencao-fundo", "atencao", "fundo"],
    ["separei-superficie", "separei", "superficie"], ["separei-fundo", "separei", "fundo"],
    ["carro-superficie", "carro", "superficie"], ["carro-fundo", "carro", "fundo"]
  ];
  var pares = document.getElementById("of-pares");
  PARES.forEach(function (p) {
    pares.appendChild(el("li", { "class": "of-par" }, [el("span", { "data-texto": "oficina.id.par." + p[0] }),
      el("span", { "class": "of-mono", texto: fmt(razao(cor(claro, p[1]), cor(claro, p[2]))) }),
      el("span", { "class": "of-mono", texto: fmt(razao(cor(escuro, p[1]), cor(escuro, p[2]))) })]));
  });
  /* Corpo do mascote (#4A5560, cor oficial da arte) contra o apoio de lona, nos dois temas. */
  var CORPO = "#4A5560";
  pares.appendChild(el("li", { "class": "of-par" }, [el("span", { "data-texto": "oficina.id.par.mascote-apoio" }),
    el("span", { "class": "of-mono", texto: fmt(razao(CORPO, cor(claro, "apoio-mascote"))) }),
    el("span", { "class": "of-mono", texto: fmt(razao(CORPO, cor(escuro, "apoio-mascote"))) })]));

  var ESTADOS = [["separei", "separei"], ["carro", "carro"], ["comprar", "comprar"], ["faltou", "faltou"], ["conferido", "conferido"], ["secar", "secar"], ["ciente", "ciente"], ["atencao", null], ["a_separar", null]];
  ESTADOS.forEach(function (e) {
    var repouso = el("span", { "class": "of-marca", "data-marca": e[1] || "nenhuma" }, [OF.icone(e[0])]);
    if (e[0] === "atencao") repouso.style.color = "var(--atencao)";
    var par = el("span", { "class": "of-icone-par" }, [repouso]);
    if (e[1]) par.appendChild(el("span", { "class": "of-marca", "data-marca": e[1], "aria-pressed": "true" }, [OF.icone(e[0])]));
    document.getElementById("of-icones-estado").appendChild(el("li", { "class": "of-icone-ficha" }, [par, el("span", { "class": "of-rotulo", "data-texto": "oficina.icone." + e[0] })]));
  });
  var JA = ESTADOS.map(function (e) { return e[0]; });
  window.CAMPINGUIM_ICONES.nomes.filter(function (n) { return JA.indexOf(n) < 0; }).forEach(function (n) {
    document.getElementById("of-icones-demais").appendChild(el("li", { "class": "of-icone-ficha" }, [el("span", { "class": "of-icone-solto" }, [OF.icone(n)]), el("span", { "class": "of-rotulo", "data-texto": "oficina.icone." + n })]));
  });

  ["principal", "pose-alerta", "pose-comemorando", "pose-camping"].forEach(function (pose) {
    document.getElementById("of-poses").appendChild(el("li", { "class": "of-pose" }, [
      el("span", { "class": "of-etiqueta-lona of-costura" }, [el("span", { "data-mascote": pose, "data-mascote-texto": "" })]),
      el("span", { "class": "of-rotulo", "data-texto": "oficina.id.pose." + pose })]));
  });

  var I = D.itemDetalhe, total = D.lista.total;
  var motivo = D.ajustes.itens[0].motivo;
  [t("oficina.aviso.titulo", { n: D.avisoSaida.foraDoCarro.length }),
   t("oficina.id.tom.extensao", { nome: I.nome, detalhe: I.detalhe, motivo: motivo.charAt(0).toLowerCase() + motivo.slice(1) }),
   t("oficina.aviso.titulo_ok", { feitos: total, total: total })].forEach(function (f) {
    document.getElementById("of-frases").appendChild(el("li", { texto: f }));
  });
})();

</script>
