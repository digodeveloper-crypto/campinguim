<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.15"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="15">
<div class="of-app of-sem-abas of-web" id="app">
<main class="of-pagina of-sequencia">
  <section class="of-bloco" aria-labelledby="of-h1">
    <div class="of-etiqueta-lona of-costura of-site-etiqueta"><span data-mascote="principal" data-mascote-texto=""></span></div>
    <h1 class="of-h1" id="of-h1" data-texto="app.nome"></h1>
    <p class="of-corpo" data-texto="site.oQueE"></p>
  </section>

  <section class="of-cartao of-costura of-bloco" aria-labelledby="of-s-espera" id="of-espera">
    <h2 class="of-h2" id="of-s-espera" data-texto="bloco.lista_espera"></h2>
    <p class="of-rotulo" data-texto="oficina.site.espera_intro"></p>
    <div class="of-campo">
      <label class="of-campo-rotulo" for="of-email" data-texto="campo.seu_email"></label>
      <input class="of-entrada" id="of-email" type="email" autocomplete="email" inputmode="email">
    </div>
    <button type="button" class="of-marcar" id="of-consentimento" aria-pressed="false"><span class="of-nao" data-icone="a_separar"></span><span class="of-sim" data-icone="separei"></span><span data-texto="site.consentimento"></span></button>
    <button type="button" class="of-botao" id="of-enviar"><span class="of-ilhos" aria-hidden="true"></span><span data-texto="acao.lista_espera"></span></button>
    <p class="of-alerta-linha of-escondido" id="of-pronto" role="status"><span data-icone="ciente"></span><span data-texto="mensagem.lista_espera_ok"></span></p>
  </section>

  <section class="of-bloco" aria-labelledby="of-s-lista">
    <h2 class="of-h2" id="of-s-lista" data-texto="bloco.lista_pronta"></h2>
    <p class="of-rotulo"><span data-texto="oficina.site.lista_para"></span> <span data-dado="site.resumoLista"></span></p>
    <div class="of-cartao of-costura of-categoria" id="of-categorias"></div>
  </section>

  <a class="of-ligacao-linha" href="01-abertura.html"><span class="of-corpo" style="text-decoration: underline; text-underline-offset: 3px;" data-texto="oficina.site.abrir_app"></span><span data-icone="seguir"></span></a>
</main>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>

var C = window.CAMPINGUIM;
var OF = (function () {
  "use strict";
  var raiz = document.documentElement;
  var app = document.getElementById("app");

  function t(chave, valores) {
    var v = C.texto(chave, valores);
    if (v === null) { if (window.console) console.error("[oficina] chave sem texto:", chave); return "[" + chave + "]"; }
    return v;
  }

  /* Cria um elemento: el("li", { class: "x", "data-texto": "k" }, [filhos ou texto de dados]). */
  function el(tag, atributos, filhos) {
    var e = document.createElement(tag);
    if (atributos) Object.keys(atributos).forEach(function (k) {
      var v = atributos[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "texto") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }

  function icone(nome, classe) { return el("span", { "data-icone": nome, "class": classe || null }); }

  /* Lado das divisórias (guardado no navegador, com tentativa protegida). */
  var botaoLado = document.querySelector(".of-trocar");
  function lado(l) {
    raiz.setAttribute("data-of-lado", l);
    if (botaoLado) botaoLado.setAttribute("aria-pressed", l === "esquerda" ? "true" : "false");
  }
  lado(C.guardado.ler("oficina.lado", "direita") === "esquerda" ? "esquerda" : "direita");
  if (botaoLado) botaoLado.addEventListener("click", function () {
    var novo = raiz.getAttribute("data-of-lado") === "esquerda" ? "direita" : "esquerda";
    lado(novo);
    C.guardado.gravar("oficina.lado", novo);
    C.anunciar(t(novo === "esquerda" ? "oficina.lado_esquerda" : "oficina.lado_direita"));
  });

  /* Altura do rodapé: as divisórias ficam logo acima dele e a página reserva o espaço. */
  var rodape = document.querySelector(".of-rodape");
  function medir() {
    if (!app) return;
    app.style.setProperty("--of-rodape-h", (rodape && !rodape.hidden ? rodape.offsetHeight : 0) + "px");
  }
  medir();
  if (window.ResizeObserver && rodape) new ResizeObserver(medir).observe(rodape);
  window.addEventListener("resize", medir);

  /* Os parâmetros do avaliador (tema, fonte, moldura, avaliador) seguem nas ligações internas. */
  var SEGUEM = ["tema", "fonte", "moldura", "avaliador"];
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || /^[a-z]+:/i.test(href) || href.charAt(0) === "#" || href.indexOf(".html") < 0 || href.indexOf("../") === 0) return;
    try {
      var atual = new URLSearchParams(window.location.search);
      var partes = href.split("#");
      var base = partes[0].split("?");
      var novos = new URLSearchParams(base[1] || "");
      SEGUEM.forEach(function (p) { if (atual.has(p) && !novos.has(p)) novos.set(p, atual.get(p)); });
      var q = novos.toString();
      a.setAttribute("href", base[0] + (q ? "?" + q : "") + (partes[1] ? "#" + partes[1] : ""));
    } catch (e) { /* segue a ligação como está */ }
  }, true);

  function parametro(nome) {
    try { return new URLSearchParams(window.location.search).get(nome); } catch (e) { return null; }
  }

  return { t: t, el: el, icone: icone, parametro: parametro, medir: medir, app: app };
})();


(function () {
  var D = C.dados, el = OF.el, t = OF.t;
  var caixa = document.getElementById("of-categorias");
  D.lista.categorias.forEach(function (c) {
    var idLinhas = "of-s-" + c.id;
    var cab = el("button", { type: "button", "class": "of-categoria-cabeca", "aria-expanded": "false", "aria-controls": idLinhas }, [
      OF.icone("seguir", "of-seta"),
      el("span", { "class": "of-cat-nome", "data-texto": "categoria." + c.id }),
      el("span", { "class": "of-mono", texto: String(c.itens.length) })
    ]);
    var lista = el("ul", { "class": "of-linhas", id: idLinhas, hidden: true }, c.itens.map(function (i) {
      return el("li", { "class": "of-linha", style: "grid-template-columns: minmax(min-content, 1fr);" }, [el("span", { "class": "of-linha-texto" }, [
        el("span", { "class": "of-linha-nome", texto: i.nome }), el("span", { "class": "of-linha-qtd of-mono", texto: i.quantidadeTexto })])]);
    }));
    cab.addEventListener("click", function () {
      var aberta = cab.getAttribute("aria-expanded") !== "true";
      cab.setAttribute("aria-expanded", aberta ? "true" : "false");
      lista.hidden = !aberta;
    });
    caixa.appendChild(el("div", { "class": "of-site-categoria" }, [el("h3", null, [cab]), lista]));
  });

  var cons = document.getElementById("of-consentimento");
  cons.addEventListener("click", function () { cons.setAttribute("aria-pressed", cons.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
  document.getElementById("of-enviar").addEventListener("click", function () {
    var email = document.getElementById("of-email");
    if (!email.value) { email.focus(); return; }
    var pronto = document.getElementById("of-pronto");
    pronto.classList.remove("of-escondido");
    C.anunciar(t("mensagem.lista_espera_ok"));
  });
})();

</script>
</body>
</html>
