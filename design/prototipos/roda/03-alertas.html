<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.3"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="3">
<div class="r-app">
  <header class="r-topo"><span data-icone="barraca"></span><span data-dado="viagem.cabecalho"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca r-cabeca--com-figura">
      <div class="r-cabeca-texto">
        <p class="r-rotulo" data-texto="alertas.rotulo"></p>
        <h1 data-dado="camping.nome"></h1>
        <p class="r-suave" id="confirmado"></p>
      </div>
      <span class="r-anfitriao r-anfitriao--pequeno"><span data-mascote="pose-alerta" data-mascote-texto=""></span></span>
    </div>
    <p class="r-frase" data-texto="alertas.frase"></p>

    <section class="r-secao" aria-labelledby="t-atencao">
      <h2 id="t-atencao" data-texto="nivel.atencao"></h2>
      <ul class="r-secao" id="atencao"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-info">
      <h2 id="t-info" data-texto="nivel.informacao"></h2>
      <ul class="r-secao" id="informacao"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-ajustes">
      <h2 id="t-ajustes" data-texto="ajuste.titulo"></h2>
      <ul class="r-cartao r-cartao--lista" id="ajustes"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-regras">
      <h2 id="t-regras" data-texto="ajuste.regras"></h2>
      <ul class="r-cartao r-cartao--lista" id="regras"></ul>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <a class="r-acao" href="04-lista.html" data-texto="acao.ver_lista"></a>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;

  var conf = document.getElementById("confirmado");
  conf.setAttribute("data-texto", "mensagem.confirmado_por");
  conf.setAttribute("data-valores", JSON.stringify({ n: C.dado("camping.confirmacoes") }));

  /* Alertas: atenção com triângulo e a palavra "Atenção" (nunca só cor); informação com "i". */
  C.dado("alertas").forEach(function (a) {
    var atencao = a.nivel === "atencao";
    var li = el("li", { classe: "r-aviso" + (atencao ? " r-aviso--atencao" : "") }, [
      R.circulo(atencao ? "atencao" : "informacao", atencao ? "atencao" : "neutro"),
      el("div", { classe: "r-aviso-texto" }, [
        el("span", { classe: "r-aviso-nivel", texto: atencao ? "nivel.atencao" : "nivel.informacao" }),
        el("span", { dado: a.texto })
      ])
    ]);
    document.getElementById(atencao ? "atencao" : "informacao").appendChild(li);
  });

  /* Ajustes, cada um com "desfazer" (E3-08). */
  var icAjuste = { entrou: "sobrou", saiu: "faltou", tarefa: "feito" };
  C.dado("ajustes.itens").forEach(function (a) {
    var botao = el("button", { type: "button", classe: "r-botao" }, [R.icone("desfazer"), el("span", { texto: "acao.desfazer" })]);
    var li = el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [
        el("span", { classe: "r-ajuste-tipo" }, [R.icone(icAjuste[a.tipo]), el("span", { texto: "ajuste." + a.tipo })]),
        el("span", { classe: "r-linha-titulo", dado: a.item }),
        el("span", { classe: "r-linha-info" }, [el("span", { texto: "alertas.motivo", valores: { motivo: a.motivo } })])
      ]),
      el("div", { classe: "r-linha-acoes" }, [botao])
    ]);
    var desfeito = false;
    botao.setAttribute("data-texto-aria", "alertas.desfazer_item");
    botao.setAttribute("data-valores", JSON.stringify({ item: a.item }));
    botao.addEventListener("click", function () {
      desfeito = !desfeito;
      li.classList.toggle("r-riscado", desfeito);
      botao.querySelector("[data-texto]").setAttribute("data-texto", desfeito ? "acao.refazer" : "acao.desfazer");
      botao.setAttribute("data-texto-aria", desfeito ? "alertas.refazer_item" : "alertas.desfazer_item");
      C.anunciar(C.texto(desfeito ? "alertas.desfeito_falado" : "alertas.refeito_falado", { item: a.item }));
    });
    document.getElementById("ajustes").appendChild(li);
  });

  /* Regras, cada uma com "ciente" (E3-07). A regra com fato leva ao fato (tela 10). */
  var fato = C.dado("fato");
  C.dado("regras").forEach(function (r) {
    var nome;
    if (r.fato) {
      nome = el("div", { classe: "r-linha-nome" }, [
        el("a", { classe: "r-linha-titulo", href: "10-fato.html", dado: r.texto }),
        el("span", { classe: "r-linha-info" }, [el("span", { texto: "alertas.fato_curto", valores: { valor: fato.valor, n: fato.confirmacoes } })])
      ]);
    } else {
      nome = el("div", { classe: "r-linha-nome" }, [el("span", { classe: "r-linha-titulo", dado: r.texto })]);
    }
    var visto = el("span", { classe: "r-icone", "aria-hidden": "true", hidden: true });
    var ciente = el("button", { type: "button", classe: "r-botao", "aria-pressed": r.ciente ? "true" : "false", aria: "alertas.ciente_regra", valores: { regra: r.texto } }, [
      visto, el("span", { texto: "acao.ciente" })
    ]);
    R.trocarIcone(visto, "ciente");
    ciente.addEventListener("click", function () {
      var on = ciente.getAttribute("aria-pressed") !== "true";
      ciente.setAttribute("aria-pressed", on ? "true" : "false");
      visto.hidden = !on;
    });
    document.getElementById("regras").appendChild(el("li", { classe: "r-linha" }, [nome, el("div", { classe: "r-linha-acoes" }, [ciente])]));
  });

  R.iniciar();
})();
</script>
</body>
</html>
