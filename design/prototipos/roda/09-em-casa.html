<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.9"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="9">
<div class="r-app">
  <header class="r-topo"><span data-icone="casa"></span><span data-dado="lista.cabecalho"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca r-cabeca--com-figura">
      <div class="r-cabeca-texto">
        <p class="r-rotulo" id="passo-de"></p>
        <div class="r-etapas" aria-hidden="true"><span class="r-etapa" data-etapa="1"></span><span class="r-etapa" data-etapa="2"></span><span class="r-etapa" data-etapa="3"></span></div>
        <h1 data-texto="casa.titulo"></h1>
        <p class="r-frase" data-texto="casa.frase"></p>
      </div>
      <span class="r-anfitriao r-anfitriao--pequeno"><span data-mascote="pose-neutro"></span></span>
    </div>

    <!-- Passo 1 · Sobrou e faltou -->
    <section class="r-secao" id="passo-1" aria-labelledby="t-p1">
      <div class="r-secao-cabeca">
        <h2 id="t-p1" data-texto="bloco.sobrou_faltou"></h2>
        <button type="button" class="r-botao" data-pular data-texto="acao.pular"></button>
      </div>
      <p class="r-suave" data-texto="casa.p1_frase"></p>
      <ul class="r-cartao r-cartao--lista" id="consumiveis"></ul>
    </section>

    <!-- Passo 2 · Pergunta do camping -->
    <section class="r-secao" id="passo-2" aria-labelledby="t-p2" hidden>
      <div class="r-secao-cabeca">
        <h2 id="t-p2" data-texto="bloco.pergunta_camping"></h2>
        <button type="button" class="r-botao" data-pular data-texto="acao.pular"></button>
      </div>
      <div class="r-cartao r-secao">
        <p class="r-rotulo" id="contador"></p>
        <p class="r-frase" id="t-pergunta" data-texto="pergunta.regras_cumpridas"></p>
        <p class="r-progresso-numero" data-dado="emCasa.passo2.regra"></p>
        <div class="r-opcoes" id="resposta" role="group" aria-labelledby="t-pergunta"></div>
      </div>
      <div class="r-campo">
        <h3 class="r-campo-rotulo" id="t-como" data-texto="campo.responder_como"></h3>
        <div class="r-opcoes" id="como" role="group" aria-labelledby="t-como"></div>
      </div>
    </section>

    <!-- Passo 3 · Sugestão, opcional -->
    <section class="r-secao" id="passo-3" aria-labelledby="t-p3" hidden>
      <div class="r-secao-cabeca">
        <h2 id="t-p3" data-texto="bloco.sugestao"></h2>
        <button type="button" class="r-botao" data-pular data-texto="acao.pular"></button>
      </div>
      <p class="r-frase" id="t-sugestao" data-texto="pergunta.sugestao"></p>
      <div class="r-opcoes" id="sugestoes" role="group" aria-labelledby="t-sugestao"></div>
      <div class="r-campo">
        <label class="r-campo-rotulo" for="texto-sugestao" data-texto="campo.sugestao"></label>
        <textarea class="r-entrada" id="texto-sugestao" rows="3"></textarea>
      </div>
    </section>

    <!-- Fim -->
    <section class="r-secao" id="passo-4" aria-labelledby="t-fim" hidden>
      <h2 id="t-fim" data-texto="casa.fim_titulo"></h2>
      <p class="r-nota" id="registrada" hidden><span data-icone="ciente"></span><span data-texto="mensagem.sugestao_registrada"></span></p>
      <p class="r-frase" data-texto="casa.fim_frase"></p>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <button type="button" class="r-acao" id="seguir" data-texto="acao.proxima"></button>
    <a class="r-acao" id="ver-fato" href="10-fato.html" data-texto="casa.ver_fato" hidden></a>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var d = C.dado("emCasa");
  var passo = 1;

  /* Escolha única (pode desmarcar tocando de novo). */
  function escolha(caixa, opcoes, aoMudar) {
    var botoes = [];
    opcoes.forEach(function (o) {
      var b = el("button", { type: "button", classe: "r-opcao", "aria-pressed": "false", aria: o.aria || null, valores: o.valores || null }, [
        o.icone ? R.icone(o.icone) : null,
        o.texto ? el("span", { texto: o.texto }) : el("span", { dado: o.dado })
      ]);
      b.addEventListener("click", function () {
        var on = b.getAttribute("aria-pressed") !== "true";
        botoes.forEach(function (x) { x.setAttribute("aria-pressed", x === b && on ? "true" : "false"); });
        if (aoMudar) aoMudar(on ? o : null);
      });
      botoes.push(b);
      caixa.appendChild(b);
    });
    return botoes;
  }

  /* Passo 1: consumíveis, nenhuma opção marcada no início. */
  d.passo1.itens.forEach(function (it) {
    var opcoes = el("div", { classe: "r-opcoes", role: "group", "aria-label": it.nome });
    escolha(opcoes, [
      { icone: "sobrou", texto: "estado.sobrou", aria: "casa.marcar", valores: { nome: it.nome, estado: C.texto("estado.sobrou") } },
      { icone: "faltou", texto: "estado.faltou", aria: "casa.marcar", valores: { nome: it.nome, estado: C.texto("estado.faltou") } }
    ]);
    document.getElementById("consumiveis").appendChild(el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [
        el("span", { classe: "r-linha-titulo", dado: it.nome }),
        el("span", { classe: "r-linha-info", texto: "casa.levado", valores: { q: it.levado } })
      ]),
      opcoes
    ]));
  });

  /* Passo 2: pergunta 1 de 4 (P-16), Sim ou Não, e como responder (nome ou anônimo). */
  var contador = document.getElementById("contador");
  contador.setAttribute("data-texto", "mensagem.contador");
  contador.setAttribute("data-valores", JSON.stringify({ atual: d.passo2.atual, total: d.passo2.total }));
  escolha(document.getElementById("resposta"), [{ icone: "ciente", texto: "opcao.sim" }, { icone: "fechar", texto: "opcao.nao" }]);
  var como = escolha(document.getElementById("como"), d.passo2.responderComo.map(function (n) { return { dado: n }; }));
  como[0].setAttribute("aria-pressed", "true");

  /* Passo 3: sugestão opcional, toques e texto de até 200 caracteres. */
  var sugestoes = document.getElementById("sugestoes");
  d.passo3.opcoes.forEach(function (o) {
    var b = el("button", { type: "button", classe: "r-opcao", "aria-pressed": "false", dado: o });
    b.style.flex = "0 1 auto";
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
    sugestoes.appendChild(b);
  });
  var texto = document.getElementById("texto-sugestao");
  texto.maxLength = d.passo3.limiteCaracteres;
  texto.value = d.passo3.texto;

  var seguir = document.getElementById("seguir");
  var verFato = document.getElementById("ver-fato");

  function irPara(n, enviada) {
    passo = n;
    for (var i = 1; i <= 4; i++) document.getElementById("passo-" + i).hidden = i !== n;
    var etapas = document.querySelectorAll(".r-etapa");
    for (var j = 0; j < etapas.length; j++) etapas[j].setAttribute("data-feita", j < n ? "1" : "0");
    var pd = document.getElementById("passo-de");
    pd.setAttribute("data-valores", JSON.stringify({ n: Math.min(n, 3), total: 3 }));
    pd.setAttribute("data-texto", n > 3 ? "casa.passos_feitos" : "casa.passo_de");
    seguir.hidden = n > 3;
    verFato.hidden = n <= 3;
    seguir.setAttribute("data-texto", n === 3 ? "acao.enviar" : "acao.proxima");
    document.getElementById("registrada").hidden = !enviada;
    if (n > 3 && enviada) C.anunciar(C.texto("mensagem.sugestao_registrada"));
    var alvo = document.getElementById(n > 3 ? "t-fim" : "t-p" + n);
    if (alvo && passo > 1) { alvo.setAttribute("tabindex", "-1"); alvo.focus(); }
    if (C.elementoRolagem) C.elementoRolagem.scrollTop = 0;
  }

  seguir.addEventListener("click", function () { irPara(passo + 1, passo === 3); });
  var pular = document.querySelectorAll("[data-pular]");
  for (var k = 0; k < pular.length; k++) pular[k].addEventListener("click", function () { irPara(passo + 1, false); });

  irPara(1, false);
  R.iniciar();
})();
</script>
</body>
</html>
