<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.2"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="2">
<div class="r-app">
  <header class="r-topo"><span data-icone="barraca"></span><span data-texto="criar.topo"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca">
      <h1 data-texto="criar.titulo"></h1>
      <p class="r-frase" data-texto="criar.frase"></p>
    </div>

    <section class="r-secao" aria-labelledby="rotulo-tipo">
      <h2 class="r-campo-rotulo" id="rotulo-tipo"><span data-texto="campo.tipo"></span><span class="r-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
      <div class="r-opcoes" id="tipos" role="group" aria-labelledby="rotulo-tipo"></div>
    </section>

    <section class="r-secao" aria-labelledby="rotulo-noites">
      <div class="r-cartao">
        <div class="r-contador" id="noites">
          <span class="r-contador-rotulo r-campo-rotulo" id="rotulo-noites"><span data-texto="campo.noites"></span><span class="r-obrigatorio" data-texto="campo.obrigatorio"></span></span>
        </div>
        <div class="r-campo">
          <label class="r-suave r-pequeno" for="datas" data-texto="campo.datas"></label>
          <input class="r-entrada" id="datas" type="text" autocomplete="off">
        </div>
      </div>
    </section>

    <section class="r-secao" aria-labelledby="rotulo-pessoas">
      <h2 class="r-campo-rotulo" id="rotulo-pessoas"><span data-texto="campo.pessoas"></span><span class="r-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
      <div class="r-cartao" id="pessoas"></div>
    </section>

    <section class="r-secao" aria-labelledby="rotulo-clima">
      <h2 class="r-campo-rotulo" id="rotulo-clima" data-texto="campo.clima"></h2>
      <div class="r-opcoes" id="climas" role="group" aria-labelledby="rotulo-clima"></div>
      <h2 class="r-campo-rotulo" id="rotulo-chuva" data-texto="campo.chuva"></h2>
      <div class="r-opcoes" id="chuva" role="group" aria-labelledby="rotulo-chuva"></div>
    </section>

    <section class="r-secao" aria-labelledby="rotulo-destino">
      <h2 class="r-campo-rotulo" id="rotulo-destino" data-texto="campo.destino"></h2>
      <div class="r-cartao r-secao">
        <div class="r-campo">
          <label class="r-suave r-pequeno" for="destino" data-texto="criar.camping"></label>
          <input class="r-entrada" id="destino" type="text" autocomplete="off">
        </div>
        <div class="r-campo">
          <label class="r-suave r-pequeno" for="cidade" data-texto="campo.cidade"></label>
          <input class="r-entrada" id="cidade" type="text" autocomplete="off">
        </div>
      </div>
      <p class="r-suave" data-texto="criar.sem_dados_frase"></p>
      <a class="r-ligacao" href="13-camping-sem-dados.html" id="sem-dados"><span data-icone="barraca"></span><span id="sem-dados-nome"></span></a>
    </section>
  </main>
  <footer class="r-rodape">
    <a class="r-mural-botao" href="01-abertura.html"><span data-icone="seta-esquerda"></span><span data-texto="acao.voltar"></span></a>
    <a class="r-acao" href="03-alertas.html" data-texto="acao.gerar_lista"></a>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var v = C.dado("viagem");

  /* Escolha única entre opções (alternâncias com aria-pressed). */
  function escolha(caixa, ids, atual, prefixo, icones) {
    var botoes = [];
    ids.forEach(function (id) {
      var b = el("button", { type: "button", classe: "r-opcao", "aria-pressed": id === atual ? "true" : "false" }, [
        icones && icones[id] ? R.icone(icones[id]) : null,
        el("span", { texto: prefixo + id })
      ]);
      b.addEventListener("click", function () {
        botoes.forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      });
      botoes.push(b);
      caixa.appendChild(b);
    });
  }

  escolha(document.getElementById("tipos"), v.tipos, v.tipo, "opcao.tipo.",
    { barraca_carro: "carro", trilha_mochila: "mochila", motorhome: "motorhome" });
  escolha(document.getElementById("climas"), v.climas, v.clima, "opcao.clima.",
    { frio: "frio", ameno: "ameno", calor: "calor" });

  /* Chance de chuva: Sim ou Não. */
  var chuva = document.getElementById("chuva");
  var botoesChuva = [];
  [true, false].forEach(function (valor) {
    var b = el("button", { type: "button", classe: "r-opcao", "aria-pressed": valor === v.chuva ? "true" : "false" }, [
      el("span", { texto: valor ? "opcao.sim" : "opcao.nao" })
    ]);
    b.addEventListener("click", function () {
      botoesChuva.forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
    });
    botoesChuva.push(b);
    chuva.appendChild(b);
  });

  /* Contador com menos e mais (mínimo 0; noites, mínimo 1). */
  function contador(linha, chaveCampo, valor, minimo, idRotulo) {
    var saida = el("span", { classe: "r-passo-valor", "aria-live": "polite", dado: valor });
    var rotulo = C.texto(chaveCampo);
    var menos = el("button", { type: "button", classe: "r-passo-botao", aria: "criar.menos", valores: { campo: rotulo } }, [R.icone("menos")]);
    var mais = el("button", { type: "button", classe: "r-passo-botao", aria: "criar.mais", valores: { campo: rotulo } }, [R.icone("mais")]);
    menos.addEventListener("click", function () { if (valor > minimo) { valor--; saida.textContent = String(valor); } });
    mais.addEventListener("click", function () { valor++; saida.textContent = String(valor); });
    var grupo = el("span", { classe: "r-passos", role: "group", "aria-labelledby": idRotulo }, [menos, saida, mais]);
    linha.appendChild(grupo);
  }

  contador(document.getElementById("noites"), "campo.noites", v.noites, 1, "rotulo-noites");

  var faixas = C.dado("faixas");
  var pessoas = document.getElementById("pessoas");
  [["adultos", "campo.adultos"], ["adolescentes", "campo.adolescentes"], ["criancas", "campo.criancas"],
   ["menores5", "campo.menores5"], ["pets", "campo.pets"]].forEach(function (par) {
    var id = "rotulo-" + par[0];
    var linha = el("div", { classe: "r-contador" }, [el("span", { classe: "r-contador-rotulo", id: id, texto: par[1] })]);
    contador(linha, par[1], faixas[par[0]], 0, id);
    pessoas.appendChild(linha);
  });

  document.getElementById("destino").value = v.destino.camping;
  document.getElementById("cidade").value = v.destino.cidade;
  document.getElementById("sem-dados-nome").textContent = v.destinoSemDados;

  R.iniciar();
})();
</script>
</body>
</html>
