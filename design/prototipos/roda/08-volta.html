<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.8"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="8">
<div class="r-app">
  <header class="r-topo"><span data-icone="barraca"></span><span data-dado="lista.cabecalho"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca">
      <p class="r-rotulo" data-texto="volta.rotulo"></p>
      <h1 data-texto="volta.titulo"></h1>
      <p class="r-frase" data-texto="volta.frase"></p>
      <div class="r-progresso">
        <p class="r-progresso-numero" id="progresso" data-texto="mensagem.progresso_conferidos"></p>
        <div class="r-barra" aria-hidden="true"><span id="barra"></span></div>
      </div>
    </div>

    <section class="r-secao" aria-labelledby="t-conferir">
      <h2 id="t-conferir" data-texto="bloco.conferir_volta"></h2>
      <ul class="r-cartao r-cartao--lista" id="categorias"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-desmontagem">
      <h2 id="t-desmontagem" data-texto="bloco.desmontagem"></h2>
      <ul class="r-cartao r-cartao--lista" id="desmontagem"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-em-casa">
      <h2 id="t-em-casa" data-texto="bloco.em_casa"></h2>
      <ul class="r-cartao r-cartao--lista" id="em-casa"></ul>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <a class="r-acao" href="09-em-casa.html" data-texto="acao.concluir"></a>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var v = C.dado("volta");
  var conferido = {};
  var secar = {};

  function contar(idCat) {
    var n = 0;
    C.itens().forEach(function (i) { if ((!idCat || i.categoria === idCat) && conferido[i.id]) n++; });
    return n;
  }

  function atualizarTotal() {
    var feitos = v.conferidos + contar();
    document.getElementById("progresso").setAttribute("data-valores", JSON.stringify({ feitos: feitos, total: v.total }));
    document.getElementById("barra").style.width = (100 * feitos / v.total) + "%";
  }

  /* Alternância com ícone em círculo e rótulo. */
  function alternancia(tipo, icone, chave, chaveAria, nome) {
    var ic = R.icone(icone);
    var b = el("button", { type: "button", classe: "r-estado r-estado--" + tipo, "aria-pressed": "false", aria: chaveAria, valores: { nome: nome } }, [
      el("span", { classe: "r-circulo", "aria-hidden": "true" }, [ic]), el("span", { texto: chave })
    ]);
    b.icone = ic;
    return b;
  }

  /* Conferir o que volta: os 68 itens, nas mesmas categorias, todos "não conferido" e destacados no início. */
  C.dado("lista.categorias").forEach(function (cat, n) {
    var idItens = "volta-" + cat.id;
    var prog = el("span", { classe: "r-cat-progresso", texto: "mensagem.progresso_conferidos" });
    var aberta = n === 0;
    var botao = el("button", { type: "button", classe: "r-cat", "aria-expanded": aberta ? "true" : "false", "aria-controls": idItens }, [
      el("span", { classe: "r-cat-texto" }, [el("span", { classe: "r-cat-nome", texto: "categoria." + cat.id }), prog]),
      R.icone("seta", "r-seta")
    ]);
    var ul = el("ul", { classe: "r-itens", id: idItens, hidden: !aberta });
    function atualizarCategoria() {
      prog.setAttribute("data-valores", JSON.stringify({ feitos: contar(cat.id), total: cat.itens.length }));
      botao.setAttribute("aria-label", C.texto("lista.cat_falado", { nome: C.texto("categoria." + cat.id), progresso: C.texto("mensagem.progresso_conferidos", { feitos: contar(cat.id), total: cat.itens.length }) }));
    }
    cat.itens.forEach(function (it) {
      var sit = el("span");
      var lembrete = el("span", { classe: "r-situacao r-situacao--neutro", hidden: true }, [R.icone("lembrete"), el("span", { texto: "mensagem.lembrete", valores: { dias: v.lembreteDias } })]);
      var titulo = el("span", { classe: "r-linha-titulo", dado: it.nome });
      var bConf = alternancia("carro", "caixa", "estado.conferido", "volta.marcar_conferido", it.nome);
      var bSecar = alternancia("separei", "secar", "estado.secar", "volta.marcar_secar", it.nome);
      var li = el("li", { classe: "r-linha r-linha--pendente" }, [
        el("div", { classe: "r-linha-nome" }, [titulo, el("span", { classe: "r-linha-info" }, [el("span", { dado: it.quantidadeTexto }), sit]), lembrete]),
        el("div", { classe: "r-linha-acoes" }, [bConf, bSecar])
      ]);
      function pintar() {
        var ok = !!conferido[it.id];
        bConf.setAttribute("aria-pressed", ok ? "true" : "false");
        R.trocarIcone(bConf.icone, ok ? "conferido" : "caixa");
        bSecar.setAttribute("aria-pressed", secar[it.id] ? "true" : "false");
        lembrete.hidden = !secar[it.id];
        li.classList.toggle("r-linha--pendente", !ok);
        sit.innerHTML = "";
        sit.className = "r-situacao r-situacao--" + (ok ? "carro" : "neutro");
        sit.appendChild(R.icone(ok ? "conferido" : "caixa"));
        sit.appendChild(el("span", { texto: ok ? "estado.conferido" : "estado.nao_conferido" }));
        titulo.setAttribute("aria-label", C.texto("estado.falado", { nome: it.nome, quantidade: it.quantidadeTexto, estado: C.texto(ok ? "estado.conferido" : "estado.nao_conferido") }));
      }
      bConf.addEventListener("click", function () {
        conferido[it.id] = !conferido[it.id];
        pintar(); atualizarCategoria(); atualizarTotal();
      });
      bSecar.addEventListener("click", function () {
        secar[it.id] = !secar[it.id];
        pintar();
        if (secar[it.id]) C.anunciar(C.texto("mensagem.lembrete", { dias: v.lembreteDias }));
      });
      pintar();
      ul.appendChild(li);
    });
    botao.addEventListener("click", function () {
      var a = botao.getAttribute("aria-expanded") !== "true";
      botao.setAttribute("aria-expanded", a ? "true" : "false");
      ul.hidden = !a;
    });
    atualizarCategoria();
    document.getElementById("categorias").appendChild(el("li", { classe: "r-categoria" }, [el("h3", {}, [botao]), ul]));
  });

  /* Desmontagem: tarefas com "feito". */
  v.desmontagem.forEach(function (t) {
    var b = alternancia("neutro", "caixa", "estado.feito", "lista.marcar_feito", t);
    b.setAttribute("data-valores", JSON.stringify({ tarefa: t }));
    b.addEventListener("click", function () {
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      R.trocarIcone(b.icone, on ? "feito" : "caixa");
    });
    document.getElementById("desmontagem").appendChild(el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [el("span", { classe: "r-linha-titulo", dado: t })]),
      el("div", { classe: "r-linha-acoes" }, [b])
    ]));
  });

  /* Em casa: o que fazer ao chegar. */
  v.emCasa.forEach(function (t) {
    var li = el("li", { classe: "r-linha" }, [R.circulo("casa", "neutro"), el("div", { classe: "r-linha-nome" }, [el("span", { classe: "r-linha-titulo", dado: t })])]);
    li.style.justifyContent = "flex-start";
    document.getElementById("em-casa").appendChild(li);
  });

  atualizarTotal();
  R.iniciar();
})();
</script>
</body>
</html>
