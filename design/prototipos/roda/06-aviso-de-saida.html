<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.6"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="6">
<div class="r-app">
  <header class="r-topo"><span data-icone="barraca"></span><span data-dado="lista.cabecalho"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca r-cabeca--com-figura">
      <div class="r-cabeca-texto">
        <h1 data-texto="aviso.titulo"></h1>
        <p class="r-progresso-numero" id="progresso" data-texto="mensagem.progresso_carro"></p>
        <p class="r-frase" id="frase"></p>
      </div>
      <span class="r-anfitriao r-anfitriao--pequeno"><span id="figura" data-mascote="pose-alerta" data-mascote-texto=""></span></span>
    </div>

    <div class="r-cartao r-familia" id="familia"></div>

    <section class="r-secao" aria-labelledby="t-fora">
      <h2 id="t-fora" data-texto="bloco.separados_fora"></h2>
      <ul class="r-cartao r-cartao--lista" id="fora"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-nao">
      <h2 id="t-nao" data-texto="bloco.nao_separados"></h2>
      <ul class="r-cartao r-cartao--lista" id="nao-separados"></ul>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <a class="r-acao" id="sair" href="07-estadia.html" data-texto="acao.sair_assim"></a>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var estados = {};
  var aviso = C.dado("avisoSaida");
  var idFamilia = C.dado("gastos.usuaria.familia");
  var fam = R.familia(idFamilia);

  /* O emblema da família acende quando a parte dela (a lista) termina; o anfitrião comemora. */
  var emblema = R.emblema(idFamilia, { informa: true });
  var estadoFamilia = el("span", { classe: "r-suave r-pequeno" });
  document.getElementById("familia").appendChild(emblema);
  document.getElementById("familia").appendChild(el("span", { classe: "r-familia-texto" }, [
    el("span", { classe: "r-familia-nome", dado: fam.nome }), estadoFamilia
  ]));

  function atualizar() {
    var p = C.progresso(estados);
    var falta = aviso.foraDoCarro.filter(function (id) { return (estados[id] || C.item(id).estado) !== "carro"; }).length;
    document.getElementById("progresso").setAttribute("data-valores", JSON.stringify({ feitos: p.noCarro, total: p.total }));
    var frase = document.getElementById("frase");
    frase.setAttribute("data-valores", JSON.stringify({ n: falta }));
    frase.setAttribute("data-texto", falta === 0 ? "aviso.tudo" : falta === 1 ? "aviso.falta_uma" : "aviso.faltam");
    estadoFamilia.setAttribute("data-valores", JSON.stringify({ n: falta }));
    estadoFamilia.setAttribute("data-texto", falta === 0 ? "aviso.familia_pronta" : "aviso.familia_falta");
    R.acender(emblema, falta === 0);
    document.getElementById("figura").setAttribute("data-mascote", falta === 0 ? "pose-comemorando" : "pose-alerta");
    var sair = document.getElementById("sair");
    sair.setAttribute("data-texto", falta === 0 ? "acao.confirmar_saida" : "acao.sair_assim");
    R.estadosDaLista(estados);
    return falta;
  }

  /* Separados e fora do carro: cada um com "está no carro". */
  aviso.foraDoCarro.forEach(function (id) {
    var it = C.item(id);
    var sit = el("span", { classe: "r-situacao r-situacao--separei" });
    var titulo = el("span", { classe: "r-linha-titulo", dado: it.nome });
    var b = el("button", { type: "button", classe: "r-estado r-estado--carro", "aria-pressed": "false", aria: "lista.marcar_carro", valores: { nome: it.nome } }, [
      el("span", { classe: "r-circulo", "aria-hidden": "true" }, [R.icone("carro")]),
      el("span", { texto: "estado.carro" })
    ]);
    function pintar() {
      var e = estados[id] || it.estado;
      b.setAttribute("aria-pressed", e === "carro" ? "true" : "false");
      sit.innerHTML = "";
      sit.className = "r-situacao r-situacao--" + (e === "carro" ? "carro" : "separei");
      if (e === "carro") { sit.appendChild(R.icone("carro")); sit.appendChild(el("span", { texto: "estado.carro" })); }
      else { sit.appendChild(R.icone("separei")); sit.appendChild(el("span", { texto: "lista.separei_fora", valores: { a: C.texto("estado.separei"), b: C.texto("estado.fora_do_carro") } })); }
      titulo.setAttribute("aria-label", C.nomeFalado(it, e));
    }
    b.addEventListener("click", function () {
      var e = estados[id] || it.estado;
      estados[id] = e === "carro" ? "separei" : "carro";
      pintar();
      var falta = atualizar();
      C.anunciar(falta === 0 ? C.texto("aviso.tudo") : C.nomeFalado(it, estados[id]));
    });
    pintar();
    document.getElementById("fora").appendChild(el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [titulo, el("span", { classe: "r-linha-info", "aria-hidden": "true" }, [el("span", { dado: it.quantidadeTexto }), sit])]),
      el("div", { classe: "r-linha-acoes" }, [b])
    ]));
  });

  /* Não separados (D-04): vazio, porque tudo foi separado. */
  var nao = document.getElementById("nao-separados");
  if (!aviso.naoSeparados.length) {
    nao.appendChild(el("li", { classe: "r-vazio" }, [el("span", { classe: "r-situacao r-situacao--neutro" }, [R.icone("ciente"), el("span", { texto: "mensagem.nao_separados_vazio" })])]));
  } else {
    aviso.naoSeparados.forEach(function (id) {
      nao.appendChild(el("li", { classe: "r-linha" }, [el("span", { classe: "r-linha-titulo", dado: C.item(id).nome })]));
    });
  }

  atualizar();
  R.iniciar();
})();
</script>
</body>
</html>
