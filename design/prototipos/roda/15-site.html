<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.15"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="15">
<div class="r-app">
  <header class="r-web-topo">
    <span class="r-web-marca" data-texto="app.nome"></span>
    <a class="r-ligacao" href="#espera" data-texto="site.ir_espera"></a>
  </header>
  <main class="r-conteudo">
    <section class="r-web-heroi" aria-labelledby="t-site">
      <div class="r-web-heroi-texto">
        <h1 id="t-site" data-texto="site.titulo"></h1>
        <p class="r-frase" data-texto="site.oQueE"></p>
        <p class="r-suave" data-texto="site.frase"></p>
      </div>
      <span class="r-anfitriao r-anfitriao--medio"><span data-mascote="principal" data-mascote-texto=""></span></span>
    </section>

    <div class="r-web-secoes">
      <section class="r-web-bloco r-web-bloco--tom" aria-labelledby="t-juntos">
        <h2 id="t-juntos" data-texto="site.juntos_titulo"></h2>
        <p data-texto="site.juntos_frase"></p>
        <div class="r-familias" id="familias" aria-hidden="true"></div>
      </section>

      <section class="r-web-bloco" aria-labelledby="t-lista">
        <h2 id="t-lista" data-texto="bloco.lista_pronta"></h2>
        <p class="r-suave" data-dado="site.resumoLista"></p>
        <ul class="r-cartao--lista" id="categorias"></ul>
      </section>

      <form class="r-web-bloco r-web-bloco--sol" id="espera" aria-labelledby="t-espera" novalidate>
        <h2 id="t-espera" data-texto="bloco.lista_espera"></h2>
        <p data-texto="site.espera_frase"></p>
        <div class="r-campo">
          <label class="r-campo-rotulo" for="email" data-texto="campo.seu_email"></label>
          <input class="r-entrada" id="email" type="email" autocomplete="email" inputmode="email">
          <p class="r-situacao r-situacao--atencao" id="email-erro" hidden><span data-icone="atencao"></span><span data-texto="site.email_vazio"></span></p>
        </div>
        <button type="button" class="r-marcar" id="consentimento" aria-pressed="false"><span class="r-circulo" aria-hidden="true"><span data-icone="caixa"></span></span><span data-texto="site.consentimento"></span></button>
        <button type="submit" class="r-acao r-web-acao" id="enviar" data-texto="acao.lista_espera"></button>
        <p class="r-nota" id="pronto" hidden><span data-icone="ciente"></span><span data-texto="mensagem.lista_espera_ok"></span></p>
      </form>
    </div>
  </main>
  <footer class="r-web-pe" data-texto="site.pe"></footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;

  C.dado("grupo.familias").forEach(function (f) { document.getElementById("familias").appendChild(R.emblema(f.id)); });

  /* A mesma lista da tela 4, só leitura, categorias recolhíveis, sem estados de marcação. */
  var lista = document.getElementById("categorias");
  C.dado("lista.categorias").forEach(function (cat) {
    var idItens = "site-" + cat.id;
    var botao = el("button", { type: "button", classe: "r-cat", "aria-expanded": "false", "aria-controls": idItens }, [
      el("span", { classe: "r-cat-texto" }, [
        el("span", { classe: "r-cat-nome", texto: "categoria." + cat.id }),
        el("span", { classe: "r-cat-progresso", texto: cat.itens.length === 1 ? "site.n_item" : "site.n_itens", valores: { n: cat.itens.length } })
      ]),
      R.icone("seta", "r-seta")
    ]);
    botao.setAttribute("aria-label", C.texto("lista.cat_falado", { nome: C.texto("categoria." + cat.id), progresso: C.texto(cat.itens.length === 1 ? "site.n_item" : "site.n_itens", { n: cat.itens.length }) }));
    var ul = el("ul", { classe: "r-itens", id: idItens, hidden: true });
    cat.itens.forEach(function (it) {
      ul.appendChild(el("li", { classe: "r-linha" }, [el("div", { classe: "r-linha-nome" }, [
        el("span", { classe: "r-linha-titulo", dado: it.nome }),
        el("span", { classe: "r-linha-info", dado: it.quantidadeTexto })
      ])]));
    });
    botao.addEventListener("click", function () {
      var a = botao.getAttribute("aria-expanded") !== "true";
      botao.setAttribute("aria-expanded", a ? "true" : "false");
      ul.hidden = !a;
    });
    lista.appendChild(el("li", { classe: "r-categoria" }, [el("h3", {}, [botao]), ul]));
  });

  /* Consentimento (P-18): alternância com caixa marcada e texto; sem link de política. */
  var consentimento = document.getElementById("consentimento");
  consentimento.addEventListener("click", function () {
    var on = consentimento.getAttribute("aria-pressed") !== "true";
    consentimento.setAttribute("aria-pressed", on ? "true" : "false");
    R.trocarIcone(consentimento.querySelector(".r-icone"), on ? "separei" : "caixa");
  });

  /* Lista de espera: e-mail e consentimento (P-18, sem link de política). */
  document.getElementById("espera").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = document.getElementById("email");
    var vazio = !email.value.trim();
    document.getElementById("email-erro").hidden = !vazio;
    if (vazio) { email.focus(); return; }
    document.getElementById("pronto").hidden = false;
    C.anunciar(C.texto("mensagem.lista_espera_ok"));
  });

  R.iniciar();
})();
</script>
</body>
</html>
