<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.7"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="7">
<div class="r-app">
  <header class="r-topo"><span data-icone="barraca"></span><span data-dado="lista.cabecalho"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca r-cabeca--com-figura">
      <div class="r-cabeca-texto">
        <p class="r-rotulo" data-texto="estadia.rotulo"></p>
        <h1 data-texto="estadia.titulo"></h1>
        <p class="r-frase" data-texto="estadia.frase"></p>
      </div>
      <span class="r-anfitriao r-anfitriao--pequeno"><span data-mascote="pose-camping" data-mascote-texto=""></span></span>
    </div>

    <section class="r-secao" aria-labelledby="t-regras">
      <div class="r-secao-cabeca">
        <h2 id="t-regras" data-texto="bloco.regras_a_mao"></h2>
        <p class="r-suave r-pequeno" id="origem"></p>
      </div>
      <ul class="r-cartao r-cartao--lista" id="regras"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-faltou">
      <h2 id="t-faltou" data-texto="bloco.faltou"></h2>
      <ul class="r-cartao r-cartao--lista" id="faltou"></ul>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <button type="button" class="r-acao" id="abrir-faltou" aria-haspopup="dialog"><span data-icone="faltou"></span><span data-texto="acao.faltou_algo"></span></button>
  </footer>
</div>

<div class="r-camada r-veu" id="veu" hidden>
  <div class="r-folha" role="dialog" aria-labelledby="t-folha">
    <div class="r-folha-cabeca">
      <h2 id="t-folha" data-texto="estadia.folha_titulo"></h2>
      <button type="button" class="r-botao" id="fechar-folha"><span data-icone="fechar"></span><span data-texto="acao.fechar"></span></button>
    </div>
    <div class="r-folha-corpo">
      <p class="r-suave" data-texto="estadia.folha_frase"></p>
      <form class="r-campo" id="escrito">
        <label class="r-campo-rotulo" for="nome-escrito" data-texto="estadia.escrever"></label>
        <div class="r-acoes-linha">
          <input class="r-entrada" id="nome-escrito" type="text" autocomplete="off" style="flex: 1 1 10rem; width: auto;">
          <button type="submit" class="r-botao r-botao--forte" data-texto="estadia.anotar"></button>
        </div>
      </form>
      <div class="r-secao" id="escolha"></div>
    </div>
  </div>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var e = C.dado("estadia");

  var origem = document.getElementById("origem");
  origem.setAttribute("data-texto", "mensagem.confirmado_por");
  origem.setAttribute("data-valores", JSON.stringify({ n: e.confirmacoes }));

  /* Regras à mão: as regras e os avisos do camping; a regra com fato leva ao fato (tela 10). */
  var niveis = {};
  C.dado("alertas").forEach(function (a) { niveis[a.id] = a.nivel; });
  e.regrasAMao.forEach(function (r) {
    var atencao = r.origem === "alerta" && niveis[r.id] === "atencao";
    var ic = r.origem === "regra" ? "ciente" : atencao ? "atencao" : "informacao";
    var nome = r.fato
      ? el("a", { classe: "r-linha-titulo", href: "10-fato.html", dado: r.texto })
      : el("span", { classe: "r-linha-titulo", dado: r.texto });
    var linha = el("li", { classe: "r-linha" }, [
      R.circulo(ic, atencao ? "atencao" : "neutro"),
      el("div", { classe: "r-linha-nome" }, [
        nome,
        atencao ? el("span", { classe: "r-linha-info" }, [el("span", { classe: "r-situacao r-situacao--atencao", texto: "nivel.atencao" })]) : null,
        r.fato ? el("span", { classe: "r-linha-info", texto: "estadia.ver_fato" }) : null
      ])
    ]);
    linha.style.justifyContent = "flex-start";
    document.getElementById("regras").appendChild(linha);
  });

  /* Faltou: vazio no início; em dois toques ("Faltou algo" e o item) o item entra em "faltou" (E1-09). */
  var faltouLista = document.getElementById("faltou");
  var anotados = [];
  function pintarFaltou() {
    faltouLista.innerHTML = "";
    if (!anotados.length) {
      faltouLista.appendChild(el("li", { classe: "r-vazio", texto: "estadia.faltou_vazio" }));
      return;
    }
    anotados.forEach(function (nome) {
      faltouLista.appendChild(el("li", { classe: "r-linha" }, [
        el("div", { classe: "r-linha-nome" }, [
          el("span", { classe: "r-linha-titulo", dado: nome }),
          el("span", { classe: "r-linha-info" }, [el("span", { classe: "r-situacao r-situacao--atencao" }, [R.icone("faltou"), el("span", { texto: "estado.faltou" })])])
        ])
      ]));
    });
  }
  pintarFaltou();

  var veu = document.getElementById("veu");
  var botaoAbrir = document.getElementById("abrir-faltou");
  var f = R.folha(veu, function () { botaoAbrir.focus(); });

  function anotar(nome) {
    if (!nome) return;
    if (anotados.indexOf(nome) < 0) anotados.push(nome);
    pintarFaltou();
    f.fechar();
    C.anunciar(C.texto("estadia.anotado", { nome: nome }));
  }

  /* A escolha: os itens da lista, por categoria. */
  var escolha = document.getElementById("escolha");
  C.dado("lista.categorias").forEach(function (cat) {
    var caixa = el("div", { classe: "r-secao", role: "group", "aria-labelledby": "esc-" + cat.id }, [
      el("h3", { classe: "r-rotulo", id: "esc-" + cat.id, texto: "categoria." + cat.id })
    ]);
    var botoes = el("div", { classe: "r-opcoes" });
    cat.itens.forEach(function (i) {
      var b = el("button", { type: "button", classe: "r-opcao", dado: i.nome });
      b.style.flex = "0 1 auto";
      b.addEventListener("click", function () { anotar(i.nome); });
      botoes.appendChild(b);
    });
    caixa.appendChild(botoes);
    escolha.appendChild(caixa);
  });

  document.getElementById("escrito").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var campo = document.getElementById("nome-escrito");
    var nome = campo.value.trim();
    if (!nome) { campo.focus(); return; }
    campo.value = "";
    anotar(nome);
  });

  botaoAbrir.addEventListener("click", function () { f.abrir("estadia.folha_aberta"); });
  document.getElementById("fechar-folha").addEventListener("click", function () { f.fechar(); });

  R.iniciar();
})();
</script>
</body>
</html>
