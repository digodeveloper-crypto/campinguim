<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="titulo.11"></title>
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-tela="11">
<div class="r-app">
  <header class="r-topo"><span data-icone="grupo"></span><span data-dado="grupo.nomeViagem.texto"></span></header>
  <main class="r-conteudo">
    <div class="r-cabeca">
      <h1 data-texto="grupo.titulo"></h1>
      <p class="r-frase" id="frase"></p>
      <p class="r-suave r-pequeno" id="organizadora"></p>
    </div>

    <section class="r-secao" aria-labelledby="t-familias">
      <h2 id="t-familias" data-texto="bloco.familias"></h2>
      <div class="r-cartao r-familias" id="familias"></div>
    </section>

    <section class="r-secao" aria-labelledby="t-sem-dono">
      <h2 id="t-sem-dono" data-texto="bloco.ninguem_pegou"></h2>
      <ul class="r-cartao r-cartao--lista" id="sem-dono"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-duplicado">
      <h2 id="t-duplicado" data-texto="bloco.duplicado"></h2>
      <ul class="r-cartao r-cartao--lista" id="duplicado"></ul>
    </section>

    <section class="r-secao" aria-labelledby="t-quem-leva">
      <h2 id="t-quem-leva" data-texto="grupo.com_dono"></h2>
      <ul class="r-cartao r-cartao--lista" id="quem-leva"></ul>
    </section>

    <section class="r-secao">
      <p class="r-nota" id="lembrado" hidden><span data-icone="lembrete"></span><span data-texto="grupo.lembrete_ok"></span></p>
      <a class="r-ligacao" href="14-convidado.html"><span data-icone="site"></span><span data-texto="acao.ver_convidado"></span></a>
    </section>
  </main>
  <footer class="r-rodape">
    <button type="button" class="r-mural-botao" data-mural><span data-icone="mural"></span><span data-texto="nav.mural"></span></button>
    <button type="button" class="r-acao" id="lembrar"><span data-icone="lembrete"></span><span data-texto="acao.lembrar"></span></button>
  </footer>
</div>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CAMPINGUIM, R = window.RODA, el = R.el;
  var g = C.dado("grupo");
  var usuaria = C.dado("cenario.usuaria");
  var minhaFamilia = C.dado("gastos.usuaria.familia");

  var org = document.getElementById("organizadora");
  org.setAttribute("data-texto", "grupo.organizadora");
  org.setAttribute("data-valores", JSON.stringify({ nome: g.organizadora }));

  /* Famílias com o emblema (sem progresso por família: P-10). */
  g.familias.forEach(function (f) {
    document.getElementById("familias").appendChild(el("div", { classe: "r-familia" }, [
      R.emblema(f.id),
      el("span", { classe: "r-familia-texto" }, [el("span", { classe: "r-familia-nome", dado: f.descricao }), el("span", { classe: "r-suave r-pequeno", dado: f.pessoas })])
    ]));
  });

  function itemDoGrupo(id) {
    for (var i = 0; i < g.itens.lista.length; i++) if (g.itens.lista[i].id === id) return g.itens.lista[i];
    return null;
  }

  /* Pílula de quem leva: o emblema pequeno e o nome. */
  function pilula(nome, familia) {
    return el("span", { classe: "r-pilula" }, [familia ? R.emblema(familia) : null, el("span", { texto: "mensagem.leva", valores: { nome: nome } })]);
  }

  /* Ninguém pegou: cada um com "eu levo" (E2-04, E2-05); assumir mostra o nome e "desistir". */
  var semDono = 0;
  function atualizarFrase() {
    var f = document.getElementById("frase");
    f.setAttribute("data-valores", JSON.stringify({ n: semDono }));
    f.setAttribute("data-texto", semDono === 0 ? "grupo.todos_com_dono" : semDono === 1 ? "grupo.sem_dono_um" : "grupo.sem_dono");
  }
  g.semDono.forEach(function (id) {
    var it = itemDoGrupo(id);
    semDono++;
    var estado = el("span", { classe: "r-linha-info" });
    var botao = el("button", { type: "button", classe: "r-botao r-botao--forte" }, [R.icone("eu-levo"), el("span", { texto: "acao.eu_levo" })]);
    var meu = false;
    function pintar() {
      estado.innerHTML = "";
      estado.appendChild(meu ? pilula(usuaria, minhaFamilia) : el("span", { classe: "r-pilula r-pilula--sem-dono", texto: "mensagem.ninguem_pegou" }));
      botao.querySelector("[data-texto]").setAttribute("data-texto", meu ? "acao.desistir" : "acao.eu_levo");
      R.trocarIcone(botao.querySelector(".r-icone"), meu ? "desfazer" : "eu-levo");
      botao.setAttribute("data-texto-aria", meu ? "grupo.desistir_item" : "grupo.levar_item");
      botao.setAttribute("data-valores", JSON.stringify({ item: it.nome }));
    }
    botao.addEventListener("click", function () {
      meu = !meu;
      semDono += meu ? -1 : 1;
      pintar();
      atualizarFrase();
      C.anunciar(C.texto(meu ? "grupo.levando" : "grupo.desistiu", { item: it.nome, nome: usuaria }));
    });
    pintar();
    document.getElementById("sem-dono").appendChild(el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [el("span", { classe: "r-linha-titulo", dado: it.nome }), estado]),
      el("div", { classe: "r-linha-acoes" }, [botao])
    ]));
  });
  atualizarFrase();

  /* Duplicado: o item assumido por mais de uma família, com o aviso (P-09). */
  g.duplicados.forEach(function (id) {
    var it = itemDoGrupo(id);
    var li = el("li", { classe: "r-linha" }, [
      R.circulo("atencao", "atencao"),
      el("div", { classe: "r-linha-nome" }, [
        el("span", { classe: "r-linha-titulo", dado: it.nome }),
        el("span", { classe: "r-linha-info" }, [el("span", { classe: "r-situacao r-situacao--atencao", texto: "mensagem.assumidos", valores: { n: it.assumidos } })]),
        el("span", { dado: it.aviso })
      ])
    ]);
    li.style.justifyContent = "flex-start";
    document.getElementById("duplicado").appendChild(li);
  });

  /* Quem leva o quê: o item que virou gasto leva aos gastos (tela 12). */
  g.quemLeva.forEach(function (id) {
    var it = itemDoGrupo(id);
    var nome = it.gasto
      ? el("a", { classe: "r-linha-titulo", href: "12-gastos.html", dado: it.nome })
      : el("span", { classe: "r-linha-titulo", dado: it.nome });
    document.getElementById("quem-leva").appendChild(el("li", { classe: "r-linha" }, [
      el("div", { classe: "r-linha-nome" }, [nome, el("span", { classe: "r-linha-info" }, [pilula(it.dono, it.familia)]),
        it.gasto ? el("span", { classe: "r-linha-info", texto: "grupo.ver_gasto" }) : null])
    ]));
  });

  /* Lembrar quem falta (E2-07). */
  var lembrar = document.getElementById("lembrar");
  lembrar.addEventListener("click", function () {
    document.getElementById("lembrado").hidden = false;
    C.anunciar(C.texto("grupo.lembrete_ok"));
  });

  R.iniciar();
})();
</script>
</body>
</html>
