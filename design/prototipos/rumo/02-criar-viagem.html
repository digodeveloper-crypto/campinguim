<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.2"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="2">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca"></p>
    <h1 class="titulo-tela" data-texto="rumo.t2.titulo"></h1>
    <p class="etapa-sub" data-texto="rumo.t2.intro"></p>
  </header>

  <section class="bloco" aria-labelledby="tipo-titulo">
    <h2 class="campo-rotulo" id="tipo-titulo"><span data-texto="campo.tipo"></span><span class="campo-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
    <div class="opcoes" id="tipos" role="group" aria-labelledby="tipo-titulo"></div>
  </section>

  <section class="bloco">
    <div class="folha" id="noites"></div>
    <label class="campo">
      <span class="campo-rotulo" data-texto="campo.datas"></span>
      <input class="entrada" type="text" id="datas" autocomplete="off">
    </label>
  </section>

  <section class="bloco" aria-labelledby="pessoas-titulo">
    <h2 class="campo-rotulo" id="pessoas-titulo"><span data-texto="campo.pessoas"></span><span class="campo-obrigatorio" data-texto="campo.obrigatorio"></span></h2>
    <ul class="folha" id="pessoas"></ul>
  </section>

  <section class="bloco" aria-labelledby="clima-titulo">
    <h2 class="campo-rotulo" id="clima-titulo" data-texto="campo.clima"></h2>
    <div class="opcoes" id="climas" role="group" aria-labelledby="clima-titulo"></div>
  </section>

  <section class="bloco" aria-labelledby="chuva-titulo">
    <h2 class="campo-rotulo" id="chuva-titulo" data-texto="campo.chuva"></h2>
    <div class="opcoes" id="chuva" role="group" aria-labelledby="chuva-titulo"></div>
  </section>

  <section class="bloco" aria-labelledby="destino-titulo">
    <h2 class="campo-rotulo" id="destino-titulo" data-texto="campo.destino"></h2>
    <input class="entrada" type="text" id="destino" aria-labelledby="destino-titulo" autocomplete="off">
    <p class="rotulo rotulo--espaco" id="resultados-titulo" data-texto="rumo.t2.resultados"></p>
    <ul class="folha" aria-labelledby="resultados-titulo">
      <li class="resultado resultado--escolhido">
        <span class="resultado-texto">
          <span data-dado="viagem.destino.camping"></span>
          <span class="linha-sub" id="confirmado"></span>
        </span>
        <span class="estado estado--conferido" id="escolhido"></span>
      </li>
      <li>
        <a class="resultado" href="13-camping-sem-dados.html">
          <span class="resultado-texto">
            <span data-dado="viagem.destinoSemDados"></span>
            <span class="linha-sub" data-texto="rumo.t2.sem_registro"></span>
          </span>
          <span id="seta-pedra"></span>
        </a>
      </li>
    </ul>
    <label class="campo">
      <span class="campo-rotulo" data-texto="campo.cidade"></span>
      <input class="entrada" type="text" id="cidade" autocomplete="off">
    </label>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  R.montar({
    parada: "preparar",
    icone: true,
    acoes: [{ id: "gerar", chave: "acao.gerar_lista", href: "03-alertas.html" }]
  });

  /* Escolha de uma opção entre várias (aria-pressed). */
  function escolha(caixaId, valores, prefixo, atual) {
    var caixa = document.getElementById(caixaId);
    valores.forEach(function (v) {
      var b = R.el("button", "opcao", { type: "button", "aria-pressed": v === atual ? "true" : "false" });
      b.appendChild(R.tx("span", null, prefixo + v));
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(caixa.querySelectorAll(".opcao"), function (o) { o.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
      });
      caixa.appendChild(b);
    });
  }
  escolha("tipos", D.viagem.tipos, "opcao.tipo.", D.viagem.tipo);
  escolha("climas", D.viagem.climas, "opcao.clima.", D.viagem.clima);
  escolha("chuva", ["sim", "nao"], "opcao.", D.viagem.chuva ? "sim" : "nao");

  /* Contador com menos e mais. */
  function contador(tag, chaveCampo, valor) {
    var linha = R.el(tag, "contador");
    var nome = R.tx("span", "contador-nome", chaveCampo);
    var controle = R.el("span", "contador-controle");
    var campo = R.texto(chaveCampo);
    var menos = R.el("button", "passo", { type: "button", "data-texto-aria": "rumo.t2.menos", "data-valores": JSON.stringify({ campo: campo }) }, R.icone("menos"));
    var mais = R.el("button", "passo", { type: "button", "data-texto-aria": "rumo.t2.mais", "data-valores": JSON.stringify({ campo: campo }) }, R.icone("mais"));
    var saida = R.tx("span", "contador-valor", "rumo.rota.num", { n: valor }, { "aria-live": "polite" });
    function mudar(d) {
      valor = Math.max(0, valor + d);
      saida.setAttribute("data-valores", JSON.stringify({ n: valor }));
    }
    menos.addEventListener("click", function () { mudar(-1); });
    mais.addEventListener("click", function () { mudar(1); });
    controle.appendChild(menos);
    controle.appendChild(saida);
    controle.appendChild(mais);
    linha.appendChild(nome);
    linha.appendChild(controle);
    return linha;
  }
  var noites = contador("div", "campo.noites", D.viagem.noites);
  noites.querySelector(".contador-nome").appendChild(R.tx("span", "campo-obrigatorio", "campo.obrigatorio"));
  document.getElementById("noites").appendChild(noites);
  var pessoas = document.getElementById("pessoas");
  [["campo.adultos", "adultos"], ["campo.adolescentes", "adolescentes"], ["campo.criancas", "criancas"],
    ["campo.menores5", "menores5"], ["campo.pets", "pets"]].forEach(function (f) {
    pessoas.appendChild(contador("li", f[0], D.faixas[f[1]]));
  });

  /* Destino: o camping escolhido e o exemplo de camping sem dados (ligação 2 → 13). */
  document.getElementById("destino").value = D.viagem.destino.camping;
  document.getElementById("cidade").value = D.viagem.destino.cidade;
  var conf = document.getElementById("confirmado");
  conf.setAttribute("data-texto", "mensagem.confirmado_por");
  conf.setAttribute("data-valores", JSON.stringify({ n: D.camping.confirmacoes }));
  var esc = document.getElementById("escolhido");
  esc.innerHTML = R.icone("conferido", true);
  esc.appendChild(R.tx("span", null, "rumo.t2.escolhido"));
  document.getElementById("seta-pedra").outerHTML = R.icone("direita");
})();
</script>
</body>
</html>
