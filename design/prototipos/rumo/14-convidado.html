<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.14"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="14">
<main class="rumo web">
  <nav class="regua-web" data-texto-aria="rumo.t14.regua_rotulo">
    <ol>
      <li><a href="#convite" data-texto="rumo.t14.regua.convite"></a></li>
      <li><a href="#entrar" data-texto="rumo.t14.regua.entrar"></a></li>
      <li><a href="#lista" data-texto="rumo.t14.regua.lista"></a></li>
      <li><a href="#devo" data-texto="rumo.t14.regua.devo"></a></li>
    </ol>
  </nav>

  <p class="web-marca" id="marca"><span data-texto="app.nome"></span></p>

  <section class="secao etapa" id="convite">
    <p class="etapa-marca" data-texto="rumo.etapa.web"></p>
    <h1 class="titulo-tela" data-dado="convidado.convite.viagem"></h1>
    <p class="etapa-sub" id="convidou"></p>
    <p class="etapa-sub" data-texto="rumo.t14.sem_instalar"></p>
  </section>

  <section class="secao" id="entrar" aria-labelledby="entrar-titulo">
    <h2 class="bloco-titulo" id="entrar-titulo" data-texto="rumo.t14.regua.entrar"></h2>
    <div class="folha formulario">
      <label class="campo">
        <span class="campo-rotulo" data-texto="campo.seu_nome"></span>
        <input class="entrada" type="text" id="nome" autocomplete="off">
      </label>
      <label class="campo">
        <span class="campo-rotulo" data-texto="campo.sua_familia"></span>
        <input class="entrada" type="text" id="familia" autocomplete="off">
      </label>
      <button type="button" class="botao botao--principal botao--bloco" id="entrar-botao"><span data-texto="acao.entrar"></span></button>
      <p class="mensagem" id="entrou" aria-live="polite"></p>
    </div>
  </section>

  <section class="secao" id="lista" aria-labelledby="lista-titulo">
    <h2 class="bloco-titulo" id="lista-titulo" data-texto="bloco.lista_do_grupo"></h2>
    <ul class="folha" id="itens"></ul>
    <p class="mensagem" id="entre-antes" aria-live="polite"></p>
  </section>

  <section class="secao" id="devo" aria-labelledby="devo-titulo">
    <h2 class="bloco-titulo" id="devo-titulo" data-texto="bloco.o_que_eu_devo"></h2>
    <div class="folha parte">
      <p class="parte-devem" id="deve"></p>
    </div>
    <a class="botao botao--secundaria botao--bloco" href="15-site.html"><span data-texto="acao.baixar_app"></span></a>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  var C = D.convidado;
  R.montar({ rota: false, legenda: false, curvas: { cx: 300, cy: 40, aneis: 7 } });
  document.getElementById("marca").insertBefore(R.mascote("icone", "apoio--marca"), document.getElementById("marca").firstChild);

  var conv = document.getElementById("convidou");
  conv.setAttribute("data-texto", "mensagem.convidou");
  conv.setAttribute("data-valores", JSON.stringify({ nome: C.convite.convidouPor }));

  /* Entrar: no protótipo, tocar no campo preenche com o nome do convidado de dados.js. */
  var nome = document.getElementById("nome"), familia = document.getElementById("familia");
  nome.addEventListener("focus", function () { if (!nome.value) nome.value = C.nome; });
  familia.addEventListener("focus", function () { if (!familia.value) familia.value = C.familia; });
  var dentro = false;
  document.getElementById("entrar-botao").addEventListener("click", function () {
    if (!nome.value) nome.value = C.nome;
    if (!familia.value) familia.value = C.familia;
    dentro = true;
    var m = document.getElementById("entrou");
    m.innerHTML = R.icone("ciente");
    m.appendChild(R.tx("span", null, "rumo.t14.entrou", { nome: nome.value }));
    document.getElementById("entre-antes").innerHTML = "";
  });

  /* Lista do grupo: o convidado assume o isqueiro (E2-04). */
  D.grupo.itens.lista.forEach(function (it) {
    var li = R.el("li", "linha");
    li.innerHTML = R.icone(it.semDono ? "sem_dono" : it.duplicado ? "copiar" : "pessoa");
    var t = R.el("span", "linha-texto");
    var n = R.el("span", "linha-nome");
    n.textContent = it.nome;
    t.appendChild(n);
    var sub;
    if (it.semDono) sub = R.tx("span", "linha-sub", "mensagem.ninguem_pegou");
    else if (it.duplicado) sub = R.tx("span", "linha-sub", "mensagem.assumidos", { n: it.assumidos });
    else { sub = R.el("span", "linha-sub"); sub.textContent = it.dono; }
    t.appendChild(sub);
    li.appendChild(t);
    if (it.semDono) {
      var b = R.el("button", "marca marca--levar", { type: "button", "data-texto-aria": "rumo.t11.eu_levo_aria", "data-valores": JSON.stringify({ item: it.nome }) });
      var rot = R.tx("span", null, "acao.eu_levo");
      b.appendChild(rot);
      var meu = false;
      b.addEventListener("click", function () {
        if (!dentro) {
          var aviso = document.getElementById("entre-antes");
          aviso.innerHTML = R.icone("info");
          aviso.appendChild(R.tx("span", null, "rumo.t14.entre_antes"));
          nome.focus();
          return;
        }
        meu = !meu;
        rot.setAttribute("data-texto", meu ? "acao.desistir" : "acao.eu_levo");
        b.setAttribute("data-texto-aria", meu ? "acao.desistir" : "rumo.t11.eu_levo_aria");
        sub.setAttribute("data-texto", meu ? "mensagem.leva" : "mensagem.ninguem_pegou");
        sub.setAttribute("data-valores", JSON.stringify({ nome: nome.value || C.nome }));
      });
      li.appendChild(b);
    }
    document.getElementById("itens").appendChild(li);
  });

  /* O que eu devo: sem chave Pix (spec, guest_view). */
  var deve = document.getElementById("deve");
  deve.setAttribute("data-texto", "rumo.t14.deve");
  deve.setAttribute("data-valores", JSON.stringify({
    devem: R.texto("mensagem.voces_devem", { pessoa: C.deve.a, valor: cg.dinheiro(C.deve.centavos) }),
    item: C.deve.item
  }));

  /* Régua: marca a seção que está na tela. */
  var ligacoes = document.querySelectorAll(".regua-web a");
  if (window.IntersectionObserver) {
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        Array.prototype.forEach.call(ligacoes, function (a) {
          a.setAttribute("aria-current", a.getAttribute("href") === "#" + e.target.id ? "true" : "false");
        });
      });
    }, { root: cg.elementoRolagem, rootMargin: "-20% 0px -60% 0px" });
    Array.prototype.forEach.call(document.querySelectorAll(".secao"), function (s) { obs.observe(s); });
  }
})();
</script>
</body>
</html>
