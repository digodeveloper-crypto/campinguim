<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.15"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="15">
<main class="rumo web">
  <nav class="regua-web" data-texto-aria="rumo.t14.regua_rotulo">
    <ol>
      <li><a href="#oque" data-texto="rumo.t15.regua.oque"></a></li>
      <li><a href="#lista" data-texto="rumo.t15.regua.lista"></a></li>
      <li><a href="#espera" data-texto="rumo.t15.regua.espera"></a></li>
    </ol>
  </nav>

  <section class="secao site-heroi" id="oque">
    <div class="abertura-mapa" id="mapa"></div>
    <h1 class="marca-nome" data-texto="app.nome"></h1>
    <p class="abertura-frase" data-texto="site.oQueE"></p>
  </section>

  <section class="secao" id="lista" aria-labelledby="lista-titulo">
    <h2 class="bloco-titulo" id="lista-titulo" data-texto="bloco.lista_pronta"></h2>
    <p class="subtitulo" data-dado="site.resumoLista"></p>
    <p class="suave" data-texto="rumo.t15.lista_intro"></p>
    <div id="categorias"></div>
  </section>

  <section class="secao" id="espera" aria-labelledby="espera-titulo">
    <h2 class="bloco-titulo" id="espera-titulo" data-texto="bloco.lista_espera"></h2>
    <div class="folha formulario">
      <label class="campo">
        <span class="campo-rotulo" data-texto="campo.seu_email"></span>
        <input class="entrada" type="email" id="email" autocomplete="email">
      </label>
      <button type="button" class="check" id="consentimento" role="checkbox" aria-checked="false">
        <span class="check-caixa" id="check-caixa"></span>
        <span class="check-texto" data-texto="site.consentimento"></span>
      </button>
      <button type="button" class="botao botao--principal botao--bloco" id="enviar"><span data-texto="acao.lista_espera"></span></button>
      <p class="mensagem" id="resposta" aria-live="polite"></p>
    </div>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  R.montar({ rota: false, legenda: false, curvas: false });

  var mapa = document.getElementById("mapa");
  mapa.innerHTML = R.curvas({ w: 358, h: 260, cx: 179, cy: 190, aneis: 9, r0: 22, passo: 16, sx: 1.7, sy: 0.8, fase: 1.1 });
  mapa.appendChild(R.mascote("principal", "apoio--abertura", true));

  /* A mesma lista da tela 4, só leitura, categorias recolhíveis, sem estados. */
  var caixa = document.getElementById("categorias");
  D.lista.categorias.forEach(function (c) {
    var folha = R.el("ul", "folha");
    c.itens.forEach(function (i) {
      var li = R.el("li", "linha");
      var n = R.el("span", "linha-texto");
      n.textContent = i.nome;
      var q = R.el("span", "linha-qtd suave");
      q.textContent = i.quantidadeTexto;
      li.appendChild(n);
      li.appendChild(q);
      folha.appendChild(li);
    });
    var r = R.recolhivel("site-" + c.id, false,
      [R.tx("span", "cat-nome", "categoria." + c.id), R.tx("span", "cat-prog", R.contagem("rumo.t15.itens", c.itens.length), { n: c.itens.length })], folha);
    caixa.appendChild(r.secao);
  });

  /* Lista de espera (P-18: caixa de consentimento, sem link de política). */
  var check = document.getElementById("consentimento");
  document.getElementById("check-caixa").innerHTML = R.icone("ciente");
  check.addEventListener("click", function () {
    check.setAttribute("aria-checked", check.getAttribute("aria-checked") === "true" ? "false" : "true");
  });
  var email = document.getElementById("email");
  document.getElementById("enviar").addEventListener("click", function () {
    var r = document.getElementById("resposta");
    var ok = !!email.value.trim();
    r.innerHTML = R.icone(ok ? "ciente" : "info");
    r.appendChild(R.tx("span", null, ok ? "mensagem.lista_espera_ok" : "rumo.t15.email_vazio"));
    if (!ok) email.focus();
  });

  var ligacoes = document.querySelectorAll(".regua-web a");
  if (window.IntersectionObserver) {
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        Array.prototype.forEach.call(ligacoes, function (a) {
          a.setAttribute("aria-current", a.getAttribute("href") === "#" + e.target.id ? "true" : "false");
        });
      });
    }, { root: cg.elementoRolagem, rootMargin: "-20% 0px -60% 0px" });
    Array.prototype.forEach.call(document.querySelectorAll(".secao"), function (s) { obs.observe(s); });
  }
})();
</script>
</body>
</html>
