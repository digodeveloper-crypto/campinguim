<script>
(function () {
  "use strict";
  var R = window.RUMO;
  /* O mascote no topo do mapa: em pé sobre o cume das curvas de nível. */
  var mapa = document.getElementById("mapa");
  mapa.innerHTML = R.curvas({ w: 358, h: 340, cx: 179, cy: 250, aneis: 11, r0: 26, passo: 17, sx: 1.6, sy: 0.82, fase: 0.4 });
  mapa.appendChild(R.mascote("principal", "apoio--abertura", true));
  /* Prévia da rota: as cinco paradas, só para ler. */
  var previa = document.getElementById("previa");
  R.paradas.forEach(function (p) { previa.appendChild(R.tx("li", null, p.chave)); });
  R.montar({
    rota: false,
    curvas: false,
    legenda: false,
    acoes: [{ id: "comecar", chave: "acao.comecar", href: "02-criar-viagem.html" }],
    discreto: { href: "15-site.html", chave: "acao.ver_site" }

})();
