<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.11"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="11">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca"></p>
    <h1 class="titulo-tela" data-texto="rumo.t11.titulo"></h1>
    <p class="etapa-sub" data-dado="grupo.nomeViagem.texto"></p>
  </header>

  <section class="bloco" aria-labelledby="familias-titulo">
    <h2 class="bloco-titulo" id="familias-titulo"></h2>
    <ul class="folha" id="familias"></ul>
  </section>

  <section class="bloco" aria-labelledby="sem-dono-titulo">
    <h2 class="bloco-titulo nivel--atencao" id="sem-dono-titulo"></h2>
    <ul class="folha" id="sem-dono"></ul>
  </section>

  <section class="bloco" aria-labelledby="duplicado-titulo">
    <h2 class="bloco-titulo" id="duplicado-titulo"></h2>
    <ul class="folha" id="duplicado"></ul>
  </section>

  <section class="bloco" aria-labelledby="quem-titulo">
    <h2 class="bloco-titulo" id="quem-titulo"></h2>
    <ul class="folha" id="quem-leva"></ul>
  </section>

  <section class="bloco">
    <a class="linha-ligacao ligacao-solta" href="14-convidado.html" id="ver-convidado"></a>
    <p class="mensagem" id="lembrado" aria-live="polite"></p>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  var G = D.grupo;
  var refs = R.montar({
    parada: null,
    area: "area.grupo",
    acoes: [{ id: "lembrar", chave: "acao.lembrar" }]
  });

  function titulo(id, ico, chave, ativo) {
    var h = document.getElementById(id);
    h.innerHTML = R.icone(ico, ativo);
    h.appendChild(R.tx("span", null, chave));
  }
  titulo("familias-titulo", "grupo", "bloco.familias");
  titulo("sem-dono-titulo", "atencao", "bloco.ninguem_pegou", true);
  titulo("duplicado-titulo", "copiar", "bloco.duplicado");
  titulo("quem-titulo", "tarefa", "bloco.quem_leva");

  function item(id) {
    for (var i = 0; i < G.itens.lista.length; i++) if (G.itens.lista[i].id === id) return G.itens.lista[i];
    return null;
  }
  function texto(classe, valor) {
    var s = R.el("span", classe);
    s.textContent = valor;
    return s;
  }

  /* Famílias (sem progresso por família, P-10). */
  G.familias.forEach(function (f) {
    var li = R.el("li", "linha");
    li.innerHTML = R.icone("pessoa");
    var t = R.el("span", "linha-texto");
    t.appendChild(texto("linha-nome", f.descricao));
    t.appendChild(texto("linha-sub", f.pessoas));
    li.appendChild(t);
    document.getElementById("familias").appendChild(li);
  });

  /* Ninguém pegou: "eu levo" mostra quem leva, com "desistir" (E2-05). */
  G.semDono.forEach(function (id) {
    var it = item(id);
    var li = R.el("li", "linha");
    li.innerHTML = R.icone("sem_dono");
    var t = R.el("span", "linha-texto");
    t.appendChild(texto("linha-nome", it.nome));
    var sub = R.tx("span", "linha-sub", "mensagem.ninguem_pegou");
    t.appendChild(sub);
    li.appendChild(t);
    var b = R.el("button", "marca", { type: "button" });
    var rot = R.tx("span", null, "acao.eu_levo");
    b.appendChild(rot);
    var meu = false;
    b.setAttribute("data-texto-aria", "rumo.t11.eu_levo_aria");
    b.setAttribute("data-valores", JSON.stringify({ item: it.nome }));
    b.addEventListener("click", function () {
      meu = !meu;
      rot.setAttribute("data-texto", meu ? "acao.desistir" : "acao.eu_levo");
      b.setAttribute("data-texto-aria", meu ? "acao.desistir" : "rumo.t11.eu_levo_aria");
      sub.setAttribute("data-texto", meu ? "mensagem.leva" : "mensagem.ninguem_pegou");
      sub.setAttribute("data-valores", JSON.stringify({ nome: G.organizadora }));
      li.firstChild.outerHTML = R.icone(meu ? "pessoa" : "sem_dono");
    });
    li.appendChild(b);
    document.getElementById("sem-dono").appendChild(li);
  });

  /* Duplicado: 3 fogareiros assumidos, sem nomes (P-09). */
  G.duplicados.forEach(function (id) {
    var it = item(id);
    var li = R.el("li", "linha linha--atencao");
    li.innerHTML = R.icone("atencao");
    var t = R.el("span", "linha-texto");
    t.appendChild(texto("linha-nome", it.nome));
    t.appendChild(R.tx("span", "linha-sub", "mensagem.assumidos", { n: it.assumidos }));
    t.appendChild(texto("linha-sub nivel--atencao", it.aviso));
    li.appendChild(t);
    document.getElementById("duplicado").appendChild(li);
  });

  /* Quem leva o quê: o item com gasto abre os gastos (11 → 12). */
  G.quemLeva.forEach(function (id) {
    var it = item(id);
    var li = R.el("li", "linha");
    var a = R.el("a", "linha-ligacao", { href: it.gasto ? "12-gastos.html" : null });
    a.innerHTML = R.icone(it.gasto ? "gastos" : "pessoa");
    var t = R.el("span", "linha-texto");
    t.appendChild(texto("linha-nome", it.nome));
    t.appendChild(texto("linha-sub", it.dono));
    if (it.gasto) t.appendChild(R.tx("span", "linha-sub", "rumo.t11.ver_gastos"));
    a.appendChild(t);
    a.insertAdjacentHTML("beforeend", R.icone("direita"));
    li.appendChild(a);
    document.getElementById("quem-leva").appendChild(li);
  });

  var ver = document.getElementById("ver-convidado");
  ver.innerHTML = R.icone("pessoa");
  ver.appendChild(R.tx("span", "linha-texto", "acao.ver_convidado"));
  ver.insertAdjacentHTML("beforeend", R.icone("direita"));

  refs.acoes.lembrar.addEventListener("click", function () {
    var m = document.getElementById("lembrado");
    m.innerHTML = R.icone("ciente");
    m.appendChild(R.tx("span", null, "rumo.t11.lembrado"));
    cg.anunciar(R.texto("rumo.t11.lembrado"));
  });
})();
</script>
</body>
</html>
