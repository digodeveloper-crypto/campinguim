<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.7"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="7">
<main class="rumo">
  <header class="etapa">
    <div class="etapa-linha">
      <div class="etapa-texto">
        <p class="etapa-marca"></p>
        <h1 class="titulo-tela" data-texto="rumo.t7.titulo"></h1>
        <p class="etapa-sub" data-dado="camping.nome"></p>
      </div>
      <span id="mascote"></span>
    </div>
    <p class="selo selo--espaco"><span class="selo-linha" id="confirmado"></span></p>
  </header>

  <section class="bloco" aria-labelledby="regras-titulo">
    <h2 class="bloco-titulo" id="regras-titulo"></h2>
    <ul class="folha" id="regras"></ul>
  </section>

  <section class="bloco" aria-labelledby="faltou-titulo">
    <h2 class="bloco-titulo" id="faltou-titulo"></h2>
    <ul class="folha" id="faltou" aria-live="polite"></ul>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  var refs = R.montar({
    parada: "camping",
    icone: false,
    acoes: [{ id: "faltou-algo", chave: "acao.faltou_algo", icone: "faltou" }]
  });
  document.getElementById("mascote").replaceWith(R.mascote("pose-camping", "apoio--cabeca", true));

  var conf = document.getElementById("confirmado");
  conf.setAttribute("data-texto", "mensagem.confirmado_por");
  conf.setAttribute("data-valores", JSON.stringify({ n: D.estadia.confirmacoes }));

  function titulo(id, ico, chave) {
    var h = document.getElementById(id);
    h.innerHTML = R.icone(ico);
    h.appendChild(R.tx("span", null, chave));
  }
  titulo("regras-titulo", "regra", "bloco.regras_a_mao");
  titulo("faltou-titulo", "faltou", "bloco.faltou");

  /* Regras à mão: o nível dos alertas vem de dados.js; "Som até 22h" abre o fato (7 → 10). */
  function nivelDe(r) {
    if (r.origem !== "alerta") return null;
    for (var i = 0; i < D.alertas.length; i++) if (D.alertas[i].id === r.id) return D.alertas[i].nivel;
    return null;
  }
  D.estadia.regrasAMao.forEach(function (r) {
    var nivel = nivelDe(r);
    var li = R.el("li", "linha" + (nivel === "atencao" ? " linha--atencao" : ""));
    var corpo = r.fato ? R.el("a", "linha-ligacao", { href: "10-fato.html?de=07-estadia" }) : R.el("span", "linha-ligacao");
    corpo.innerHTML = R.icone(nivel === "atencao" ? "atencao" : nivel === "informacao" ? "info" : "regra");
    var t = R.el("span", "linha-texto");
    var nome = R.el("span", "linha-nome");
    nome.textContent = r.texto;
    t.appendChild(nome);
    if (nivel === "atencao") t.appendChild(R.tx("span", "linha-sub nivel--atencao", "nivel.atencao"));
    if (r.fato) t.appendChild(R.tx("span", "linha-sub", R.contagem("rumo.t10.confirmacoes", D.fato.confirmacoes), { n: D.fato.confirmacoes }));
    corpo.appendChild(t);
    if (r.fato) corpo.insertAdjacentHTML("beforeend", R.icone("direita"));
    li.appendChild(corpo);
    document.getElementById("regras").appendChild(li);
  });

  /* Faltou: em dois toques (abrir e escolher) o item entra em "faltou" (E1-09). */
  var faltou = D.estadia.faltou.slice();
  var lista = document.getElementById("faltou");
  function desenharFaltou() {
    lista.innerHTML = "";
    if (!faltou.length) {
      lista.appendChild(R.tx("li", "vazio", "rumo.t7.faltou_vazio"));
      return;
    }
    faltou.forEach(function (nome) {
      var li = R.el("li", "linha");
      var t = R.el("span", "linha-texto");
      var n = R.el("span", "linha-nome");
      n.textContent = nome;
      t.appendChild(n);
      var est = R.el("span", "estado estado--faltou");
      est.innerHTML = R.icone("faltou", true);
      est.appendChild(R.tx("span", null, "estado.faltou"));
      t.appendChild(est);
      li.appendChild(t);
      lista.appendChild(li);
    });
  }
  desenharFaltou();

  var painel = R.painel({ id: "faltou-painel", titulo: "rumo.t7.painel_titulo" });
  function anotar(nome) {
    if (!nome) return;
    faltou.push(nome);
    painel.fechar();
    desenharFaltou();
    cg.anunciar(R.texto("rumo.t7.anotado", { nome: nome }));
  }
  var campo = R.el("label", "campo");
  campo.appendChild(R.tx("span", "campo-rotulo", "rumo.t7.escrever"));
  var entrada = R.el("input", "entrada", { type: "text", autocomplete: "off" });
  campo.appendChild(entrada);
  painel.corpo.appendChild(campo);
  var anotarBotao = R.el("button", "botao botao--principal botao--bloco", { type: "button" });
  anotarBotao.appendChild(R.tx("span", null, "rumo.acao.anotar"));
  anotarBotao.addEventListener("click", function () { anotar(entrada.value.trim()); entrada.value = ""; });
  painel.corpo.appendChild(anotarBotao);
  painel.corpo.appendChild(R.tx("p", "rotulo rotulo--espaco", "rumo.t7.da_lista"));
  D.lista.categorias.forEach(function (c) {
    var itens = cg.itens().filter(function (i) { return i.categoria === c.id; });
    var folha = R.el("ul", "folha");
    itens.forEach(function (i) {
      var li = R.el("li");
      var b = R.el("button", "resultado", { type: "button" });
      var s = R.el("span", "resultado-texto");
      s.textContent = i.nome;
      b.appendChild(s);
      b.insertAdjacentHTML("beforeend", R.icone("faltou"));
      b.addEventListener("click", function () { anotar(i.nome); });
      li.appendChild(b);
      folha.appendChild(li);
    });
    var r = R.recolhivel("faltou-" + c.id, false, [R.tx("span", "cat-nome", "categoria." + c.id)], folha);
    painel.corpo.appendChild(r.secao);
  });
  refs.acoes["faltou-algo"].addEventListener("click", painel.abrir);
})();
</script>
</body>
</html>
