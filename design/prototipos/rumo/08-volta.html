<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.8"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="8">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca"></p>
    <h1 class="titulo-tela" data-texto="rumo.t8.titulo"></h1>
    <p class="etapa-sub" data-texto="rumo.t8.intro"></p>
  </header>

  <section class="progresso" aria-live="polite">
    <p class="progresso-numero"><strong id="prog-total"></strong></p>
    <div id="prog-regua"></div>
  </section>

  <section class="bloco" aria-labelledby="desmontagem-titulo">
    <h2 class="bloco-titulo" id="desmontagem-titulo"></h2>
    <ul class="folha" id="desmontagem"></ul>
  </section>

  <section class="bloco" aria-labelledby="casa-titulo">
    <h2 class="bloco-titulo" id="casa-titulo"></h2>
    <ul class="folha" id="em-casa"></ul>
  </section>

  <section class="bloco" aria-labelledby="conferir-titulo">
    <h2 class="bloco-titulo" id="conferir-titulo"></h2>
    <div id="categorias"></div>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  R.montar({
    parada: "volta",
    icone: true,
    acoes: [{ id: "concluir", chave: "acao.concluir", href: "09-em-casa.html", icone: "casa" }]
  });

  function titulo(id, ico, chave) {
    var h = document.getElementById(id);
    h.innerHTML = R.icone(ico);
    h.appendChild(R.tx("span", null, chave));
  }
  titulo("desmontagem-titulo", "barraca", "bloco.desmontagem");
  titulo("casa-titulo", "casa", "bloco.em_casa");
  titulo("conferir-titulo", "conferido", "bloco.conferir_volta");

  /* Desmontagem: tarefas com "feito". */
  D.volta.desmontagem.forEach(function (tarefa) {
    var li = R.el("li", "linha");
    var t = R.el("span", "linha-texto");
    t.textContent = tarefa;
    li.appendChild(t);
    var b = R.el("button", "marca", { type: "button", "aria-pressed": "false", "data-texto-aria": "rumo.alternar.feito", "data-valores": JSON.stringify({ tarefa: tarefa }) });
    b.innerHTML = R.icone("ciente");
    b.appendChild(R.tx("span", null, "estado.feito"));
    b.addEventListener("click", function () {
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    });
    li.appendChild(b);
    document.getElementById("desmontagem").appendChild(li);
  });
  D.volta.emCasa.forEach(function (tarefa) {
    var li = R.el("li", "linha");
    li.innerHTML = R.icone("casa");
    var t = R.el("span", "linha-texto");
    t.textContent = tarefa;
    li.appendChild(t);
    document.getElementById("em-casa").appendChild(li);
  });

  /* Conferir o que volta: os 68 itens, todos "não conferido" e destacados no início (E1-10, D-05). */
  var conferido = {}, secar = {};
  cg.itens().forEach(function (i) { conferido[i.id] = D.volta.conferidoInicial; secar[i.id] = D.volta.secarInicial; });
  var abertas = {};
  D.lista.categorias.forEach(function (c, n) { abertas[c.id] = n === 0; });

  function contar(idCat) {
    var r = { feitos: 0, total: 0 };
    cg.itens().forEach(function (i) {
      if (idCat && i.categoria !== idCat) return;
      r.total++;
      if (conferido[i.id]) r.feitos++;
    });
    return r;
  }

  function linha(item) {
    var ok = conferido[item.id];
    var li = R.el("li", "item" + (ok ? "" : " item--pendente"), { "data-id": item.id });
    var t = R.el("span", "item-abrir");
    var nome = R.el("span", "item-nome");
    nome.textContent = item.nome;
    var meta = R.el("span", "item-meta");
    var q = R.el("span", "item-qtd");
    q.textContent = item.quantidadeTexto;
    meta.appendChild(q);
    var est = R.el("span", "estado " + (ok ? "estado--conferido" : "estado--nao-conferido"));
    est.innerHTML = R.icone("conferido", ok);
    est.appendChild(R.tx("span", null, ok ? "estado.conferido" : "estado.nao_conferido"));
    meta.appendChild(est);
    if (secar[item.id]) {
      var s = R.el("span", "estado estado--carro");
      s.innerHTML = R.icone("secar", true);
      s.appendChild(R.tx("span", null, "estado.secar"));
      meta.appendChild(s);
      meta.appendChild(R.tx("span", null, "mensagem.lembrete", { dias: D.volta.lembreteDias }));
    }
    t.appendChild(nome);
    t.appendChild(meta);
    li.appendChild(t);
    var botoes = R.el("div", "item-botoes", { role: "group", "aria-label": item.nome });
    var bC = R.botaoAlternar("conferido", "rumo.alternar.conferido", { nome: item.nome }, ok);
    var bS = R.botaoAlternar("secar", "rumo.alternar.secar", { nome: item.nome }, secar[item.id]);
    bC.addEventListener("click", function () { conferido[item.id] = !conferido[item.id]; atualizar(item, ".alt-conferido"); });
    bS.addEventListener("click", function () { secar[item.id] = !secar[item.id]; atualizar(item, ".alt-secar"); });
    botoes.appendChild(bC);
    botoes.appendChild(bS);
    li.appendChild(botoes);
    return li;
  }

  function atualizar(item, foco) {
    desenhar();
    var alvo = document.querySelector('.item[data-id="' + item.id + '"] ' + foco);
    if (alvo) alvo.focus();
  }

  function desenhar() {
    var p = contar();
    var total = document.getElementById("prog-total");
    total.setAttribute("data-texto", "mensagem.progresso_conferidos");
    total.setAttribute("data-valores", JSON.stringify({ feitos: p.feitos, total: p.total }));
    var regua = document.getElementById("prog-regua");
    regua.innerHTML = "";
    regua.appendChild(R.regua(p.feitos, p.total, "regua--volta"));

    var caixa = document.getElementById("categorias");
    caixa.innerHTML = "";
    D.lista.categorias.forEach(function (c) {
      var folha = R.el("ul", "folha");
      cg.itens().filter(function (i) { return i.categoria === c.id; }).forEach(function (i) { folha.appendChild(linha(i)); });
      var pc = contar(c.id);
      var prog = R.el("span", "cat-prog");
      prog.appendChild(R.regua(pc.feitos, pc.total, "regua--curta regua--volta"));
      prog.appendChild(R.tx("span", null, "mensagem.progresso_conferidos", { feitos: pc.feitos, total: pc.total }));
      var r = R.recolhivel("volta-" + c.id, abertas[c.id], [R.tx("span", "cat-nome", "categoria." + c.id), prog], folha);
      r.botao.addEventListener("click", function () { abertas[c.id] = r.botao.getAttribute("aria-expanded") === "true"; });
      caixa.appendChild(r.secao);
    });
  }
  desenhar();
})();
</script>
</body>
</html>
