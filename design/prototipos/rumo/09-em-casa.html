<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.9"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="9">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca"></p>
    <h1 class="titulo-tela" data-texto="rumo.t9.titulo"></h1>
  </header>

  <ol class="passos" id="passos" aria-hidden="true"></ol>

  <section class="bloco passo-secao" id="passo-1" aria-labelledby="p1-titulo">
    <p class="rotulo" id="p1-n"></p>
    <h2 class="subtitulo" id="p1-titulo" tabindex="-1" data-texto="bloco.sobrou_faltou"></h2>
    <ul class="folha bloco" id="consumiveis"></ul>
  </section>

  <section class="bloco passo-secao" id="passo-2" aria-labelledby="p2-titulo" hidden>
    <p class="rotulo" id="p2-n"></p>
    <h2 class="subtitulo" id="p2-titulo" tabindex="-1" data-texto="bloco.pergunta_camping"></h2>
    <div class="folha bloco pergunta">
      <p class="selo selo--folha"><span class="selo-linha" id="contador"></span></p>
      <p class="pergunta-texto" data-texto="pergunta.regras_cumpridas"></p>
      <p class="subtitulo" data-dado="emCasa.passo2.regra"></p>
      <div class="opcoes" id="sim-nao" role="group" aria-labelledby="p2-titulo"></div>
    </div>
    <h3 class="campo-rotulo bloco" id="como-titulo" data-texto="campo.responder_como"></h3>
    <div class="opcoes" id="como" role="group" aria-labelledby="como-titulo"></div>
  </section>

  <section class="bloco passo-secao" id="passo-3" aria-labelledby="p3-titulo" hidden>
    <p class="rotulo" id="p3-n"></p>
    <h2 class="subtitulo" id="p3-titulo" tabindex="-1" data-texto="bloco.sugestao"></h2>
    <p class="bloco" id="p3-pergunta" data-texto="pergunta.sugestao"></p>
    <div class="opcoes bloco" id="sugestoes" role="group" aria-labelledby="p3-pergunta"></div>
    <label class="campo bloco">
      <span class="campo-rotulo" data-texto="campo.sugestao"></span>
      <textarea class="entrada" id="sugestao" rows="3"></textarea>
    </label>
  </section>

  <section class="bloco" id="fim" hidden>
    <div class="folha">
      <p class="linha" id="fim-registrada"></p>
      <p class="linha" id="fim-texto"></p>
    </div>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  var refs = R.montar({
    parada: "casa",
    icone: true,
    acoes: [{ id: "pular", chave: "acao.pular", tipo: "secundaria" }, { id: "seguir", chave: "acao.proxima" }]
  });
  var E = D.emCasa;
  var TOTAL = 3;
  var passo = 1;

  /* Os três passos como sub-rota: um ponto por passo. */
  var passos = document.getElementById("passos");
  for (var i = 1; i <= TOTAL; i++) passos.appendChild(R.el("li", "passo-ponto"));
  [1, 2, 3].forEach(function (n) {
    var el = document.getElementById("p" + n + "-n");
    el.setAttribute("data-texto", "rumo.t9.passo");
    el.setAttribute("data-valores", JSON.stringify({ n: n, total: TOTAL }));
  });

  function exclusivo(caixa, opcoes, aoEscolher) {
    opcoes.forEach(function (o) {
      var b = R.el("button", "opcao", { type: "button", "aria-pressed": "false" });
      if (o.aria) {
        b.setAttribute("data-texto-aria", o.aria.chave);
        b.setAttribute("data-valores", JSON.stringify(o.aria.valores));
      }
      if (o.chave) b.appendChild(R.tx("span", null, o.chave));
      else b.appendChild(R.el("span")).textContent = o.texto;
      b.addEventListener("click", function () {
        var ligado = b.getAttribute("aria-pressed") === "true";
        Array.prototype.forEach.call(caixa.querySelectorAll(".opcao"), function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", ligado ? "false" : "true");
        if (aoEscolher) aoEscolher();
      });
      caixa.appendChild(b);
    });
  }

  /* Passo 1 · sobrou e faltou: nenhum marcado no início. */
  E.passo1.itens.forEach(function (it) {
    var li = R.el("li", "linha linha--empilhada");
    var t = R.el("span", "linha-texto");
    var n = R.el("span", "linha-nome");
    n.textContent = it.nome;
    t.appendChild(n);
    t.appendChild(R.tx("span", "linha-sub", "rumo.t9.levado", { q: it.levado }));
    li.appendChild(t);
    var op = R.el("div", "opcoes", { role: "group", "aria-label": it.nome });
    exclusivo(op, [
      { chave: "estado.sobrou", aria: { chave: "rumo.t9.opcao_aria", valores: { nome: it.nome, opcao: R.texto("estado.sobrou") } } },
      { chave: "estado.faltou", aria: { chave: "rumo.t9.opcao_aria", valores: { nome: it.nome, opcao: R.texto("estado.faltou") } } }
    ]);
    li.appendChild(op);
    document.getElementById("consumiveis").appendChild(li);
  });

  /* Passo 2 · pergunta do camping (P-16: 1 de 4; "próxima" leva à sugestão). */
  var cont = document.getElementById("contador");
  cont.setAttribute("data-texto", "mensagem.contador");
  cont.setAttribute("data-valores", JSON.stringify({ atual: E.passo2.atual, total: E.passo2.total }));
  exclusivo(document.getElementById("sim-nao"), [{ chave: "opcao.sim" }, { chave: "opcao.nao" }]);
  exclusivo(document.getElementById("como"), E.passo2.responderComo.map(function (t) { return { texto: t }; }));

  /* Passo 3 · sugestão opcional. */
  var sug = document.getElementById("sugestoes");
  E.passo3.opcoes.forEach(function (o) {
    var b = R.el("button", "opcao", { type: "button", "aria-pressed": "false" });
    b.appendChild(R.el("span")).textContent = o;
    b.addEventListener("click", function () {
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    });
    sug.appendChild(b);
  });
  var area = document.getElementById("sugestao");
  area.value = E.passo3.texto;
  area.maxLength = E.passo3.limiteCaracteres;

  var pular = refs.acoes.pular, seguir = refs.acoes.seguir;

  function mostrar(n, enviado) {
    passo = n;
    [1, 2, 3].forEach(function (k) { document.getElementById("passo-" + k).hidden = k !== n; });
    Array.prototype.forEach.call(passos.children, function (p, k) {
      p.className = "passo-ponto" + (k + 1 === n ? " passo-ponto--atual" : k + 1 < n || n > TOTAL ? " passo-ponto--feito" : "");
    });
    var fim = n > TOTAL;
    document.getElementById("fim").hidden = !fim;
    refs.rodape.querySelector(".rodape-acoes").hidden = fim;
    if (fim) {
      var reg = document.getElementById("fim-registrada");
      reg.innerHTML = "";
      if (enviado) {
        reg.innerHTML = R.icone("ciente");
        reg.appendChild(R.tx("span", null, "mensagem.sugestao_registrada"));
      }
      reg.hidden = !enviado;
      var ft = document.getElementById("fim-texto");
      ft.innerHTML = R.icone("casa");
      ft.appendChild(R.tx("span", null, "rumo.t9.fim"));
      cg.anunciar(R.texto(enviado ? "mensagem.sugestao_registrada" : "rumo.t9.fim"));
      return;
    }
    seguir.querySelector(".botao-texto").setAttribute("data-texto", n === TOTAL ? "acao.enviar" : "acao.proxima");
    var h = document.getElementById("p" + n + "-titulo");
    if (h && document.activeElement && document.activeElement.closest && document.activeElement.closest(".rodape")) h.focus();
  }
  pular.addEventListener("click", function () { mostrar(passo + 1, false); });
  seguir.addEventListener("click", function () { mostrar(passo + 1, passo === TOTAL); });
  mostrar(1);
})();
</script>
</body>
</html>
