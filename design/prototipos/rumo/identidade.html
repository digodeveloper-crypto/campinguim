<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.identidade"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="identidade">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca" data-texto="tela.identidade"></p>
    <h1 class="titulo-tela" data-texto="direcao.nome"></h1>
  </header>

  <!-- 1. Nome, território e frase -->
  <section class="id-bloco" aria-labelledby="b1">
    <h2 class="bloco-titulo" id="b1" data-texto="rumo.id.b1"></h2>
    <p class="subtitulo" data-texto="direcao.territorio"></p>
    <p class="id-tom" data-texto="direcao.frase"></p>
  </section>

  <!-- 2. Paleta -->
  <section class="id-bloco" aria-labelledby="b2">
    <h2 class="bloco-titulo" id="b2" data-texto="rumo.id.b2"></h2>
    <p class="suave" data-texto="rumo.id.b2_intro"></p>
    <p class="id-tom" id="paleta-oficial"></p>
    <table class="id-tabela bloco">
      <thead><tr><th data-texto="rumo.id.papel"></th><th data-texto="rumo.id.claro"></th><th data-texto="rumo.id.escuro"></th></tr></thead>
      <tbody id="paleta"></tbody>
    </table>
    <table class="id-tabela bloco">
      <thead><tr><th data-texto="rumo.id.par"></th><th data-texto="rumo.id.claro"></th><th data-texto="rumo.id.escuro"></th></tr></thead>
      <tbody id="pares"></tbody>
    </table>
    <a class="linha-ligacao ligacao-solta" href="paletas.html" id="ver-paletas"></a>
  </section>

  <!-- 3. Tipografia -->
  <section class="id-bloco" aria-labelledby="b3">
    <h2 class="bloco-titulo" id="b3" data-texto="rumo.id.b3"></h2>
    <p class="subtitulo" data-texto="rumo.id.familia"></p>
    <p class="suave" data-texto="rumo.id.familia_uso"></p>
    <ul class="id-lista bloco">
      <li><span class="rotulo" data-texto="rumo.id.escala.1"></span><p class="titulo-tela" data-texto="rumo.id.amostra.1"></p></li>
      <li><span class="rotulo" data-texto="rumo.id.escala.2"></span><p class="subtitulo" data-texto="rumo.id.amostra.2"></p></li>
      <li><span class="rotulo" data-texto="rumo.id.escala.3"></span><p data-texto="rumo.id.amostra.3"></p></li>
      <li><span class="rotulo" data-texto="rumo.id.escala.4"></span><p class="rotulo" data-texto="rumo.id.amostra.4"></p></li>
    </ul>
    <p class="bloco" data-texto="rumo.id.licenca"></p>
    <a class="linha-ligacao ligacao-solta ligacao-caminho" href="../_compartilhado/fontes/archivo/OFL.txt" id="ofl"></a>
  </section>

  <!-- 4. Ícones -->
  <section class="id-bloco" aria-labelledby="b4">
    <h2 class="bloco-titulo" id="b4" data-texto="rumo.id.b4"></h2>
    <p class="suave" data-texto="rumo.id.b4_intro"></p>
    <ul class="id-icones bloco" id="icones"></ul>
  </section>

  <!-- 5. Navegação -->
  <section class="id-bloco" aria-labelledby="b5">
    <h2 class="bloco-titulo" id="b5" data-texto="rumo.id.b5"></h2>
    <p data-texto="rumo.id.b5_frase"></p>
    <div class="id-esquema" aria-hidden="true">
      <div class="id-esquema-rota"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="id-esquema-corpo" data-texto="rumo.id.esquema_rolagem"></div>
      <div class="id-esquema-pe">
        <div class="id-esquema-acao" data-texto="rumo.id.esquema_acao"></div>
        <div class="id-esquema-legenda" data-texto="rumo.legenda.botao"></div>
      </div>
    </div>
    <p class="suave bloco" data-texto="rumo.id.b5_mapa"></p>
  </section>

  <!-- 6. Mascote -->
  <section class="id-bloco" aria-labelledby="b6">
    <h2 class="bloco-titulo" id="b6" data-texto="rumo.id.b6"></h2>
    <p class="suave" data-texto="rumo.id.b6_intro"></p>
    <ul class="id-mascotes bloco" id="mascotes"></ul>
  </section>

  <!-- 7. Tom de voz -->
  <section class="id-bloco" aria-labelledby="b7">
    <h2 class="bloco-titulo" id="b7" data-texto="rumo.id.b7"></h2>
    <p class="suave" data-texto="rumo.id.b7_intro"></p>
    <p class="id-tom" data-texto="rumo.tom.1"></p>
    <p class="id-tom" id="tom2"></p>
    <p class="id-tom" id="tom3"></p>
  </section>

  <!-- 8. Origem da inspiração e riscos -->
  <section class="id-bloco" aria-labelledby="b8">
    <h2 class="bloco-titulo" id="b8" data-texto="rumo.id.b8"></h2>
    <p data-texto="rumo.id.origem"></p>
    <ul class="id-lista bloco">
      <li data-texto="rumo.id.risco.1"></li>
      <li data-texto="rumo.id.risco.2"></li>
      <li data-texto="rumo.id.risco.3"></li>
      <li data-texto="rumo.id.risco.4"></li>
    </ul>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  R.montar({ rota: false, legenda: false });

  /* ---- Paleta: valores lidos de estilo.css nos dois temas; contraste pela fórmula das WCAG 2.x. ---- */
  var PAPEIS = ["fundo", "superficie", "texto", "texto-suave", "linha", "acento", "sobre-acento", "atencao", "separei", "carro"];
  var raiz = document.documentElement;
  function ler(tema) {
    var antes = raiz.getAttribute("data-tema");
    raiz.setAttribute("data-tema", tema);
    var cs = getComputedStyle(raiz), r = {};
    PAPEIS.forEach(function (p) { r[p] = cs.getPropertyValue("--" + p).trim().toUpperCase(); });
    raiz.setAttribute("data-tema", antes);
    return r;
  }
  var CL = ler("claro"), ES = ler("escuro");
  function lum(hex) {
    var v = [1, 3, 5].map(function (i) {
      var c = parseInt(hex.substr(i, 2), 16) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function razao(a, b) {
    var x = lum(a), y = lum(b);
    var k = (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    return R.texto("rumo.id.razao", { k: k.toFixed(2).replace(".", ",") });
  }
  function celula(tag, conteudo, rotulo) {
    var c = R.el(tag, null, { "data-rotulo": rotulo ? R.texto(rotulo) : null });
    if (typeof conteudo === "string") c.textContent = conteudo; else c.appendChild(conteudo);
    return c;
  }
  function amostra(hex) {
    var s = R.el("span");
    var q = R.el("span", "amostra-cor", { "aria-hidden": "true" });
    q.style.background = hex;
    s.appendChild(q);
    s.appendChild(document.createTextNode(hex));
    return s;
  }
  var paleta = document.getElementById("paleta");
  PAPEIS.forEach(function (p) {
    var tr = R.el("tr");
    tr.appendChild(R.tx("td", null, "rumo.id.papel." + p));
    tr.appendChild(celula("td", amostra(CL[p]), "rumo.id.claro"));
    tr.appendChild(celula("td", amostra(ES[p]), "rumo.id.escuro"));
    paleta.appendChild(tr);
  });
  var PARES = [
    ["texto_fundo", "texto", "fundo"], ["texto_superficie", "texto", "superficie"],
    ["suave_fundo", "texto-suave", "fundo"], ["suave_superficie", "texto-suave", "superficie"],
    ["sobre_acento", "sobre-acento", "acento"], ["acento_fundo", "acento", "fundo"],
    ["linha_superficie", "linha", "superficie"], ["linha_fundo", "linha", "fundo"],
    ["atencao_superficie", "atencao", "superficie"], ["atencao_fundo", "atencao", "fundo"],
    ["separei_superficie", "separei", "superficie"], ["separei_fundo", "separei", "fundo"],
    ["carro_superficie", "carro", "superficie"], ["carro_fundo", "carro", "fundo"]
  ];
  var pares = document.getElementById("pares");
  PARES.forEach(function (p) {
    var tr = R.el("tr");
    tr.appendChild(R.tx("td", null, "rumo.id.par." + p[0]));
    tr.appendChild(celula("td", razao(CL[p[1]], CL[p[2]]), "rumo.id.claro"));
    tr.appendChild(celula("td", razao(ES[p[1]], ES[p[2]]), "rumo.id.escuro"));
    pares.appendChild(tr);
  });
  /* Apoio do mascote no escuro: corpo contra o papel (o apoio usa o papel "texto" do tema escuro). */
  var corpo = R.texto("rumo.id.corpo");
  var trM = R.el("tr");
  trM.appendChild(R.tx("td", null, "rumo.id.par.mascote_apoio", { corpo: corpo }));
  trM.appendChild(R.tx("td", null, "rumo.id.uso.apoio_claro"));
  trM.appendChild(celula("td", razao(corpo, ES.texto), "rumo.id.escuro"));
  pares.appendChild(trM);

  /* Qual paleta a tabela mostra: a oficial (Eucalipto, a padrão) ou outra, aberta só para comparar. */
  var P = window.RUMO_PALETA, oficial = document.getElementById("paleta-oficial");
  if (P.atual === P.padrao) {
    oficial.setAttribute("data-texto", "rumo.id.oficial");
  } else {
    oficial.setAttribute("data-texto", "rumo.id.comparando");
    oficial.setAttribute("data-valores", JSON.stringify({ nome: R.texto("rumo.pal.nome." + P.atual) }));
  }

  var verPaletas = document.getElementById("ver-paletas");
  verPaletas.innerHTML = R.icone("legenda");
  verPaletas.appendChild(R.tx("span", "linha-texto", "rumo.id.paletas"));
  verPaletas.insertAdjacentHTML("beforeend", R.icone("direita"));

  var ofl = document.getElementById("ofl");
  ofl.innerHTML = R.icone("tarefa");
  ofl.appendChild(R.tx("span", "linha-texto", "rumo.id.licenca_link"));

  /* ---- Ícones: os de estado em repouso e ativos. ---- */
  var ul = document.getElementById("icones");
  R.ordem.forEach(function (nome) {
    var temAtivo = !!R.icones[nome].ativo;
    var li = R.el("li", "id-icone");
    li.innerHTML = R.icone(nome) + (temAtivo ? R.icone(nome, true) : "");
    var t = R.el("span", "linha-texto");
    t.appendChild(R.tx("span", "linha-nome", "rumo.ico." + nome));
    if (temAtivo) t.appendChild(R.tx("span", "linha-sub", "rumo.id.estados_ativo"));
    li.appendChild(t);
    ul.appendChild(li);
  });

  /* ---- Mascote: poses usadas, onde, o apoio do escuro e a uma-cor na tinta da direção. ---- */
  var mas = document.getElementById("mascotes");
  [["principal", "rumo.id.uso.principal", "apoio--id"], ["icone", "rumo.id.uso.icone", "apoio--rota"],
    ["pose-alerta", "rumo.id.uso.alerta", "apoio--id"], ["pose-camping", "rumo.id.uso.camping", "apoio--id"],
    ["pose-comemorando", "rumo.id.uso.comemorando", "apoio--id"], ["uma-cor", "rumo.id.uso.uma_cor", null]].forEach(function (m) {
    var li = R.el("li", "id-mascote" + (m[2] ? "" : " id-mascote--uma-cor"));
    if (m[2]) li.appendChild(R.mascote(m[0], m[2], true));
    else li.appendChild(R.el("span", null, { "data-mascote": m[0], "data-mascote-texto": "" }));
    li.appendChild(R.tx("p", "linha-sub", m[1]));
    mas.appendChild(li);
  });
  var apoio = R.tx("li", "id-mascote linha-sub", "rumo.id.uso.apoio");
  mas.appendChild(apoio);

  /* ---- Tom de voz: frases com os dados do cenário. ---- */
  var t2 = document.getElementById("tom2");
  t2.setAttribute("data-texto", "rumo.tom.2");
  t2.setAttribute("data-valores", JSON.stringify({ camping: D.camping.nome, n: D.camping.confirmacoes }));
  var t3 = document.getElementById("tom3");
  t3.setAttribute("data-texto", "rumo.tom.3");
  t3.setAttribute("data-valores", JSON.stringify({ fato: D.fato.nome, valor: D.fato.valor, n: D.fato.confirmacoes, nome: D.fato.ultima.nome, mes: D.fato.ultima.mesAno }));
})();
</script>
</body>
</html>
