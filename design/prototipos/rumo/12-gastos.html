<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-texto="rumo.titulo.12"></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_compartilhado/base.css">
<link rel="stylesheet" href="estilo.css">
<script src="paleta.js"></script>
</head>
<body data-tela="12">
<main class="rumo">
  <header class="etapa">
    <p class="etapa-marca"></p>
    <h1 class="titulo-tela" data-texto="rumo.t12.titulo"></h1>
    <p class="etapa-sub" data-dado="grupo.nomeViagem.texto"></p>
  </header>

  <section class="bloco" aria-labelledby="item-titulo">
    <h2 class="bloco-titulo" id="item-titulo" data-texto="rumo.t12.item"></h2>
    <div class="folha gasto">
      <div class="gasto-cabeca">
        <span class="subtitulo" data-dado="gastos.item"></span>
      </div>
      <dl class="gasto-dados">
        <div><dt data-texto="gastos.comprou"></dt><dd data-dado="gastos.comprou"></dd></div>
        <div><dt data-texto="gastos.valor"></dt><dd data-dinheiro="gastos.totalCentavos"></dd></div>
      </dl>
      <p class="gasto-regra suave" data-texto="gastos.regra"></p>
      <p class="gasto-cotas" id="cotas-de"></p>
    </div>
  </section>

  <section class="bloco" aria-labelledby="divisao-titulo">
    <h2 class="bloco-titulo" id="divisao-titulo" data-texto="rumo.t12.divisao"></h2>
    <ul class="folha" id="familias"></ul>
    <p class="recebe" id="recebe"></p>
  </section>

  <section class="bloco" aria-labelledby="parte-titulo">
    <h2 class="bloco-titulo" id="parte-titulo" data-texto="rumo.t12.sua_parte"></h2>
    <div class="folha parte">
      <p class="parte-devem" id="devem"></p>
      <dl class="gasto-dados">
        <div><dt data-texto="campo.chave_pix"></dt><dd class="chave" data-dado="gastos.usuaria.pix.chave"></dd></div>
      </dl>
      <div class="parte-acoes">
        <button type="button" class="marca" id="copiar-valor"></button>
        <button type="button" class="marca" id="paguei" aria-pressed="false"></button>
      </div>
      <p class="mensagem" id="copiado" aria-live="polite"></p>
    </div>
  </section>
</main>
<script src="../_compartilhado/dados.js"></script>
<script src="../_compartilhado/textos.js"></script>
<script src="../_compartilhado/mascote.js"></script>
<script src="textos.js"></script>
<script src="icones.js"></script>
<script src="ficha.js"></script>
<script src="../_compartilhado/base.js"></script>
<script>
(function () {
  "use strict";
  var cg = window.CAMPINGUIM, R = window.RUMO, D = cg.dados;
  var G = D.gastos;
  var refs = R.montar({
    parada: null,
    area: "area.gastos",
    voltar: "11-grupo.html",
    acoes: [{ id: "copiar-chave", chave: "acao.copiar_chave", icone: "copiar" }]
  });

  /* Valores lidos de dados.js, já divididos (nada é recalculado aqui). */
  var cotasDe = document.getElementById("cotas-de");
  cotasDe.setAttribute("data-texto", "mensagem.cotas_de");
  cotasDe.setAttribute("data-valores", JSON.stringify({ n: G.cotas, valor: cg.dinheiro(G.cotaCentavos) }));

  G.familias.forEach(function (f) {
    var li = R.el("li", "linha linha--empilhada familia-gasto");
    var t = R.el("span", "linha-texto");
    var n = R.el("span", "linha-nome");
    n.textContent = f.nome;
    var p = R.el("span", "linha-sub");
    p.textContent = f.pessoas;
    t.appendChild(n);
    t.appendChild(p);
    li.appendChild(t);
    var conta = R.el("span", "familia-conta");
    conta.appendChild(R.tx("span", "suave", "mensagem.cotas", { n: f.cotas }));
    var v = R.el("strong", "cg-dinheiro");
    v.textContent = cg.dinheiro(f.valorCentavos);
    conta.appendChild(v);
    var sit = R.el("span", "estado " + (f.situacao === "ja_pago" ? "estado--conferido" : "estado--a_separar"));
    sit.innerHTML = R.icone(f.situacao === "ja_pago" ? "conferido" : "gastos", f.situacao === "ja_pago");
    sit.appendChild(R.tx("span", null, "gastos.situacao." + f.situacao));
    conta.appendChild(sit);
    if (f.comprador) conta.appendChild(R.tx("span", "suave", "gastos.situacao.comprador"));
    li.appendChild(conta);
    document.getElementById("familias").appendChild(li);
  });

  var recebe = document.getElementById("recebe");
  recebe.setAttribute("data-texto", "mensagem.recebe");
  recebe.setAttribute("data-valores", JSON.stringify({ pessoa: G.comprou, valor: cg.dinheiro(G.compradorRecebeCentavos) }));

  var U = G.usuaria;
  var devem = document.getElementById("devem");
  devem.setAttribute("data-texto", "mensagem.voces_devem");
  devem.setAttribute("data-valores", JSON.stringify({ pessoa: U.deveA, valor: cg.dinheiro(U.deveCentavos) }));

  var msg = document.getElementById("copiado");
  function copiar(t) {
    cg.copiar(t).then(function (ok) {
      msg.innerHTML = ok ? R.icone("ciente") : "";
      msg.appendChild(R.tx("span", null, ok ? "mensagem.copiado" : "mensagem.nao_copiado"));
      cg.anunciar(R.texto(ok ? "mensagem.copiado" : "mensagem.nao_copiado"));
    });
  }
  var cv = document.getElementById("copiar-valor");
  cv.innerHTML = R.icone("copiar");
  cv.appendChild(R.tx("span", null, "acao.copiar_valor"));
  cv.addEventListener("click", function () { copiar(cg.dinheiro(U.deveCentavos)); });
  refs.acoes["copiar-chave"].addEventListener("click", function () { copiar(U.pix.chave); });

  /* Paguei (P-12: desmarcado). */
  var pg = document.getElementById("paguei");
  pg.setAttribute("aria-pressed", U.paguei.marcado ? "true" : "false");
  pg.setAttribute("data-texto-aria", "rumo.t12.paguei_aria");
  pg.setAttribute("data-valores", JSON.stringify({ valor: cg.dinheiro(U.deveCentavos), pessoa: U.deveA }));
  pg.innerHTML = R.icone("ciente");
  pg.appendChild(R.tx("span", null, "acao.paguei"));
  pg.addEventListener("click", function () {
    pg.setAttribute("aria-pressed", pg.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });
})();
</script>
</body>
</html>
