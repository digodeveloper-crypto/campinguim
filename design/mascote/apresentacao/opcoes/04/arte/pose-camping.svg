<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Opção 04 · Pictograma de trilha · pose-camping (desconforto: CALOR): sol em semicírculo no canto, duas gotas em losango ao lado da cabeça, asas afastadas a 40°, pés abertos, olhos em traço caído; a mochila fica no chão ao lado. Edição do principal. -->
  <!-- sol: semicírculo no canto superior direito -->
  <path d="M376 44 A56 56 0 0 0 488 44 Z" fill="#E8601C"/>
  <!-- mochila no chão, ao lado, com a faixa da aba -->
  <rect x="24" y="404" width="100" height="76" rx="20" fill="#E8601C"/>
  <rect x="40" y="420" width="68" height="20" rx="10" fill="#FFFFFF"/>
  <!-- gotas em losango ao lado da cabeça -->
  <path d="M164 52 L178 76 L164 100 L150 76 Z" fill="#404246"/>
  <path d="M150 98 L164 122 L150 146 L136 122 Z" fill="#404246"/>
  <!-- cabeça e pescoço -->
  <circle cx="256" cy="102" r="70" fill="#404246"/>
  <rect x="231" y="150" width="50" height="50" fill="#404246"/>
  <!-- asas afastadas a 40° para ventilar -->
  <rect x="160" y="226" width="36" height="170" rx="18" fill="#404246" transform="rotate(40 178 226)"/>
  <rect x="316" y="226" width="36" height="170" rx="18" fill="#404246" transform="rotate(-40 334 226)"/>
  <!-- tronco e barriga -->
  <rect x="166" y="196" width="180" height="212" rx="40" fill="#404246"/>
  <rect x="206" y="212" width="100" height="180" rx="30" fill="#FFFFFF"/>
  <!-- pernas e pés abertos -->
  <rect x="196" y="380" width="34" height="80" fill="#404246"/>
  <rect x="282" y="380" width="34" height="80" fill="#404246"/>
  <rect x="140" y="450" width="90" height="30" rx="15" fill="#E8601C"/>
  <rect x="282" y="450" width="90" height="30" rx="15" fill="#E8601C"/>
  <!-- olhos em traço caído e bico -->
  <rect x="215" y="96" width="32" height="12" rx="6" fill="#FFFFFF" transform="rotate(-12 231 102)"/>
  <rect x="265" y="96" width="32" height="12" rx="6" fill="#FFFFFF" transform="rotate(12 281 102)"/>
  <path d="M234 118 L278 118 L256 150 Z" fill="#E8601C"/>
</svg>
