      <ellipse cx="202" cy="92" rx="14" ry="21" fill="#F4EEE2"/>
      <circle cx="238" cy="92" r="22" fill="#F4EEE2"/>
      <ellipse cx="197" cy="96" rx="8" ry="11" fill="#1C2B3A"/>
      <circle cx="230" cy="96" r="11" fill="#1C2B3A"/>
      <path d="M190 68 L218 68 L218 82 L190 82 Z" fill="#1C2B3A"/>
      <path d="M214 62 L264 62 L264 96 L214 76 Z" fill="#1C2B3A"/>
