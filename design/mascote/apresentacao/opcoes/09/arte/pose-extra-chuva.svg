    <!-- asa de cá erguida, pousada no alto da cabeça (papel sobreposto, com o corte) -->
    <path d="M354.7 184.2 L286.7 52.5 A12 12 0 0 0 264.3 60.8 L298.8 205.0 A30 30 0 1 0 354.7 184.2 Z" fill="#1C2B3A"/>
