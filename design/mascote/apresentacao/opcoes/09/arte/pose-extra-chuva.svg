<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Opção 09 · Caminhante de botas · pose-extra-chuva (anda inclinado contra a chuva, asa pousada no alto da cabeça, cabeça baixa, passo curto) -->
