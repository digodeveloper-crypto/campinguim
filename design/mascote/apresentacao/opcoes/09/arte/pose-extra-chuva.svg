  <path d="M108 480 C99 480 94 474 94 466 L94 460 C94 453 99 448 106 448 L176 442 C196 434 222 434 236 446 C243 452 246 460 246 468 C246 476 240 480 232 480 Z" fill="#C8613A"/>
  <path d="M218.5 361.3 L202.3 435.0 A14 14 0 0 0 228.7 443.8 L260.0 375.1 A22 22 0 1 0 218.5 361.3 Z" fill="#1C2B3A"/>
  <g transform="rotate(-14 262 372)">
    <g clip-path="url(#corte)">
      <!-- peça escura: cabeça baixa e à frente, pescoço e tronco -->
      <path d="M196 146 C184 134 172 118 172 102 C172 72 196 50 226 50 C256 50 280 72 280 102 C280 122 274 136 272 146 C290 150 316 156 334 166 C360 180 372 208 370 244 C368 296 350 338 326 364 C304 392 238 398 212 380 C184 356 164 304 164 246 C164 200 180 164 196 146 Z" fill="#1C2B3A"/>
      <!-- barriga em pera, com fenda no topo -->
      <path d="M210 146 L222 160 L232 146 C250 164 266 214 276 270 C286 326 288 372 270 394 C256 410 214 412 194 396 C172 378 164 334 166 286 C168 222 186 168 210 146 Z" fill="#F4EEE2"/>
