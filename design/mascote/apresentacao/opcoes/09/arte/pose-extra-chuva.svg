    </clipPath>
  </defs>
  <!-- chuva em traços diagonais -->
  <rect x="58" y="40" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 64 64)"/>
  <rect x="44" y="176" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 50 200)"/>
  <rect x="58" y="300" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 64 324)"/>
  <rect x="396" y="28" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 402 52)"/>
  <rect x="436" y="150" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 442 174)"/>
  <rect x="440" y="290" width="12" height="48" rx="6" fill="#1C2B3A" transform="rotate(-24 446 314)"/>
