    <clipPath id="fora">
      <path clip-rule="evenodd" d="M0 0H512V512H0Z M204 128 C192 116 180 100 180 84 C180 54 204 32 234 32 C264 32 288 54 288 84 C288 104 282 118 280 128 C292 144 316 152 334 162 C360 178 372 208 370 244 C368 296 352 344 330 376 C306 410 236 424 204 404 C176 384 160 320 160 250 C160 196 186 152 204 128 Z"/>
