# Fumaça da B2: abre a galeria dos componentes e captura cada seção, para o QA comparar com o protótipo
# Rumo (DSG-06). A galeria só abre no ambiente local. Rode de novo com o aparelho em tema escuro e com a
# letra do sistema em 130 % e 200 % (docs/componentes.md, "Como conferir"); as capturas saem com o mesmo nome.
# Os marcadores {{...}} são trocados pelo executor (scripts/jornadas.mjs).
appId: "{{pacote}}"
---
- launchApp:
    clearState: true
- openLink: "campinguim://galeria"
- extendedWaitUntil:
    visible:
      id: galeria
    timeout: 30000
- assertVisible:
    id: rota
- assertVisible:
    id: g-tema-sistema
# Seção cores
- scrollUntilVisible:
    element:
      id: g-secao-cores
    direction: UP
- tapOn:
    id: g-secao-cores
- scrollUntilVisible:
    element:
      id: galeria-cores
    direction: DOWN
    centerElement: false
- takeScreenshot: galeria-cores
# Seção tipografia
